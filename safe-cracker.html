<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Echo Alpha Delta">
<meta name="application-name" content="Echo Alpha Delta">
<title>Safe Cracker | Echo Alpha Delta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Limelight&family=Special+Elite&display=swap" rel="stylesheet">
<style>
/* A 1930s bank vault: black enamel, brass trim, a steel door, a typewritten docket */
:root { --enamel: #14110d; --brass: #c9a24a; --brass2: #8a6a26; --paper: #efe3c2; --ink: #2a2118; --red: #b8332a;
        --echo: #4a9eff; --alpha: #ff4a4a; --delta: #4aff7a; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--enamel); }
body { color: var(--paper); font-family: 'Special Elite', 'Courier New', monospace; font-size: 15px; -webkit-user-select: none; user-select: none; overscroll-behavior: none; }
a, button { font: inherit; color: inherit; }
.screen { max-width: 480px; margin: 0 auto; padding: 8px 12px 14px; }
.top { display: flex; justify-content: space-between; align-items: center; height: 26px; font-size: 14px; }
.top a { text-decoration: none; color: var(--brass); }
.top button { background: none; border: none; padding: 0; cursor: pointer; color: #9a8a66; }
/* the docket: a slip of paper pinned above the vault */
.docket { margin-top: 6px; background: var(--paper); color: var(--ink); padding: 8px 12px 9px; display: flex; justify-content: space-between; align-items: flex-end; box-shadow: 0 3px 0 #b9ab86; }
.docket .meta { font-size: 12px; line-height: 1.5; }
.docket .ask { font-family: 'Limelight', serif; font-size: 30px; line-height: 1; white-space: nowrap; }
.docket .ask small { font-family: 'Special Elite', monospace; font-size: 13px; display: block; text-align: right; margin-bottom: 3px; }
.docket .ask .e { color: #2f6fc4; } .docket .ask .a { color: #c43a3a; } .docket .ask .d { color: #2f9a52; }
.stage { position: relative; margin-top: 10px; }
.stage:has(.over:not(.hidden)) { min-height: 470px; }      /* room for the start and result screens */
canvas { display: block; margin: 0 auto; touch-action: none; }
.controls { display: grid; grid-template-columns: 1fr; margin-top: 10px; }
.controls button { height: 52px; border: 2px solid var(--brass); background: #1f1a13; color: var(--brass); font-family: 'Limelight', serif; font-size: 22px; cursor: pointer; touch-action: manipulation; }
.controls button.open { background: var(--brass); color: var(--enamel); }
.controls button:active { transform: translateY(2px); }
.over { position: absolute; inset: 0; background: var(--enamel); padding: 16px 16px; overflow: auto; border: 2px solid var(--brass); }
.over.hidden { display: none; }
.over h2 { margin: 0 0 4px; font-family: 'Limelight', serif; font-weight: 400; font-size: 40px; line-height: 1; color: var(--brass); }
.rule { height: 0; border-top: 2px solid var(--brass); border-bottom: 1px solid var(--brass); padding-top: 3px; margin: 8px 0 12px; }
.over p { margin: 0 0 8px; line-height: 1.4; font-size: 14px; }
.over p b { font-weight: 400; color: var(--brass); }
.over .e { color: var(--echo); } .over .a { color: var(--alpha); } .over .d { color: var(--delta); }
.over .go { display: inline-block; margin: 4px 0 14px; padding: 8px 20px 7px; background: var(--brass); color: var(--enamel); font-family: 'Limelight', serif; font-size: 20px; cursor: pointer; }
.big { font-family: 'Limelight', serif; font-size: 40px; color: var(--paper); line-height: 1; margin: 2px 0 2px; }
.lbl { font-size: 13px; color: #9a8a66; margin: 0 0 12px; }
.hs-h { font-size: 13px; color: var(--brass); margin: 10px 0 4px; }
.hs { display: grid; grid-template-columns: 1.8em 3.2em auto; row-gap: 2px; font-size: 15px; }
.hs span:nth-child(3n) { color: var(--brass); }
.hs .me { background: #3a2f1c; }
.ini { display: flex; gap: 10px; align-items: center; margin: 6px 0 12px; }
.ini input { width: 86px; font: inherit; font-size: 26px; letter-spacing: 3px; text-transform: uppercase; background: none; color: var(--paper); border: none; border-bottom: 2px solid var(--brass); border-radius: 0; padding: 0 0 0 4px; }
.ini input:focus { outline: none; }
.ini button { background: var(--brass); color: var(--enamel); border: none; padding: 6px 14px 5px; cursor: pointer; border-radius: 0; }
</style>
</head>
<body>
<div class="screen">
  <div class="top">
    <a href="arcade.html">&lt; ARCADE</a>
    <button id="snd" onclick="toggleSound()">SND ON</button>
  </div>
  <div class="docket">
    <div class="meta" id="meta">SAFE No. 1<br>TUMBLER 1 OF 3</div>
    <div class="ask" id="ask"></div>
  </div>
  <div class="stage">
    <canvas id="cv"></canvas>
    <div class="over" id="over"></div>
  </div>
  <div class="controls">
    <button id="open" class="open">OPEN</button>
  </div>
</div>

<script>
// ---- Music: the grip engine from the Daily Game ---------------------------
const STR_OPEN = [4, 9, 2, 7, 11, 4];
const QUAL_MAP = { '':'major','m':'minor','7':'7','maj7':'Maj7','m7':'m7','sus4':'sus4' };
const QUALITY_INTERVALS_MAIN = {
  major:[0,4,7], minor:[0,3,7], '7':[0,4,7,10], Maj7:[0,4,7,11], m7:[0,3,7,10], sus4:[0,4,7],
};
const TONE_NAMES_MAIN = {
  0:'root',2:'ninth',3:'minor-third',4:'third',5:'fourth',7:'fifth',9:'sixth',10:'seventh',11:'maj7',
};
const GRIP_CONFIG = {
  echo:  { anchor:0, strings:[0,1,2,3,4,5], win:2, upper:[3,4,5] },
  alpha: { anchor:1, strings:[1,2,3,4,5],   win:2, upper:[3,4,5] },
  delta: { anchor:2, strings:[2,3,4,5],      win:3, upper:[5]     },
};

function findFrets(si, pc) {
  const out = [];
  for (let f = 0; f <= 12; f++) if ((STR_OPEN[si] + f) % 12 === pc) out.push(f);
  return out;
}
function computeGripTones(shapeName, qualStr, rootPc) {
  const quality   = QUAL_MAP[qualStr] || 'major';
  const r         = rootPc % 12;
  const intervals = QUALITY_INTERVALS_MAIN[quality];
  const { anchor, strings, win, upper } = GRIP_CONFIG[shapeName];
  const anchorFret = findFrets(anchor, r)[0];
  if (anchorFret === undefined) return new Set();
  const isSus = quality === 'sus4', suppressUpperRoot = quality === '7';
  const echoSlideback = shapeName === 'echo' && quality === 'Maj7';
  const dots = [];
  strings.forEach(s => {
    for (let fo = 0; fo <= win; fo++) {
      let f = anchorFret + fo;
      if (f > 12) f -= 12;
      if (f > 12) continue;
      const noteAtFret = (STR_OPEN[s] + f) % 12;
      intervals.forEach(interval => {
        if (noteAtFret !== (r + interval) % 12) return;
        if (shapeName === 'delta' && (interval === 4 || interval === 3) && s !== 5) return;
        const isThird = interval === 4 || interval === 3;
        const isUpperStr = upper.includes(s);
        const isUpperRoot = interval === 0 && isUpperStr && s !== anchor;
        if (suppressUpperRoot && isUpperRoot && fo > 0) return;
        if (echoSlideback && interval === 11) return;
        if (isSus && isThird && isUpperStr) {
          const sf = f + 1 > 12 ? f - 11 : f + 1;
          dots.push({ s, fret:sf, t:'fourth', isRoot:false });
        } else {
          const t = TONE_NAMES_MAIN[interval] || 'tone';
          dots.push({ s, fret:f, t, isRoot:interval === 0 });
          if (f === 12) dots.push({ s, fret:0,  t, isRoot:interval === 0 });
          if (f === 0)  dots.push({ s, fret:12, t, isRoot:interval === 0 });
        }
      });
    }
  });
  if (echoSlideback) {
    const target = (r + 11) % 12;
    for (let f2 = 0; f2 <= 12; f2++) {
      if ((STR_OPEN[5] + f2) % 12 === target) { dots.push({ s:5, fret:f2, t:'maj7', isRoot:false }); break; }
    }
  }
  const byStr = {};
  dots.forEach(d => { (byStr[d.s] = byStr[d.s] || []).push(d); });
  const priority = ['sixth','ninth','seventh','maj7','fourth','fifth','minor-third','third','root'];
  const result = new Set();
  Object.entries(byStr).forEach(([sStr, group]) => {
    const s = parseInt(sStr);
    let pick;
    if (group.length === 1) { pick = group[0]; }
    else if (s === anchor) { pick = group.find(d => d.isRoot) || group[0]; }
    else {
      group.sort((a,b) => {
        const ai = priority.indexOf(a.t), bi = priority.indexOf(b.t);
        return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
      });
      pick = group[0];
    }
    result.add(`${pick.fret}-${s}`);
  });
  return result;
}

const SHAPES = ['echo', 'alpha', 'delta'], SHAPE_NAME = ['ECHO', 'ALPHA', 'DELTA'], SHAPE_CLS = ['e', 'a', 'd'];
const ROOTS = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'F#', 'G', 'Ab', 'A', 'Bb', 'B'];
const ROOT_PC = { C: 0, Db: 1, D: 2, Eb: 3, E: 4, F: 5, 'F#': 6, G: 7, Ab: 8, A: 9, Bb: 10, B: 11 };
// chord types unlock as the safes get harder
const QUALS = [{ s: '', after: 1 }, { s: 'm', after: 1 }, { s: '7', after: 3 }, { s: 'm7', after: 4 }, { s: 'maj7', after: 5 }];
const QUAL_LABEL = { '': '', m: 'm', '7': '7', m7: 'm7', maj7: 'Maj7' };

// ---- State ---------------------------------------------------------------
const HS_KEY = 'safeCrackerScores', SOUND_KEY = 'arcadeSound';
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let VW = 340, VH = 300;
let state = 'start', cash, safe, tumbler, task, pins, timeLeft, timeMax, lastT, shake, glow, feedback, soundOn = true;

function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function load(k)     { try { return localStorage.getItem(k); } catch (e) { return null; } }
function highScores() { try { return JSON.parse(load(HS_KEY)) || []; } catch (e) { return []; } }
const money = n => '$' + n.toLocaleString('en-US');

// ---- Sound ---------------------------------------------------------------
let audio = null;
function tone(freq, dur, type, slide, vol) {
  if (!soundOn) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime;
    o.type = type || 'square'; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
    g.gain.setValueAtTime(vol || 0.05, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(audio.destination); o.start(t); o.stop(t + dur);
  } catch (e) {}
}
const click = () => tone(1800, 0.02, 'square', 0, 0.03);
function toggleSound() {
  soundOn = !soundOn;
  store(SOUND_KEY, soundOn ? '1' : '0');
  document.getElementById('snd').textContent = soundOn ? 'SND ON' : 'SND OFF';
}

// ---- Tasks: a chord and a shape; the answer is that grip, one fret per string
function newTask() {
  const pool = QUALS.filter(q => safe >= q.after);
  let t;
  do {
    const shape = Math.floor(Math.random() * 3), root = ROOTS[Math.floor(Math.random() * 12)], q = pool[Math.floor(Math.random() * pool.length)];
    const grip = {};
    computeGripTones(SHAPES[shape], q.s, ROOT_PC[root]).forEach(k => { const [f, st] = k.split('-').map(Number); grip[st] = f; });
    t = { shape, root, q: q.s, name: root + QUAL_LABEL[q.s], grip };
  } while (task && t.name === task.name && t.shape === task.shape);
  task = t;
  pins = {}; Object.keys(task.grip).forEach(st => pins[st] = 0);   // every pin starts open, at the nut
  feedback = '';
  updateDocket();
}
function updateDocket() {
  const used = task ? Object.keys(task.grip).length : 0;
  document.getElementById('meta').innerHTML = `SAFE No. ${safe}<br>TUMBLER ${tumbler} OF 3${feedback ? '<br>' + feedback : ''}`;
  document.getElementById('ask').innerHTML = task
    ? `<small>${used} STRINGS</small>${task.name} <span class="${SHAPE_CLS[task.shape]}">${SHAPE_NAME[task.shape]}</span>`
    : '';
}
const same = (a, b) => a % 12 === b % 12;          // the nut and the 12th fret hold the same note
function tryOpen() {
  if (state !== 'playing') return;
  const strs = Object.keys(task.grip), right = strs.filter(st => same(pins[st], task.grip[st])).length;
  if (right === strs.length) {
    glow = 1;
    cash += 100 * safe;
    tone(520, 0.06, 'square'); setTimeout(() => tone(780, 0.08, 'square'), 60);
    if (tumbler === 3) return safeOpen();
    tumbler++;
    newTask();
  } else {
    shake = 1;
    timeLeft = Math.max(0, timeLeft - 4);
    feedback = `${right} OF ${strs.length} PINS SET`;
    updateDocket();
    [0, 120, 240].forEach(d => setTimeout(() => tone(880, 0.09, 'square', 0, 0.06), d));
  }
  if (state === 'playing') requestAnimationFrame(frame);
}
function safeOpen() {
  state = 'between';
  const bonus = Math.round(timeLeft) * 20;
  cash += bonus;
  [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, 0.12, 'triangle'), i * 90));
  setTimeout(() => overlay(`<h2>Safe ${safe}<br>Open</h2><div class="rule"></div>
    <div class="big">${money(cash)}</div><div class="lbl">TIME BONUS ${money(bonus)}</div>
    <span class="go" onclick="nextSafe()">NEXT SAFE</span>
    <p>The next door is faster.${safe === 2 ? ' Sevenths start turning up from safe 3.' : ''}</p>`), 500);
}
function nextSafe() { safe++; tumbler = 1; timeMax = Math.max(20, 45 - (safe - 1) * 4); timeLeft = timeMax; task = null; newTask(); hideOverlay(); state = 'playing'; lastT = 0; requestAnimationFrame(frame); }
document.getElementById('open').addEventListener('pointerdown', e => { e.preventDefault(); tryOpen(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.getElementById('initials')) saveScore();
  else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); tryOpen(); }
});

// ---- The lock: a neck with a brass pin on each string ---------------------
const OPEN_W = 26;
let geo = null;
function layout() {
  const L = 16 + OPEN_W, R = VW - 14, top = 52, bot = VH - 34;
  const pos = [0]; for (let n = 1; n <= 12; n++) pos.push(1 - Math.pow(2, -n / 12));
  const X = n => L + (R - L) * pos[n] / pos[12];
  const Y = st => top + (bot - top) * (5 - st) / 5;           // high e at the top, low E at the bottom
  const cell = f => f === 0 ? L - OPEN_W / 2 - 2 : (X(f - 1) + X(f)) / 2;
  geo = { L, R, top, bot, X, Y, cell };
}
function fretAt(x) {
  if (x < geo.L) return 0;
  for (let f = 1; f <= 12; f++) if (x < geo.X(f)) return f;
  return 12;
}
let drag = null;
function pointer(e) { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
cv.addEventListener('pointerdown', e => {
  if (state !== 'playing') return;
  const p = pointer(e), gap = (geo.bot - geo.top) / 5;
  const st = Math.round(5 - (p.y - geo.top) / gap);
  if (st < 0 || st > 5 || !(st in pins)) return;
  drag = st; cv.setPointerCapture(e.pointerId); move(p.x);
});
cv.addEventListener('pointermove', e => { if (drag !== null) move(pointer(e).x); });
cv.addEventListener('pointerup', () => drag = null);
cv.addEventListener('pointercancel', () => drag = null);
function move(x) {
  const f = fretAt(x);
  if (f !== pins[drag]) { pins[drag] = f; click(); if (feedback) { feedback = ''; updateDocket(); } requestAnimationFrame(frame); }
}

function circ(x, y, r, fill) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill(); }
function drawLock() {
  const c = ctx, { L, R, top, bot, X, Y, cell } = geo;
  c.clearRect(0, 0, VW, VH);
  c.save();
  if (shake > 0) c.translate(Math.sin(shake * 40) * 4 * shake, 0);
  // steel door plate inside a brass frame, bolts in the corners
  const rim = c.createLinearGradient(0, 0, VW, VH); rim.addColorStop(0, '#e2c06a'); rim.addColorStop(0.5, '#8a6a26'); rim.addColorStop(1, '#c9a24a');
  c.fillStyle = rim; c.fillRect(0, 0, VW, VH);
  const face = c.createLinearGradient(0, 0, 0, VH); face.addColorStop(0, '#8f9396'); face.addColorStop(1, '#5d6164');
  c.fillStyle = face; c.fillRect(6, 6, VW - 12, VH - 12);
  c.strokeStyle = 'rgba(255,255,255,0.07)'; c.lineWidth = 1;
  for (let y = 10; y < VH - 8; y += 3) { c.beginPath(); c.moveTo(8, y); c.lineTo(VW - 8, y); c.stroke(); }
  [[16, 16], [VW - 16, 16]].forEach(([x, y]) => { circ(x + 1, y + 1, 5, 'rgba(0,0,0,0.4)'); circ(x, y, 5, '#c9a24a'); circ(x - 1, y - 1, 2, '#f0d890'); });
  // the clock: a red fuse that burns down across the top
  const f = timeMax ? Math.max(0, timeLeft / timeMax) : 1;
  c.fillStyle = '#2a2118'; c.fillRect(30, 18, VW - 130, 6);
  c.fillStyle = f < 0.25 ? '#ff5a4a' : '#b8332a'; c.fillRect(30, 18, (VW - 130) * f, 6);
  // three tumbler lamps
  for (let i = 0; i < 3; i++) { const x = VW - 78 + i * 22, on = i < tumbler - 1 || state === 'between'; circ(x, 21, 8, '#2a2118'); circ(x, 21, 6, on ? '#ffcf5a' : '#4a3d26'); }
  // the neck: rosewood board, ivory nut, brass frets, inlays
  c.fillStyle = '#2e2117'; c.fillRect(L, top - 12, R - L, bot - top + 24);
  c.fillStyle = 'rgba(0,0,0,0.25)'; c.fillRect(L - OPEN_W - 4, top - 12, OPEN_W + 4, bot - top + 24);
  c.fillStyle = '#efe3c2'; c.fillRect(L - 5, top - 12, 5, bot - top + 24);
  for (let n = 1; n <= 12; n++) { c.fillStyle = '#c9a24a'; c.fillRect(X(n) - 1, top - 12, 2, bot - top + 24); }
  const midY = (top + bot) / 2, gap = (bot - top) / 5;
  [3, 5, 7, 9].forEach(n => circ((X(n - 1) + X(n)) / 2, midY, 4, '#7a6a4a'));
  circ((X(11) + X(12)) / 2, midY - gap, 4, '#7a6a4a'); circ((X(11) + X(12)) / 2, midY + gap, 4, '#7a6a4a');
  c.font = "12px 'Special Elite', monospace"; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#2a2118';
  [3, 5, 7, 9, 12].forEach(n => c.fillText(String(n), (X(n - 1) + X(n)) / 2, bot + 22));
  // strings, thicker toward the low E; strings the grip doesn't use are muted
  const thick = [3.2, 2.6, 2, 1.5, 1.1, 0.8];
  for (let st = 0; st < 6; st++) {
    const y = Y(st), used = task && st in task.grip;
    c.fillStyle = used ? '#ddd3bb' : 'rgba(221,211,187,0.28)';
    c.fillRect(L - OPEN_W - 2, y - thick[st] / 2, R - L + OPEN_W + 2, thick[st]);
    if (task && !used) { c.font = "16px 'Special Elite', monospace"; c.fillStyle = '#efe3c2'; c.fillText('X', L - OPEN_W / 2 - 2, y + 1); }
  }
  // the brass pins
  if (task) Object.keys(pins).forEach(st => {
    const x = cell(pins[st]), y = Y(+st), lit = state === 'between' || glow > 0;
    circ(x + 1, y + 2, 11, 'rgba(0,0,0,0.45)');
    const g = c.createRadialGradient(x - 3, y - 3, 1, x, y, 11); g.addColorStop(0, '#f6e2a0'); g.addColorStop(1, '#8a6a26');
    circ(x, y, 11, '#17130e'); circ(x, y, 9.5, g);
    if (lit) { c.globalAlpha = 0.5; circ(x, y, 14, '#ffcf5a'); c.globalAlpha = 1; }
  });
  c.restore();
}

// ---- Loop ----------------------------------------------------------------
function frame(t) {
  const dt = lastT ? Math.min(0.05, (t - lastT) / 1000) : 0;
  lastT = t;
  if (state === 'playing') {
    timeLeft -= dt;
    if (timeLeft <= 0) { timeLeft = 0; drawLock(); return caught(); }
  }
  shake = Math.max(0, shake - dt * 3); glow = Math.max(0, glow - dt * 3);
  drawLock();
  if (state === 'playing' || shake > 0 || glow > 0) requestAnimationFrame(frame);
}

// ---- Screens -------------------------------------------------------------
function overlay(html) { const o = document.getElementById('over'); o.className = 'over'; o.innerHTML = html; }
function hideOverlay() { document.getElementById('over').className = 'over hidden'; }
function scoreTable(hi) {
  const list = highScores();
  if (!list.length) return '<div class="hs-h">NO JOBS ON RECORD</div>';
  return '<div class="hs-h">BIGGEST JOBS</div><div class="hs">' + list.map((r, i) => { const c = i === hi ? ' class="me"' : ''; return `<span${c}>${i + 1}</span><span${c}>${r.i}</span><span${c}>${money(r.s)}</span>`; }).join('') + '</div>';
}
function showStart() {
  state = 'start';
  overlay(`<h2>Safe<br>Cracker</h2><div class="rule"></div>
    <span class="go" onclick="startGame()">CRACK IT</span>
    <p>The docket names a chord and a shape. Slide a brass pin along each string until the pins form that grip, then press <b>OPEN</b>.</p>
    <p><span class="e">ECHO</span> uses all six strings, <span class="a">ALPHA</span> five and <span class="d">DELTA</span> four. Strings marked X stay out.</p>
    <p>Three grips crack a safe. A wrong grip trips the alarm, costs time and tells you how many pins were right.</p>
    ${scoreTable(-1)}`);
}
function startGame() {
  cash = 0; safe = 1; tumbler = 1; timeMax = 45; timeLeft = timeMax; task = null; shake = 0; glow = 0;
  newTask(); hideOverlay(); state = 'playing'; lastT = 0; tone(440, 0.06); requestAnimationFrame(frame);
}
function caught() {
  state = 'over';
  [660, 660, 660, 660].forEach((f, i) => setTimeout(() => tone(f, 0.12, 'square', 0, 0.06), i * 200));
  const list = highScores();
  const qualifies = cash > 0 && (list.length < 10 || cash > list[list.length - 1].s);
  setTimeout(() => overlay(`<h2>Caught</h2><div class="rule"></div>
    <div class="big">${money(cash)}</div><div class="lbl">REACHED SAFE ${safe}, TUMBLER ${tumbler}.</div>
    ${qualifies
      ? `<p>A big job. Sign the ledger:</p><div class="ini"><input id="initials" maxlength="3" autocomplete="off" autocapitalize="characters" spellcheck="false"><button onclick="saveScore()">SIGN</button></div>`
      : '<span class="go" onclick="startGame()">TRY AGAIN</span>' + scoreTable(-1)}`), 700);
}
function saveScore() {
  const raw = (document.getElementById('initials').value || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  const entry = { i: (raw || 'AAA').slice(0, 3).padEnd(3, 'A'), s: cash };
  const list = highScores(); list.push(entry); list.sort((a, b) => b.s - a.s);
  const top = list.slice(0, 10);
  store(HS_KEY, JSON.stringify(top));
  overlay(`<h2>Caught</h2><div class="rule"></div><div class="big">${money(cash)}</div><div class="lbl">IN THE LEDGER</div><span class="go" onclick="startGame()">TRY AGAIN</span>${scoreTable(top.indexOf(entry))}`);
}

// ---- Setup ---------------------------------------------------------------
function fit() {
  VW = Math.min(document.querySelector('.screen').clientWidth - 24, 456);
  VH = Math.round(Math.min(400, Math.max(260, window.innerHeight - 270)));
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(VW * dpr); cv.height = Math.round(VH * dpr); cv.style.width = VW + 'px'; cv.style.height = VH + 'px'; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  layout(); drawLock();
}
window.addEventListener('resize', fit);
document.addEventListener('visibilitychange', () => {
  if (document.hidden && state === 'playing') state = 'paused';
  else if (!document.hidden && state === 'paused') { state = 'playing'; lastT = 0; requestAnimationFrame(frame); }
});

soundOn = load(SOUND_KEY) !== '0';
document.getElementById('snd').textContent = soundOn ? 'SND ON' : 'SND OFF';
cash = 0; safe = 1; tumbler = 1; timeMax = 45; timeLeft = 45; shake = 0; glow = 0; task = null; pins = {}; feedback = '';
updateDocket();
fit();
document.fonts && document.fonts.ready.then(fit);
showStart();
</script>
