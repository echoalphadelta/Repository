  // the loop of three stripes, its corners rounded
  const loop = (ctx, inset, colr, lw) => { ctx.strokeStyle = colr; ctx.lineWidth = lw; ctx.beginPath(); ctx.roundRect(inset * PX, inset * PX, w - 2 * inset * PX, h - 2 * inset * PX, 0.9 * PX); ctx.stroke(); };

  for (let i = 0; i < w * h / 6; i++) { const x = Math.random() * w, y = Math.random() * h, v = Math.random(); g.fillStyle = v < 0.5 ? `rgba(0,0,0,${0.25 + v * 0.4})` : `rgba(255,255,255,${(v - 0.5) * 0.08})`; g.fillRect(x, y, 1 + Math.random() * 1.5, 1 + Math.random() * 1.5); }

// ---- neon: glass tubes bent into letters and shapes, mounted just off the wall ----
// Each sign is drawn as tubes on a canvas: a wide soft halo that lights the wall behind, the coloured tube,
// and the hot pale core running down its middle.
const signs = [];
// a flat neon sign: tubes drawn on a canvas, a wide soft halo that lights the wall behind, the coloured tube,
// and the hot pale core down its middle. The canvas runs well past the drawing on every side, so the halo
// fades out to nothing instead of stopping at an edge.
// a smooth curve through points (Catmull-Rom, drawn as bezier pieces)
function smoothPath(g, P) { g.moveTo(P[0][0], P[0][1]); for (let i = 0; i < P.length - 1; i++) { const p0 = P[Math.max(0, i - 1)], p1 = P[i], p2 = P[i + 1], p3 = P[Math.min(P.length - 1, i + 2)];

// a hurricane glass in neon: the glass in violet, the drink's surface and bubbles in lime, an orange slice on the rim
// and a pink straw. Built the way a sign is bent: the bowl is one closed loop, open at the rim as an ellipse; the stem
// is a single tube; the foot a flat bar with rounded ends.

  g.beginPath(); g.moveTo(X(0), Y(0.618)); g.lineTo(X(0), Y(0.822)); g.stroke();
  g.beginPath(); g.ellipse(X(0), Y(0.842), 0.15 * u, 0.02 * u, 0, 0, Math.PI * 2); g.stroke();

  ink('#7aff6a');
  g.beginPath(); smoothPath(g, [[X(-0.146), Y(0.27)], [X(-0.08), Y(0.255)], [X(-0.02), Y(0.28)], [X(0.04), Y(0.258)], [X(0.1), Y(0.276)], [X(0.146), Y(0.262)]]); g.stroke();
  [[-0.06, 0.36, 0.026], [0.055, 0.39, 0.022], [-0.015, 0.46, 0.028], [0.045, 0.5, 0.017]].forEach(([x, y, r]) => { g.beginPath(); g.arc(X(x), Y(y), r * u, 0, Math.PI * 2); g.stroke(); });

function neonSign(w, h, colr, draw, at, ry, flicker = false) {
