  lightShape(ask.zone, ask, findFrets(GRIP_CONFIG[ask.zone.shape].anchor, ask.pc)[0], '#8a8494');
}

// ---- End of the fight --------------------------------------------------------
function times() { try { return JSON.parse(localStorage.getItem(HS_KEY)) || []; } catch (e) { return []; } }
function table(hi) { const t = times(); if (!t.length) return ''; return '<table>' + t.map((e, i) => `<tr class="${i === hi ? 'me' : ''}"><td>${i + 1}</td><td>${e.i}</td><td>${fmt(e.s)}</td></tr>`).join('') + '</table>'; }
let finalT = 0;
function win() {
  state = 'over'; hpHim = 0; bars(); hintOn = false; him.play('Death', true); finalT = fightT; slow = 1.1; trauma = 1; freeze = 0.18;
  const t = times(), ok = t.length < 10 || finalT < t[t.length - 1].s;
  setTimeout(() => { $('hud').className = 'hud hidden'; overlay(`<div class="kick">KNOCKOUT IN THE KEY OF ${keyName}</div><h1>YOU WIN</h1><div class="big">${fmt(finalT)}</div>
    <p>${hits} ${hits === 1 ? 'hit' : 'hits'}, ${blocks} ${blocks === 1 ? 'block' : 'blocks'}, ${misses} ${misses === 1 ? 'miss' : 'misses'}.</p>
    ${ok ? `<p>Sign your name on the wall:</p><div class="ini"><input id="initials" maxlength="3" autocomplete="off" autocapitalize="characters" spellcheck="false"><button id="sign">SIGN</button></div>` : '<span class="go" id="again">FIGHT AGAIN</span>' + table(-1)}`);
    if (ok) { $('sign').onclick = sign; setTimeout(() => $('initials').focus(), 50); } else $('again').onclick = startFight; }, 1800);
}
function lose() {
  state = 'over'; hpYou = 0; bars(); hintOn = false; you.play('Death', true); slow = 1.1; trauma = 1; freeze = 0.18;
  setTimeout(() => { $('hud').className = 'hud hidden'; overlay(`<div class="kick">THE KEY OF ${keyName}</div><h1>KNOCKED<br>DOWN</h1><p>Every root he calls sits in the first five frets of the string for the open zone. Count up from the kerb: open, 1, 2, 3, 4, with the brass stud on 3.</p><span class="go" id="again">GET UP</span>`); $('again').onclick = startFight; }, 1800);
}
function sign() {
  const raw = ($('initials').value || '').toUpperCase().replace(/[^A-Z0-9]/g, ''), entry = { i: (raw || 'AAA').slice(0, 3).padEnd(3, 'A'), s: +finalT.toFixed(1) };
  const t = times(); t.push(entry); t.sort((a, b) => a.s - b.s); try { localStorage.setItem(HS_KEY, JSON.stringify(t.slice(0, 10))); } catch (e) {}
  overlay(`<div class="kick">ON THE WALL</div><h1>YOU WIN</h1><div class="big">${fmt(finalT)}</div><span class="go" id="again">FIGHT AGAIN</span>${table(t.slice(0, 10).indexOf(entry))}`); $('again').onclick = startFight;
}
document.addEventListener('keydown', e => { if (e.key === 'Enter' && $('initials')) sign(); });
function overlay(html) { $('over').innerHTML = html; $('over').className = 'over'; }
function showStart() {
  state = 'start'; $('hud').className = 'hud hidden';
  overlay(`<div class="kick">ECHO ALPHA DELTA</div><h1>FRET<br>FIGHTER</h1>
    <p>The floor is the fretboard. Each row of stones is a string, each stone a fret.</p>
    <p>He leaves one place open. <b>LEGS</b> is the low E string, <b>BODY</b> the A string, <b>HEAD</b> the D string. Tap the stone with the chord's root on that string and you strike with the shape that grows from it: Echo, Alpha or Delta.</p>
    <p>When he winds up, tap the root he calls on the string for where he's aiming to <b>BLOCK</b> it before the bar runs out.</p>
    <p>Every root is in the first five frets. Land the whole progression in a row for a <b>FINISHER</b>.</p>
    <span class="go" id="fight">FIGHT</span>${table(-1)}`);
  $('fight').onclick = startFight;
}

// ---- Touch: tap a stone, or drag to look along the neck ----------------------
let down = null;
cv.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, cam: camX, moved: false }; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => { if (!down) return; const dx = e.clientX - down.x; if (Math.abs(dx) > 10) down.moved = true; if (down.moved) { camX = Math.max(1.4, Math.min(X1 - 1.7, down.cam - dx * 0.012)); placeCam(); } });
cv.addEventListener('pointerup', e => { if (down && !down.moved) { const c = cellAt(e.clientX, e.clientY); if (c) tapCell(c.s, c.f); } down = null; });

// ---- The loop -------------------------------------------------------------------
const clock = new THREE.Clock();
function frame() {
  const real = Math.min(0.05, clock.getDelta());
  // a frozen beat at each impact, slow motion on a knockout
  let dt = real; if (freeze > 0) { freeze -= real; dt = 0; } else if (slow > 0) { slow -= real; dt = real * 0.3; }
  if (state === 'yours' || state === 'theirs' || state === 'busy') { fightT += dt; turnT += dt; $('clock').textContent = fmt(fightT).replace(/\.\d$/, ''); }
  if (state === 'theirs') { const left = 1 - turnT / ask.limit; $('timerBar').style.width = Math.max(0, left * 100) + '%'; if (left <= 0) timeOut(); }
  [you, him].forEach(F => { if (!F) return; F.mixer.update(dt);
    // step in so the blow lands at the moment the limb is fully out, hold through the impact, then step back
    const s = F.strike;
    if (s) { s.t += dt;
      const ti = Math.max(0.08, s.tImp), k = s.t < ti ? 1 - Math.pow(1 - s.t / ti, 2) : Math.max(0, 1 - (s.t - ti) / 0.45);
      F.lunge = s.L * k;
      if (!s.fired && s.t >= ti) { s.fired = true; F.m.position.x = F.home.x + F.dir * F.lunge - F.dir * F.push; F.m.updateMatrixWorld(true); if (!s.o.whiff) impact(F, s); }
      if (s.t > ti + 0.5) { F.strike = null; F.lunge = 0; } }
    // thrown back by a blow: a stiff spring pulls them home
    F.pushV += (-60 * F.push - 9 * F.pushV) * dt; F.push += F.pushV * dt;
    F.m.position.x = F.home.x + F.dir * F.lunge - F.dir * Math.max(-0.05, F.push);
    // the flash of being hit
    if (F.flash > 0) { F.flash = Math.max(0, F.flash - real * 7); F.mats.forEach(mt => mt.emissive && mt.emissive.setScalar(F.flash * 0.7)); } });
  stepFx(dt || real * 0.15);
  trauma = Math.max(0, trauma - real * 1.6); kickFov *= Math.pow(0.002, real); placeCam();
  hintRow.material.opacity += ((hintOn ? 0.16 + 0.06 * Math.sin(performance.now() / 180) : 0) - hintRow.material.opacity) * 0.2;
  for (let i = glows.length - 1; i >= 0; i--) { const gl = glows[i]; gl.t += dt; const k = gl.t < 0.08 ? gl.t / 0.08 : Math.max(0, 1 - (gl.t - 0.08) / (gl.life - 0.08)); gl.m.material.opacity = k * gl.strength; if (gl.t >= gl.life) { scene.remove(gl.m); gl.m.geometry.dispose(); gl.m.material.dispose(); glows.splice(i, 1); } }
  const fr = camX > 1.45, fr2 = camX < X1 - 1.75; $('panL').style.visibility = fr ? 'visible' : 'hidden'; $('panR').style.visibility = fr2 ? 'visible' : 'hidden';
  r.render(scene, cam);
  requestAnimationFrame(frame);
}

// ---- Go --------------------------------------------------------------------------
fit(); placeCam();
const look = {
  you: { main: '#d8d4cc', trim: '#3a3836', legs: '#2a2a2c', skin: '#a5714f', hair: '#241a14' },
  him: { main: '#9c6a4a', trim: '#9c6a4a', legs: '#151517', skin: '#9c6a4a', hair: '#1a1410' },
};
Promise.all([makeFighter(0.85, Math.PI / 2, look.you), makeFighter(2.0, -Math.PI / 2, look.him)]).then(([a, b]) => {
  you = a; him = b; you.dir = 1; him.dir = -1; measure(you); measure(him); $('loading').remove(); showStart(); requestAnimationFrame(frame);
});
// for testing
window.FF = { get you() { return you; }, get him() { return him; }, get freeze() { return freeze; }, set freeze(v) { freeze = v; }, get state() { return state; }, get ask() { return ask; }, tapCell, cellAt, noteAt, get hp() { return [hpYou, hpHim]; }, rowZ, cellX, cam, startFight, findFrets, GRIP_CONFIG };
</script>
</body>
</html>
