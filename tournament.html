<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Echo Alpha Delta">
<meta name="application-name" content="Echo Alpha Delta">
<title>Tournament | Echo Alpha Delta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
<style>
/* A festival tournament: parchment, heraldic red, blue and gold, a woodcut-era serif and a blackletter title */
:root { --parch: #f3e7c9; --parch2: #e2d0a4; --ink: #2a1a10; --red: #a8261f; --blue: #23407a; --gold: #c99a2e; --green: #3f6b2a; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: #2b1d14; }
body { color: var(--parch); font-family: 'IM Fell English', Georgia, serif; font-size: 17px; -webkit-user-select: none; user-select: none; overscroll-behavior: none; }
a, button { font: inherit; color: inherit; }
.screen { max-width: 480px; margin: 0 auto; padding: 8px 12px 14px; }
.top { display: flex; justify-content: space-between; align-items: center; height: 26px; font-size: 16px; }
.top a { text-decoration: none; color: var(--gold); }
.top button { background: none; border: none; padding: 0; cursor: pointer; color: #b39a72; }
/* the herald's scroll */
.scroll { position: relative; margin-top: 6px; background: var(--parch); color: var(--ink); padding: 8px 18px 9px; text-align: center; border-radius: 3px; box-shadow: inset 0 0 0 2px var(--parch2); }
.scroll::before, .scroll::after { content: ''; position: absolute; top: 4px; bottom: 4px; width: 8px; background: #c8b285; border-radius: 4px; }
.scroll::before { left: -4px; } .scroll::after { right: -4px; }
.scroll .who { font-size: 14px; color: #6b5636; }
.scroll .call { font-size: 30px; line-height: 1.1; }
.scroll .call b { font-weight: 400; color: var(--red); }
.stage { position: relative; margin-top: 8px; }
.stage:has(.over:not(.hidden)) { min-height: 470px; }
canvas { display: block; margin: 0 auto; border: 3px solid #1a110b; touch-action: none; }
.board { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 17px; }
.board .side { display: flex; align-items: center; gap: 6px; }
.board i { display: inline-block; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--gold); }
.board i.on { background: var(--gold); }
.board .rival i { border-color: #c96a5e; } .board .rival i.on { background: #c96a5e; }
.board .match { color: #b39a72; font-size: 15px; }
.over { position: absolute; inset: 0; background: var(--parch); color: var(--ink); padding: 16px 18px; overflow: auto; border: 3px solid var(--gold); }
.over.hidden { display: none; }
.over h2 { margin: 0 0 2px; font-family: 'UnifrakturMaguntia', serif; font-weight: 400; font-size: 46px; line-height: 1; color: var(--red); }
.flourish { height: 6px; margin: 6px 0 12px; background: linear-gradient(90deg, var(--blue) 0 33%, var(--gold) 33% 66%, var(--red) 66%); }
.over p { margin: 0 0 8px; line-height: 1.35; }
.over p b { font-weight: 400; color: var(--red); }
.over .go { display: inline-block; margin: 2px 0 14px; padding: 7px 20px 6px; background: var(--red); color: var(--parch); font-size: 21px; cursor: pointer; border-radius: 2px; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.25); }
.big { font-size: 40px; line-height: 1; margin: 2px 0 2px; color: var(--blue); }
.lbl { font-size: 15px; color: #6b5636; margin: 0 0 12px; }
.hs-h { font-size: 16px; color: var(--blue); margin: 10px 0 4px; }
.hs { display: grid; grid-template-columns: 1.8em 3.4em auto; row-gap: 1px; font-size: 18px; }
.hs span:nth-child(3n) { color: var(--red); }
.hs .me { background: #e6d3a3; }
.ini { display: flex; gap: 10px; align-items: center; margin: 6px 0 12px; }
.ini input { width: 90px; font: inherit; font-size: 28px; letter-spacing: 3px; text-transform: uppercase; background: none; color: var(--ink); border: none; border-bottom: 2px solid var(--red); border-radius: 0; padding: 0 0 0 4px; }
.ini input:focus { outline: none; }
.ini button { background: var(--red); color: var(--parch); border: none; padding: 6px 14px 5px; cursor: pointer; border-radius: 2px; }
</style>
</head>
<body>
<div class="screen">
  <div class="top">
    <a href="arcade.html">&lt; ARCADE</a>
    <button id="snd" onclick="toggleSound()">SND ON</button>
  </div>
  <div class="scroll">
    <div class="who" id="who">The herald calls</div>
    <div class="call" id="call">&nbsp;</div>
  </div>
  <div class="stage">
    <canvas id="cv"></canvas>
    <div class="over" id="over"></div>
  </div>
  <div class="board">
    <div class="side you">You <span id="youDots"></span></div>
    <div class="match" id="match"></div>
    <div class="side rival"><span id="rivDots"></span> <span id="rivName">Rival</span></div>
  </div>
</div>

<script>
// ---- Music ---------------------------------------------------------------
const LETTERS = 'CDEFGAB', LETTER_PC = [0, 2, 4, 5, 7, 9, 11];
function spell(keyName, steps, semis) {
  const kl = LETTERS.indexOf(keyName[0]);
  const kpc = (LETTER_PC[kl] + (keyName[1] === '#' ? 1 : keyName[1] === 'b' ? 11 : 0)) % 12;
  const l = (kl + steps) % 7, off = ((kpc + semis - LETTER_PC[l]) % 12 + 18) % 12 - 6;
  return LETTERS[l] + (off > 0 ? '#'.repeat(off) : 'b'.repeat(-off));
}
const KEYS = ['C', 'D', 'Eb', 'E', 'F', 'G', 'A', 'Bb'];
const DEG = [
  { n: 'I', s: 0, st: 0, q: '' }, { n: 'ii', s: 2, st: 1, q: 'm' }, { n: 'iii', s: 4, st: 2, q: 'm' }, { n: 'IV', s: 5, st: 3, q: '' },
  { n: 'V', s: 7, st: 4, q: '' }, { n: 'vi', s: 9, st: 5, q: 'm' }, { n: 'vii°', s: 11, st: 6, q: '°' },
];
const chord = (k, d, q) => spell(k, DEG[d].st, DEG[d].s) + (q === undefined ? DEG[d].q : q);
const flip = q => q === 'm' ? '' : 'm';          // a decoy with the right root but the wrong quality

// ---- Matches: each rival draws faster than the last ----------------------
const RIVALS = [
  { name: 'the Villager', draw: 7.5, degs: 6, traps: false },
  { name: 'the Jester', draw: 7.0, degs: 6, traps: false },
  { name: 'the Traveler', draw: 6.5, degs: 6, traps: false },
  { name: 'the Squire', draw: 6.0, degs: 6, traps: true },
  { name: 'Sir Grey', draw: 5.5, degs: 6, traps: true },
  { name: 'Sir William', draw: 5.0, degs: 6, traps: true },
  { name: 'Lady Chatterlay', draw: 4.6, degs: 7, traps: true },
  { name: 'Lancelot', draw: 4.2, degs: 7, traps: true },
  { name: 'Edward the Lion', draw: 3.8, degs: 7, traps: true },
  { name: 'the Champion', draw: 3.4, degs: 7, traps: true },
  { name: 'the Dragon', draw: 3.0, degs: 7, traps: true, dragon: true },     // the final boss
];
const rival = m => RIVALS[Math.min(m, RIVALS.length - 1)];
const ENDS_TO_WIN = 3;

// ---- State ---------------------------------------------------------------
const HS_KEY = 'tournamentScores', SOUND_KEY = 'arcadeSound';
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let W = 360, H = 400;
let state = 'start', score, match, youEnds, rivEnds, task, banners, draw, arrows, flash, lastT, clock, soundOn = true;

function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function load(k)     { try { return localStorage.getItem(k); } catch (e) { return null; } }
function highScores() { try { return JSON.parse(load(HS_KEY)) || []; } catch (e) { return []; } }

// ---- Sound ---------------------------------------------------------------
let audio = null;
function tone(freq, dur, type, slide, vol) {
  if (!soundOn) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime;
    o.type = type || 'triangle'; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
    g.gain.setValueAtTime(vol || 0.06, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(audio.destination); o.start(t); o.stop(t + dur);
  } catch (e) {}
}
const fanfare = () => [392, 523, 659, 784].forEach((f, i) => setTimeout(() => tone(f, 0.16, 'square', 0, 0.05), i * 110));
function toggleSound() {
  soundOn = !soundOn;
  store(SOUND_KEY, soundOn ? '1' : '0');
  document.getElementById('snd').textContent = soundOn ? 'SND ON' : 'SND OFF';
}

// ---- An end: the herald calls a chord, banners go up ----------------------
const COLOURS = ['#a8261f', '#23407a', '#c99a2e', '#3f6b2a', '#6a2f6e'];
function newEnd() {
  const r = rival(match), key = KEYS[Math.floor(Math.random() * KEYS.length)];
  const d = Math.floor(Math.random() * r.degs);
  const answer = chord(key, d);
  const names = new Set([answer]);
  if (r.traps && DEG[d].q !== '°') names.add(chord(key, d, flip(DEG[d].q)));
  const others = [...Array(r.degs).keys()].filter(x => x !== d).sort(() => Math.random() - 0.5);
  for (const o of others) { if (names.size >= 5) break; names.add(chord(key, o)); }
  const list = [...names].sort(() => Math.random() - 0.5);
  const cols = COLOURS.slice().sort(() => Math.random() - 0.5);
  banners = list.map((name, i) => ({ name, right: name === answer, x: 0, y: 0, base: (i + 0.5) / list.length, row: i % 2, sway: Math.random() * 6, col: cols[i], hit: false, miss: false }));
  task = { key, d, answer };
  draw = 0; clock = 0; arrows = [];
  document.getElementById('who').textContent = 'The herald calls';
  document.getElementById('call').innerHTML = `The <b>${DEG[d].n}</b> in ${key}!`;
  updateBoard();
  state = 'playing';
}
function updateBoard() {
  const dots = n => Array.from({ length: ENDS_TO_WIN }, (_, i) => `<i class="${i < n ? 'on' : ''}"></i>`).join('');
  document.getElementById('youDots').innerHTML = dots(youEnds);
  document.getElementById('rivDots').innerHTML = dots(rivEnds);
  document.getElementById('rivName').textContent = cap(rival(match).name);
  document.getElementById('match').textContent = rival(match).dragon ? 'Final' : 'Match ' + (match + 1);
}
const cap = s => s[0].toUpperCase() + s.slice(1);

// ---- Shooting ------------------------------------------------------------
const YOU = () => ({ x: W * 0.17, y: H - 46 }), RIV = () => ({ x: W * 0.83, y: H - 46 });
function bannerBox(b) { return { x: b.x - 34, y: b.y - 6, w: 68, h: 52 }; }
function loose(from, b, mine) {
  const fire = !mine && rival(match).dragon;
  arrows.push({ from, to: { x: b.x, y: b.y + 20 }, t: 0, mine, b, fire });
  if (fire) { tone(120, 0.5, 'sawtooth', 40, 0.08); tone(90, 0.6, 'square', 30, 0.04); }
  else tone(mine ? 700 : 500, 0.12, 'sawtooth', 200, 0.04);
}
const roar = () => { tone(110, 0.9, 'sawtooth', 45, 0.09); setTimeout(() => tone(80, 0.8, 'sawtooth', 35, 0.07), 120); };
cv.addEventListener('pointerdown', e => {
  if (state !== 'playing') return;
  const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  // the closest banner to the tap, if the tap is on one
  const hits = banners.filter(b => { const q = bannerBox(b); return !b.miss && x >= q.x && x <= q.x + q.w && y >= q.y && y <= q.y + q.h; });
  const b = hits.sort((p, q) => Math.hypot(p.x - x, p.y + 20 - y) - Math.hypot(q.x - x, q.y + 20 - y))[0];
  if (!b || arrows.some(a => a.mine)) return;
  loose(YOU(), b, true);
});

function land(a) {
  if (state !== 'playing') return;
  if (a.mine) {
    if (a.b.right) {
      a.b.hit = true; youEnds++;
      score += Math.round(100 * (match + 1) * (1 + (1 - draw)));    // quicker shots are worth more
      tone(880, 0.1, 'square', 0, 0.05); setTimeout(() => tone(1175, 0.16, 'square', 0, 0.05), 90);
      endOver(true);
    } else {
      a.b.miss = true; flash = 1;
      tone(160, 0.25, 'triangle', 90, 0.08);
      document.getElementById('who').textContent = 'Wide! That was ' + a.b.name;
    }
  } else {
    a.b.hit = true; a.b.burnt = a.fire; rivEnds++;
    if (!a.fire) tone(300, 0.3, 'triangle', 150, 0.06);
    endOver(false);
  }
}
function endOver(won) {
  state = 'between';
  document.getElementById('who').textContent = won ? 'A true shot!' : cap(rival(match).name) + ' takes the end.';
  document.getElementById('call').innerHTML = `The ${DEG[task.d].n} in ${task.key} is <b>${task.answer}</b>`;
  updateBoard();
  setTimeout(() => {
    if (youEnds >= ENDS_TO_WIN) matchWon();
    else if (rivEnds >= ENDS_TO_WIN) finish(false);
    else newEnd();
  }, 1500);
}
function matchWon() {
  if (rival(match).dragon) return finish(true);
  state = 'between'; fanfare();
  const beaten = rival(match).name;
  overlay(`<h2>Victory</h2><div class="flourish"></div>
    <div class="big">${score}</div><div class="lbl">You beat ${beaten}, ${youEnds} ends to ${rivEnds}.</div>
    <span class="go" onclick="nextMatch()">Next Match</span>
    <p>${rival(match + 1).dragon ? 'The sky darkens. Your final rival is <b>the Dragon</b>, and it breathes fire faster than any archer can draw.' : `Your next rival is <b>${rival(match + 1).name}</b>, who draws faster.`}${rival(match + 1).traps && !rival(match).traps ? ' From here some banners show the right root with the wrong quality.' : ''}${rival(match + 1).degs === 7 && rival(match).degs === 6 ? ' From here the herald may call the vii°.' : ''}</p>`);
}
function nextMatch() { match++; youEnds = 0; rivEnds = 0; hideOverlay(); newEnd(); if (rival(match).dragon) roar(); lastT = 0; requestAnimationFrame(frame); }

// ---- Drawing -------------------------------------------------------------
function fillPath(pts, c, cx) { cx = cx || ctx; cx.beginPath(); pts.forEach(([x, y], i) => i ? cx.lineTo(x, y) : cx.moveTo(x, y)); cx.closePath(); cx.fillStyle = c; cx.fill(); }
function ell(cx, x, y, rx, ry, c) { cx.beginPath(); cx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); cx.fillStyle = c; cx.fill(); }

// ---- The backdrop is painted once per size into its own canvas -----------
const bg = document.createElement('canvas'), bgx = bg.getContext('2d');      // castle, hills, field
const sk = document.createElement('canvas'), skx = sk.getContext('2d');      // sky, painted behind the clouds
let flagPoles = [];            // tops of the castle's flagpoles, for flags that wave every frame
function tower(c, x, base, w, h, roofH, roof) {
  // a round tower: lit left side, shaded right side, crenellated parapet, conical roof
  const top = base - h;
  const g = c.createLinearGradient(x - w / 2, 0, x + w / 2, 0);
  g.addColorStop(0, '#cfc8ba'); g.addColorStop(0.55, '#b3ab9c'); g.addColorStop(1, '#857e72');
  c.fillStyle = g; c.fillRect(x - w / 2, top, w, h);
  c.fillStyle = 'rgba(0,0,0,0.07)'; for (let y = top + 6; y < base; y += 7) c.fillRect(x - w / 2, y, w, 1);          // stone courses
  c.fillStyle = g; c.fillRect(x - w / 2 - 3, top - 4, w + 6, 6);                                                     // parapet
  for (let i = 0; i < 4; i++) c.fillRect(x - w / 2 - 3 + i * (w + 6) / 3.5, top - 9, (w + 6) / 7, 5);
  for (let y = top + 12; y < base - 10; y += 22) { c.fillStyle = '#2b2420'; c.fillRect(x - 1.5, y, 3, 7); c.beginPath(); c.arc(x, y, 1.5, Math.PI, 0); c.fill(); }
  if (roofH) {
    const rg = c.createLinearGradient(x - w / 2, 0, x + w / 2, 0); rg.addColorStop(0, roof[0]); rg.addColorStop(1, roof[1]);
    fillPath([[x - w / 2 - 5, top - 4], [x + w / 2 + 5, top - 4], [x, top - 4 - roofH]], rg, c);
    c.fillStyle = '#2b2420'; c.fillRect(x - 0.75, top - 4 - roofH - 12, 1.5, 12);
    flagPoles.push({ x, y: top - 4 - roofH - 12 });
  }
}
function paintBackdrop() {
  bg.width = sk.width = cv.width; bg.height = sk.height = cv.height;
  const dpr = cv.width / W, c = bgx, k = skx; c.setTransform(dpr, 0, 0, dpr, 0, 0); k.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.clearRect(0, 0, W, H);
  flagPoles = [];
  const hz = H * 0.44;
  // warm afternoon sky with a soft sun
  const sky = k.createLinearGradient(0, 0, 0, hz); sky.addColorStop(0, '#5f8fbf'); sky.addColorStop(0.6, '#b9d2dc'); sky.addColorStop(1, '#f1e1bc');
  k.fillStyle = sky; k.fillRect(0, 0, W, hz + 2);
  const sun = k.createRadialGradient(W * 0.86, H * 0.1, 2, W * 0.86, H * 0.1, W * 0.45); sun.addColorStop(0, 'rgba(255,244,214,0.9)'); sun.addColorStop(1, 'rgba(255,244,214,0)');
  k.fillStyle = sun; k.fillRect(0, 0, W, hz);
  // distant blue mountains
  fillPath([[0, hz * 0.7], [W * 0.1, hz * 0.55], [W * 0.2, hz * 0.66], [W * 0.33, hz * 0.48], [W * 0.46, hz * 0.62], [W * 0.6, hz * 0.5], [W * 0.75, hz * 0.64], [W * 0.88, hz * 0.52], [W, hz * 0.62], [W, hz], [0, hz]], '#9fb2c2', c);
  fillPath([[0, hz * 0.8], [W * 0.18, hz * 0.7], [W * 0.38, hz * 0.78], [W * 0.62, hz * 0.68], [W * 0.82, hz * 0.76], [W, hz * 0.7], [W, hz], [0, hz]], '#88a0a8', c);
  // the castle on its hill
  const cx = W * 0.55, hillTop = hz * 0.86;
  c.beginPath(); c.moveTo(W * 0.12, hz); c.bezierCurveTo(W * 0.3, hillTop - 6, W * 0.8, hillTop - 6, W * 0.98, hz); c.closePath();
  const hg = c.createLinearGradient(0, hillTop, 0, hz); hg.addColorStop(0, '#86a36a'); hg.addColorStop(1, '#6d8c54'); c.fillStyle = hg; c.fill();
  const S = W / 360;                                       // everything on the castle scales with the canvas
  const base = hillTop + 2 * S;
  // curtain wall with crenellations and a gatehouse
  const wallL = cx - 92 * S, wallR = cx + 92 * S, wallTop = base - 26 * S;
  const wg = c.createLinearGradient(0, wallTop, 0, base); wg.addColorStop(0, '#c4bdae'); wg.addColorStop(1, '#9d9587');
  c.fillStyle = wg; c.fillRect(wallL, wallTop, wallR - wallL, base - wallTop);
  for (let x = wallL; x < wallR - 3; x += 7 * S) c.fillRect(x, wallTop - 5 * S, 4 * S, 5 * S);
  c.fillStyle = 'rgba(0,0,0,0.06)'; for (let y = wallTop + 5; y < base; y += 6) c.fillRect(wallL, y, wallR - wallL, 1);
  // the great keep with a tall spire
  tower(c, cx, wallTop + 4 * S, 32 * S, 58 * S, 30 * S, ['#41548a', '#24325a']);
  // inner towers either side of the keep
  tower(c, cx - 40 * S, wallTop + 4 * S, 20 * S, 40 * S, 19 * S, ['#a33a2e', '#6e1f19']);
  tower(c, cx + 40 * S, wallTop + 4 * S, 20 * S, 40 * S, 19 * S, ['#a33a2e', '#6e1f19']);
  // corner towers on the curtain wall
  tower(c, wallL, base, 22 * S, 38 * S, 17 * S, ['#41548a', '#24325a']);
  tower(c, wallR, base, 22 * S, 38 * S, 17 * S, ['#41548a', '#24325a']);
  // gatehouse with an arched gate and portcullis
  const gw = 26 * S;
  c.fillStyle = wg; c.fillRect(cx - gw / 2 - 4 * S, wallTop - 8 * S, gw + 8 * S, base - wallTop + 8 * S);
  for (let i = 0; i < 4; i++) c.fillRect(cx - gw / 2 - 4 * S + i * (gw + 8 * S) / 3.5, wallTop - 13 * S, (gw + 8 * S) / 7, 5 * S);
  c.fillStyle = '#2b2420'; c.beginPath(); c.moveTo(cx - gw / 2 + 4 * S, base); c.lineTo(cx - gw / 2 + 4 * S, base - 12 * S); c.arc(cx, base - 12 * S, gw / 2 - 4 * S, Math.PI, 0); c.lineTo(cx + gw / 2 - 4 * S, base); c.fill();
  c.strokeStyle = 'rgba(160,150,130,0.6)'; c.lineWidth = 1;
  for (let x = cx - gw / 2 + 7 * S; x < cx + gw / 2 - 4 * S; x += 4 * S) { c.beginPath(); c.moveTo(x, base - 18 * S); c.lineTo(x, base); c.stroke(); }
  // a couple of warm lit windows in the keep
  c.fillStyle = '#f2c46a'; c.fillRect(cx - 8 * S, wallTop - 36 * S, 3 * S, 6 * S); c.fillRect(cx + 5 * S, wallTop - 22 * S, 3 * S, 6 * S);
  // a little haze so the castle sits back in the distance
  c.globalCompositeOperation = 'source-atop'; c.fillStyle = 'rgba(241,225,188,0.18)'; c.fillRect(0, 0, W, hz); c.globalCompositeOperation = 'source-over';
  // nearer rolling hills and a line of trees
  fillPath([[0, hz - 4], [W * 0.15, hz - 12], [W * 0.3, hz - 3], [W * 0.5, hz - 6], [W * 0.7, hz - 2], [W * 0.9, hz - 10], [W, hz - 4], [W, hz + 2], [0, hz + 2]], '#638848', c);
  for (let i = 0; i < 14; i++) { const tx = (i * 53 + 11) % W, ty = hz - 4 - (i % 3) * 2; ell(c, tx, ty, 7 * S, 6 * S, i % 2 ? '#3f6b2a' : '#4a7832'); }
  // the tiltyard: a mown field
  const fg = c.createLinearGradient(0, hz, 0, H); fg.addColorStop(0, '#7aa64e'); fg.addColorStop(1, '#4c7a2f');
  c.fillStyle = fg; c.fillRect(0, hz, W, H - hz);

  const top = list.slice(0, 10);
  store(HS_KEY, JSON.stringify(top));
  overlay(`<h2>${ending.title}</h2><div class="flourish"></div><div class="big">${score}</div><div class="lbl">Written on the roll.</div><span class="go" onclick="startGame()">${ending.title === 'Dragon Slain' ? 'Ride Again' : 'Try Again'}</span>${scoreTable(top.indexOf(entry))}`);
}
document.addEventListener('keydown', e => { if (e.key === 'Enter' && document.getElementById('initials')) saveScore(); });

// ---- Setup ---------------------------------------------------------------
function fit() {
  W = Math.min(document.querySelector('.screen').clientWidth - 24 - 6, 450);
  H = Math.round(Math.min(W * 1.15, Math.max(300, window.innerHeight - 250)));
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); cv.style.width = W + 'px'; cv.style.height = H + 'px'; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  paintBackdrop(); drawScene();
}
window.addEventListener('resize', fit);
document.addEventListener('visibilitychange', () => {
  if (document.hidden && state === 'playing') state = 'paused';
  else if (!document.hidden && state === 'paused') { state = 'playing'; lastT = 0; requestAnimationFrame(frame); }
});

soundOn = load(SOUND_KEY) !== '0';
document.getElementById('snd').textContent = soundOn ? 'SND ON' : 'SND OFF';
score = 0; match = 0; youEnds = 0; rivEnds = 0; draw = 0; arrows = []; flash = 0; clock = 0;
banners = null;
updateBoard();
fit();
document.fonts && document.fonts.ready.then(fit);
showStart();
</script>
</body>
</html>
