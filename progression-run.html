<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Echo Alpha Delta">
<meta name="application-name" content="Echo Alpha Delta">
<title>Progression Run | Echo Alpha Delta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root { --ink: #fff3d6; --dusk: #1b1040; --sun: #ffd166; --echo: #4a9eff; --alpha: #ff4a4a; --delta: #4aff7a; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: #0d0820; }
body { color: var(--ink); font-family: 'Press Start 2P', monospace; font-size: 10px; -webkit-user-select: none; user-select: none; overscroll-behavior: none; }
a, button { font: inherit; color: inherit; }
.screen { max-width: 520px; margin: 0 auto; padding: 8px 12px 14px; display: flex; flex-direction: column; align-items: center; }
.top { width: 100%; display: flex; justify-content: space-between; align-items: center; height: 26px; }
.top a { text-decoration: none; }
.top button { background: none; border: none; padding: 0; cursor: pointer; }
.stage { position: relative; margin-top: 6px; touch-action: none; }
canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
.lanes { display: flex; gap: 8px; margin-top: 10px; }
.lane { width: 104px; height: 54px; border: 3px solid currentColor; background: #0d0820; cursor: pointer; font-size: 10px; letter-spacing: 1px; touch-action: manipulation; }
.lane.e { color: var(--echo); } .lane.a { color: var(--alpha); } .lane.d { color: var(--delta); }
.lane { background: currentColor; }
.lane span { color: #0d0820; }
.lane.on { outline: 3px solid #fff3d6; outline-offset: 3px; }
.fire { position: absolute; left: 10px; bottom: 12px; width: 66px; height: 66px; border-radius: 50%; border: 3px solid #b8c46a; background: #4d5c32; color: #f4f1ea; font-size: 10px; line-height: 1.4; cursor: pointer; touch-action: manipulation; box-shadow: 0 4px 0 #2a3320; padding: 0; }
.fire:active { transform: translateY(2px); box-shadow: 0 2px 0 #2a3320; }
.fire.hidden { display: none; }
.fire.wait { background: #2b2440; border-color: #5a5470; color: #8a84a0; font-size: 16px; }
.over { position: absolute; inset: 0; background: rgba(13,8,32,0.92); padding: 16px 14px; font-size: 9px; line-height: 1.9; overflow: auto; }
.over.hidden { display: none; }
.over h2 { margin: 0 0 12px; font-size: 16px; font-weight: 400; line-height: 1.1; color: var(--sun); }
.over p { margin: 0 0 8px; }
.over .e { color: var(--echo); } .over .a { color: var(--alpha); } .over .d { color: var(--delta); }
.over .go { display: inline-block; margin-top: 6px; color: var(--sun); cursor: pointer; animation: bl 1s steps(1) infinite; }
@keyframes bl { 50% { visibility: hidden; } }
.hs div { white-space: pre; }
.hs .me { background: var(--sun); color: var(--dusk); }
.ini { display: flex; gap: 8px; align-items: center; margin: 8px 0; }
.ini input { width: 80px; font: inherit; font-size: 20px; letter-spacing: 4px; text-transform: uppercase; background: transparent; color: var(--sun); border: none; border-bottom: 3px solid var(--sun); border-radius: 0; padding: 0 0 0 4px; }
.ini input:focus { outline: none; }
.ini button { background: var(--sun); color: var(--dusk); border: none; padding: 4px 10px; cursor: pointer; border-radius: 0; }
</style>
</head>
<body>
<div class="screen">
  <div class="top">
    <a href="arcade.html">&lt; ARCADE</a>
    <button id="snd" onclick="toggleSound()">SND ON</button>
  </div>
  <div class="stage" id="stage">
    <canvas id="cv" width="180" height="260"></canvas>
    <div class="over" id="over"></div>
    <button id="fire" class="fire hidden">FIRE</button>
  </div>
  <div class="lanes">
    <button class="lane e" data-lane="0"><span>ECHO</span></button>
    <button class="lane a on" data-lane="1"><span>ALPHA</span></button>
    <button class="lane d" data-lane="2"><span>DELTA</span></button>
  </div>
</div>

<script>
// ---- Music ---------------------------------------------------------------
const STR_OPEN = [4, 9, 2, 7, 11, 4];
const PC_NAMES = ['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
const SHAPES   = ['echo', 'alpha', 'delta'];          // lane order, left to right
const ANCHOR   = { echo: 0, alpha: 1, delta: 2 };      // string that carries each shape's root
const COLORS   = ['#4a9eff', '#ff4a4a', '#4aff7a'];
const SCALE    = [0, 2, 4, 5, 7, 9];                    // I ii iii IV V vi
const NUMERALS = ['I', 'ii', 'iii', 'IV', 'V', 'vi'];
const MINOR    = [false, true, true, false, false, true];
const PROGRESSIONS = [[0, 3, 4, 0], [0, 4, 5, 3], [1, 4, 0, 0], [0, 5, 3, 4], [5, 3, 0, 4], [0, 3, 0, 4]];

function rootFrets(shape, pc) {
  const out = [];
  for (let f = 1; f <= 12; f++) if ((STR_OPEN[ANCHOR[shape]] + f) % 12 === pc) out.push(f);
  return out;
}

// ---- State ---------------------------------------------------------------
const PIT_TIME = 3.8;
const PIT_EVERY = 20, BASE_SPEED = 6.5;                  // a pit stop every 20 correct
// rides you earn as you go: [correct signs needed, name on the upgrade banner]
const RIDES = [[0, ''], [10, 'MONSTER TRUCK'], [20, 'SUPERCAR'], [30, 'TANK']];
const RELOAD = 6;                                         // seconds between tank rounds
const W = 180, H = 260, HORIZON = 92, Z_NEAR = 1, Z_FAR = 40, GATE_GAP = 13;
const HS_KEY = 'progressionRunScores', SOUND_KEY = 'arcadeSound';
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');

let state = 'start', score, lives, passed, streak, speed, travel, gates, queue, key, lane, carX, shake, flash, lastT;
let pitT = 0, pitFixed = false;
let curve = 0, curveTarget = 0, curveUntil = 0, skyShift = 0, ride = 0, pendingRide = 0, upgradeT = 0, reload = 0, shells = [], booms = [], muzzle = 0;
let soundOn = true;

function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function load(k)     { try { return localStorage.getItem(k); } catch (e) { return null; } }
function highScores() { try { return JSON.parse(load(HS_KEY)) || []; } catch (e) { return []; } }
const pad = (n, w) => String(n).padStart(w, '0');

// Build the next progression as a queue of gates
function refill() {
  if (passed % 8 === 0 || key === undefined) key = Math.floor(Math.random() * 12);
  const prog = PROGRESSIONS[Math.floor(Math.random() * PROGRESSIONS.length)];
  prog.forEach(d => {
    const root = (key + SCALE[d]) % 12;
    const shape = SHAPES[Math.floor(Math.random() * 3)];
    const frets = rootFrets(shape, root);
    const fret = frets[Math.floor(Math.random() * frets.length)];
    queue.push({ deg: d, root, minor: MINOR[d], shape, fret, key });
  });
}
function nextGate() { if (!queue.length) refill(); return queue.shift(); }
function label(g) {
  const chord = PC_NAMES[g.root] + (g.minor ? 'm' : '');
  return chord + ' @' + g.fret;
}

// ---- Sound ---------------------------------------------------------------
let audio = null;
function beep(freq, dur, type) {
  if (!soundOn) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type || 'square'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.045, audio.currentTime);
    g.gain.setValueAtTime(0, audio.currentTime + dur);
    o.connect(g); g.connect(audio.destination);
    o.start(); o.stop(audio.currentTime + dur + 0.01);
  } catch (e) {}
}
function toggleSound() {
  soundOn = !soundOn;
  store(SOUND_KEY, soundOn ? '1' : '0');
  document.getElementById('snd').textContent = soundOn ? 'SND ON' : 'SND OFF';
}

// ---- Drawing -------------------------------------------------------------
// screen row for a distance, and the road's half width there
const rowAt  = z => HORIZON + (H - 34 - HORIZON) * (Z_NEAR / z);
const halfAt = z => 70 * (Z_NEAR / z);
const laneX  = (l, half) => W / 2 + (l - 1) * (half * 2 / 3);

function txt(s, x, y, size, color, align) {
  ctx.font = size + "px 'Press Start 2P', monospace";
  ctx.textAlign = align || 'left'; ctx.textBaseline = 'top';
  ctx.fillStyle = color; ctx.fillText(s, Math.round(x), Math.round(y));
}

// ---- Time of day: evening, dusk, night, dawn, day, and round again ------
const TIMES = [   // t, seven sky bands from the top down, grass, road, mountains
  { t: 0.00, sky: ['#1b1040', '#2c1452', '#4a1a62', '#7a2266', '#b23a6b', '#e2606a', '#f48f55'], grass: ['#1d3a22', '#234628'], road: ['#3b3a4a', '#43425a'], hills: '#2a1238' },
  { t: 0.14, sky: ['#0e0a2a', '#1a1040', '#2a1450', '#3d1a5c', '#5a2366', '#7a3070', '#9a4a6e'], grass: ['#152c1a', '#1b3620'], road: ['#2e2d3c', '#353446'], hills: '#1a0c28' },
  { t: 0.28, sky: ['#03040f', '#060818', '#0a0d22', '#0e122c', '#131834', '#1a1f3e', '#232848'], grass: ['#0b1a10', '#0f2214'], road: ['#1e1e28', '#24242f'], hills: '#0a0c1c' },
  { t: 0.52, sky: ['#03040f', '#060818', '#0a0d22', '#0e122c', '#131834', '#1a1f3e', '#232848'], grass: ['#0b1a10', '#0f2214'], road: ['#1e1e28', '#24242f'], hills: '#0a0c1c' },
  { t: 0.66, sky: ['#1d2a5a', '#33407a', '#5a5e96', '#9a7aa8', '#e090a0', '#f4b08a', '#ffd08a'], grass: ['#2a4a2a', '#33552f'], road: ['#4a4858', '#524f60'], hills: '#4a3a5e' },
  { t: 0.78, sky: ['#2f6fd0', '#3f80dc', '#5192e4', '#66a4ea', '#7fb6ef', '#9ec8f2', '#c4dcf2'], grass: ['#3f7a34', '#4a8a3c'], road: ['#55555f', '#5f5f6a'], hills: '#5a7a9a' },
  { t: 0.90, sky: ['#2f6fd0', '#3f80dc', '#5192e4', '#66a4ea', '#7fb6ef', '#9ec8f2', '#c4dcf2'], grass: ['#3f7a34', '#4a8a3c'], road: ['#55555f', '#5f5f6a'], hills: '#5a7a9a' },
  { t: 1.00, sky: ['#1b1040', '#2c1452', '#4a1a62', '#7a2266', '#b23a6b', '#e2606a', '#f48f55'], grass: ['#1d3a22', '#234628'], road: ['#3b3a4a', '#43425a'], hills: '#2a1238' },
];
const CYCLE_GATES = 48;                                  // one full day takes about 48 gates
const hex = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
const mix = (a, b, k) => { const p = hex(a), q = hex(b); return `rgb(${p.map((v, i) => Math.round(v + (q[i] - v) * k)).join(',')})`; };
function timeOfDay() {
  const t = ((travel || 0) / (GATE_GAP * CYCLE_GATES)) % 1;
  let i = 0; while (TIMES[i + 1].t < t) i++;
  const A = TIMES[i], B = TIMES[i + 1], k = (t - A.t) / (B.t - A.t);
  const ramp = (a, b) => Math.max(0, Math.min(1, (t - a) / (b - a)));
  return {
    t, sky: A.sky.map((c, j) => mix(c, B.sky[j], k)), grass: A.grass.map((c, j) => mix(c, B.grass[j], k)),
    road: A.road.map((c, j) => mix(c, B.road[j], k)), hills: mix(A.hills, B.hills, k),
    stars: Math.min(ramp(0.16, 0.26), 1 - ramp(0.56, 0.64)),
    // how high the sun stands: 0 sits on the horizon, 1 is high, below 0 it has set
    sun: t >= 0.6 ? (t < 0.7 ? -1 + (t - 0.6) / 0.1 : t < 0.82 ? (t - 0.7) / 0.12 : t < 0.92 ? 1 : 1 - (t - 0.92) / 0.08) : (t < 0.12 ? -t / 0.12 : -1),
  };
}
const STARS = Array.from({ length: 46 }, () => [Math.random() * W, Math.random() * (HORIZON - 14), Math.random() * 6]);

// ---- Curves: the road bends by an amount that grows with distance --------
const bend = z => curve * 0.32 * Math.pow(z - Z_NEAR, 2) / (1 + (z - Z_NEAR) / 18);
const centreAt = z => W / 2 + bend(z);

function drawSky(tod) {
  const bh = HORIZON / tod.sky.length;
  tod.sky.forEach((c, i) => { ctx.fillStyle = c; ctx.fillRect(0, Math.floor(i * bh), W, Math.ceil(bh) + 1); });
  // stars, twinkling, and a moon that crosses the night
  if (tod.stars > 0) {
    STARS.forEach(([x, y, p]) => { const tw = 0.55 + 0.45 * Math.sin(performance.now() / 400 + p); ctx.globalAlpha = tod.stars * tw; ctx.fillStyle = '#fff7e0'; ctx.fillRect(Math.round((x - skyShift * 0.3 + W * 4) % W), Math.round(y), p > 5 ? 2 : 1, p > 5 ? 2 : 1); });
    ctx.globalAlpha = tod.stars;
    const mk = Math.max(0, Math.min(1, (tod.t - 0.2) / 0.42)), mx = W * (0.82 - mk * 0.64), my = 30 - Math.sin(mk * Math.PI) * 14;
    ctx.fillStyle = '#f2ecd6'; for (let dy = -7; dy <= 7; dy++) { const w = Math.round(Math.sqrt(49 - dy * dy)); ctx.fillRect(Math.round(mx - w), Math.round(my + dy), w * 2, 1); }
    ctx.fillStyle = tod.sky[1]; for (let dy = -7; dy <= 7; dy++) { const w = Math.round(Math.sqrt(49 - dy * dy)); ctx.fillRect(Math.round(mx - w + 4), Math.round(my + dy - 1), w * 2, 1); }
    ctx.globalAlpha = 1;
  }
  // the sun: low and striped at evening and dawn, high and round by day
  if (tod.sun > -1) {
    const e = tod.sun, up = Math.max(0, e), r = 30 - up * 12;
    const cy = e >= 0 ? HORIZON - up * 46 : HORIZON - e * r, cx = W / 2 + 40 * up;   // below 0 it sinks under the horizon
    ctx.fillStyle = e > 0.6 ? '#fff3c0' : '#ffd166';
    for (let dy = -r; dy <= r; dy++) {
      const row = Math.round(cy + dy);
      if (row >= HORIZON) continue;
      if (e < 0.5 && dy > r * 0.45 && row % 4 === 0) continue;                       // retro cut lines while it is low
      const w = Math.round(Math.sqrt(r * r - dy * dy) * 0.9);
      ctx.fillRect(Math.round(cx - w), row, w * 2, 1);
    }
  }
  // mountains, sliding as the road bends
  ctx.fillStyle = tod.hills;
  const peaks = [[0, 14], [26, 8], [52, 18], [80, 10], [112, 16], [140, 7], [164, 13], [180, 14]];
  for (let x = 0; x < W; x++) {
    const u = ((x + skyShift) % W + W) % W;
    let i = 0; while (peaks[i + 1][0] <= u) i++;
    const A = peaks[i], B = peaks[i + 1], h = A[1] + (B[1] - A[1]) * ((u - A[0]) / (B[0] - A[0]));
    ctx.fillRect(x, HORIZON - Math.round(h), 1, Math.round(h));
  }
}

function drawRoad(tod) {
  for (let y = HORIZON; y < H; y++) {
    const z = Z_NEAR * (H - 34 - HORIZON) / Math.max(0.5, y - HORIZON);
    const half = halfAt(z), cx = centreAt(z);
    const band = Math.floor((z + travel) / 2.2) % 2;
    ctx.fillStyle = tod.grass[band ? 0 : 1]; ctx.fillRect(0, y, W, 1);
    ctx.fillStyle = tod.road[band ? 0 : 1]; ctx.fillRect(Math.round(cx - half), y, Math.round(half * 2), 1);
    const rumble = Math.max(1, Math.round(half * 0.08));
    ctx.fillStyle = band ? '#f4f1ea' : '#d2364a';
    ctx.fillRect(Math.round(cx - half - rumble), y, rumble, 1);
    ctx.fillRect(Math.round(cx + half), y, rumble, 1);
    if (band) {
      ctx.fillStyle = '#c9c4d6';
      const lw = Math.max(1, Math.round(half * 0.025));
      ctx.fillRect(Math.round(cx - half / 3 - lw / 2), y, lw, 1);
      ctx.fillRect(Math.round(cx + half / 3 - lw / 2), y, lw, 1);
    }
  }
  // headlights light up the road after dark, following the bend ahead
  if (tod.stars > 0.05) {
    const y0 = H - 30;
    ctx.globalAlpha = 0.16 * tod.stars; ctx.fillStyle = '#fff2b0';
    for (let y = y0; y > y0 - 56; y--) {
      const z = Z_NEAR * (H - 34 - HORIZON) / Math.max(0.5, y - HORIZON), w = 7 + (y0 - y) * 0.5;
      ctx.fillRect(Math.round(carX + bend(z) - w), y, Math.round(w * 2), 1);
    }
    ctx.globalAlpha = 1;
  }
}

function drawGate(g) {
  if (g.z > Z_FAR || g.z < Z_NEAR * 0.6) return;
  const y = rowAt(g.z), half = halfAt(g.z), s = Z_NEAR / g.z, cx = centreAt(g.z);
  // coloured lane strips on the road
  const th = Math.max(1, Math.round(6 * s));
  for (let l = 0; l < 3; l++) {
    ctx.fillStyle = COLORS[l];
    ctx.fillRect(Math.round(cx - half + l * half * 2 / 3) + 1, Math.round(y - th), Math.round(half * 2 / 3) - 1, th);
  }
  // posts and sign board
  const postH = Math.round(70 * s), pw = Math.max(1, Math.round(4 * s));
  ctx.fillStyle = '#2b2440';
  ctx.fillRect(Math.round(cx - half - pw * 2), Math.round(y - postH), pw, postH);
  ctx.fillRect(Math.round(cx + half + pw), Math.round(y - postH), pw, postH);
  const bh = Math.round(24 * s), bw = Math.round(half * 2 + pw * 6);
  ctx.fillStyle = '#ffd166'; ctx.fillRect(Math.round(cx - bw / 2), Math.round(y - postH - bh), bw, bh);
  ctx.fillStyle = '#1b1040'; ctx.fillRect(Math.round(cx - bw / 2) + 1, Math.round(y - postH - bh) + 1, bw - 2, Math.max(1, Math.round(2 * s)));
  if (s > 0.3) { const fs = Math.max(8, Math.round(12 * s)); txt(label(g), cx, y - postH - bh / 2 - fs / 2 + 1, fs, '#1b1040', 'center'); }
}

function drawCar(tod) {
  const y = H - 30;
  const x = Math.round(carX) + (shake ? Math.round(Math.random() * 4 - 2) : 0);
  const px = (dx, dy, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(x + dx, y + dy, w, h); };
  if (ride === 1) return drawTruck(x, y, px, tod);
  if (ride === 2) return drawSupercar(x, y, px);
  if (ride === 3) return drawTank(x, y, px);
  px(-13, 6, 26, 10, '#d2364a');      // body
  px(-9, 1, 18, 6, '#a3243a');        // roof
  px(-7, 2, 14, 4, '#6ac7ff');        // rear window
  px(-13, 14, 6, 5, '#111');          // tyres
  px(7, 14, 6, 5, '#111');
  px(-12, 9, 4, 2, '#ffd166');        // tail lights
  px(8, 9, 4, 2, '#ffd166');
  px(-4, 11, 8, 2, '#f4f1ea');        // plate
}
function drawTruck(x, y, px, tod) {
  // a lifted neon monster truck: black body traced in pink and cyan, huge tyres, underglow
  const bounce = Math.round(Math.sin(performance.now() / 90) * 0.6);
  ctx.globalAlpha = 0.45; ctx.fillStyle = '#ff3df2';
  for (let dy = 0; dy < 4; dy++) ctx.fillRect(x - 20 + dy * 2, y + 20 + dy, 40 - dy * 4, 1);
  ctx.globalAlpha = 1;
  // tyres with chunky tread and glowing hubs
  [-21, 11].forEach(dx => {
    px(dx, 4 + bounce, 10, 16, '#0b0b10');
    for (let k = 0; k < 4; k++) px(dx, 5 + k * 4 + bounce, 10, 1, '#2a2a36');
    px(dx + 3, 9 + bounce, 4, 5, '#3ef0ff');
  });
  // suspension
  px(-12, 8, 3, 6, '#3ef0ff'); px(9, 8, 3, 6, '#3ef0ff');
  // body and cab
  const by = -2 + bounce;
  px(-17, by, 34, 10, '#ff3df2'); px(-16, by + 1, 32, 8, '#140a26');
  px(-11, by - 8, 22, 9, '#ff3df2'); px(-10, by - 7, 20, 7, '#140a26');
  px(-8, by - 6, 16, 4, '#3ef0ff');                  // rear window
  px(-16, by + 3, 32, 1, '#3ef0ff');                 // neon stripe
  px(-15, by + 5, 4, 2, '#ff2a4a'); px(11, by + 5, 4, 2, '#ff2a4a');    // tail lights
  px(-6, by - 10, 12, 2, '#ffd166');                 // roof light bar
  px(-4, by + 6, 8, 2, '#f4f1ea');                   // plate
}
function drawSupercar(x, y, px) {
  // a low wedge supercar from behind: wide body, rear wing, quad exhaust shooting flames and sparks
  px(-17, 11, 6, 8, '#111'); px(11, 11, 6, 8, '#111');                  // fat rear tyres
  px(-16, 7, 32, 9, '#ffb000');                                         // body
  px(-13, 4, 26, 4, '#e09a00'); px(-9, 2, 18, 3, '#1a1a22');           // engine deck and slim rear window
  px(-12, 8, 6, 2, '#1a1a22'); px(6, 8, 6, 2, '#1a1a22');              // vents
  px(-18, 0, 36, 2, '#1a1a22'); px(-13, 2, 2, 3, '#1a1a22'); px(11, 2, 2, 3, '#1a1a22');   // wing on its posts
  px(-15, 11, 30, 1, '#ff2a4a');                                        // tail light strip
  px(-15, 13, 30, 3, '#1a1a22');                                        // diffuser
  const pipes = [-7, -4, 2, 5];
  pipes.forEach(dx => px(dx, 14, 2, 2, '#9a9aa6'));
  // flames: blue at the root, orange and yellow beyond, flickering every frame
  pipes.forEach(dx => {
    const len = 3 + Math.floor(Math.random() * 6);
    px(dx, 16, 2, 1, '#6ac7ff');
    for (let k = 1; k < len; k++) px(dx + (Math.random() < 0.3 ? (Math.random() < 0.5 ? -1 : 1) : 0), 16 + k, 2, 1, k < len / 2 ? '#ffd166' : '#ff6a2a');
  });
  for (let i = 0; i < 3; i++) if (Math.random() < 0.5) px(-8 + Math.floor(Math.random() * 16), 19 + Math.floor(Math.random() * 6), 1, 1, '#fff3c0');
}
function drawTank(x, y, px) {
  // a battle tank from behind: tracks, hull, turret and a long gun pointing up the road
  [-23, 15].forEach(dx => { px(dx, 3, 8, 17, '#2a2a22'); for (let k = 0; k < 6; k++) px(dx, 4 + ((k * 3 + Math.floor(travel * 3)) % 17), 8, 1, '#4a4a3a'); });
  px(-16, 6, 32, 11, '#5a6b3a'); px(-16, 6, 32, 2, '#6d7f48');          // hull
  px(-14, 13, 4, 2, '#3d4a28'); px(10, 13, 4, 2, '#3d4a28');            // exhaust grilles
  px(-10, -2, 20, 9, '#4d5c32'); px(-10, -2, 20, 2, '#5f7040');         // turret
  px(-4, 0, 8, 3, '#3d4a28');                                          // hatch
  px(-2, -16, 4, 15, '#3d4a28'); px(-3, -17, 6, 2, '#2a3320');         // gun barrel
  px(-15, 9, 2, 2, '#ff2a4a'); px(13, 9, 2, 2, '#ff2a4a');              // rear lights
  if (muzzle > 0) { px(-4, -22, 8, 5, '#ffd166'); px(-2, -25, 4, 3, '#fff3c0'); }
}
function drawShells() {
  shells.forEach(sh => {
    const s = Z_NEAR / sh.z, y = rowAt(sh.z), x = centreAt(sh.z) + (sh.x - W / 2) * s, r = Math.max(1, Math.round(3 * s));
    ctx.fillStyle = '#fff3c0'; ctx.fillRect(Math.round(x - r / 2), Math.round(y - 6 * s - r), r, r * 2);
  });
  booms.forEach(b => {
    const s = Math.max(0.35, Z_NEAR / b.z), y = rowAt(b.z) - 40 * (Z_NEAR / b.z), x = centreAt(b.z), r = (12 + b.t * 70) * s;
    ctx.globalAlpha = 1 - b.t / 0.8;
    ctx.fillStyle = '#ff6a2a'; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffd166'; ctx.beginPath(); ctx.arc(x, y, r * 0.6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff3c0'; ctx.beginPath(); ctx.arc(x, y, r * 0.3, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  });
}
function drawPit() {
  // a chequered pit board, two crew in overalls, a fuel hose and sparks from the wrench
  const x = Math.round(carX), y = H - 30, busy = pitT > 0.9 && pitT < PIT_TIME - 0.9;
  for (let i = 0; i < 18; i++) { ctx.fillStyle = (i % 2) ? '#f4f1ea' : '#111'; ctx.fillRect(W / 2 - 54 + i * 6, 96, 6, 3); ctx.fillStyle = (i % 2) ? '#111' : '#f4f1ea'; ctx.fillRect(W / 2 - 54 + i * 6, 99, 6, 3); }
  ctx.fillStyle = 'rgba(13,8,32,0.88)'; ctx.fillRect(W / 2 - 54, 102, 108, 26);
  txt('PIT STOP', W / 2, 106, 10, '#ffd166', 'center');
  txt(pitFixed ? 'REPAIRED' : 'FIXING...', W / 2, 119, 6, pitFixed ? '#4aff7a' : '#fff3d6', 'center');
  if (!busy) return;
  const crew = (cx, f) => {
    ctx.fillStyle = '#f48f55'; ctx.fillRect(cx - 3, y + 4, 6, 9);              // overalls
    ctx.fillStyle = '#e8c9a0'; ctx.fillRect(cx - 2, y, 4, 4);                  // head
    ctx.fillStyle = '#fff3d6'; ctx.fillRect(cx - 3, y - 1, 6, 2);              // cap
    ctx.fillStyle = '#2b2440'; ctx.fillRect(cx - 3, y + 13, 2, 5); ctx.fillRect(cx + 1, y + 13, 2, 5);
    ctx.fillStyle = '#c9c4d6'; ctx.fillRect(cx + 3 * f, y + 7 + Math.round(Math.sin(performance.now() / 60)), 4 * f, 2);   // wrench
  };
  crew(x - 26, 1); crew(x + 26, -1);
  ctx.fillStyle = '#ffd166'; if (Math.random() < 0.6) ctx.fillRect(x - 19 + Math.round(Math.random() * 3), y + 4 + Math.round(Math.random() * 6), 1, 1);
  if (Math.random() < 0.6) ctx.fillRect(x + 18 - Math.round(Math.random() * 3), y + 4 + Math.round(Math.random() * 6), 1, 1);
  // the fuel hose snakes in from the side of the road
  ctx.strokeStyle = '#d2364a'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x < W / 2 ? W : 0, y + 2); ctx.quadraticCurveTo(x < W / 2 ? x + 40 : x - 40, y - 12, x + (x < W / 2 ? 10 : -10), y + 4); ctx.stroke();
}
function drawHud() {
  ctx.fillStyle = '#0d0820'; ctx.fillRect(0, 0, W, 13);
  txt(pad(score, 6), 3, 3, 8, '#fff3d6');
  txt('x' + pad(passed, 3), 64, 3, 8, '#e2606a');
  for (let i = 0; i < 3; i++) { ctx.fillStyle = i < lives ? '#d2364a' : '#3b3a4a'; ctx.fillRect(152 + i * 9, 4, 7, 5); }
  // the next sign, always readable
  const g = gates[0];
  if (g) {
    ctx.fillStyle = '#ffd166'; ctx.fillRect(W / 2 - 60, 17, 120, 24);
    ctx.fillStyle = '#1b1040'; ctx.fillRect(W / 2 - 58, 19, 116, 1);
    txt(label(g), W / 2, 24, 12, '#1b1040', 'center');
  }
}

function draw() {
  const tod = timeOfDay();
  drawSky(tod); drawRoad(tod);
  gates.slice().sort((a, b) => b.z - a.z).forEach(drawGate);
  drawShells(); drawCar(tod); drawHud();
  if (pitT > 0) drawPit();
  if (upgradeT > 0 && Math.floor(upgradeT * 4) % 2 === 0) {
    ctx.fillStyle = 'rgba(20,10,38,0.85)'; ctx.fillRect(W / 2 - 74, 100, 148, 34);
    txt('UPGRADE!', W / 2, 105, 8, '#3ef0ff', 'center');
    txt(RIDES[ride][1], W / 2, 119, 10, ride === 3 ? '#b8c46a' : ride === 2 ? '#ffb000' : '#ff3df2', 'center');
  }
  if (flash > 0) { ctx.fillStyle = `rgba(255,${flash > 0.5 ? 255 : 74},74,${Math.min(0.6, flash)})`; ctx.fillRect(0, 0, W, H); }
}

// ---- Game ----------------------------------------------------------------
function setLane(l) {
  if (l < 0 || l > 2 || l === lane) return;
  lane = l;
  document.querySelectorAll('.lane').forEach(b => b.classList.toggle('on', +b.dataset.lane === l));
  if (state === 'playing') beep(330 + l * 110, 0.03);
}

function milestone() {
  const next = RIDES.findIndex(r => r[0] === passed);
  if (passed % PIT_EVERY === 0) { pitT = PIT_TIME; pitFixed = false; [659, 523].forEach((f, i) => setTimeout(() => beep(f, 0.1), i * 140)); }
  if (next > ride) { if (pitT > 0) pendingRide = next; else upgrade(next); }     // during a pit stop, the new ride waits until you pull away
}
function upgrade(r) {
  ride = r; upgradeT = 2.6; updateFire();
  [392, 523, 659, 784, 1047, 1319].forEach((f, i) => setTimeout(() => beep(f, 0.07, 'sawtooth'), i * 70));
}
function pass(g) {
  if (SHAPES[lane] === g.shape) {
    passed++; streak++;
    score += 100 + 20 * Math.min(streak, 10);
    beep(988, 0.05); setTimeout(() => beep(1319, 0.07), 60);
    milestone();
  } else {
    lives--; streak = 0; flash = 1; shake = 0.4; speed = Math.max(5, speed * 0.85);
    beep(120, 0.18, 'sawtooth'); setTimeout(() => beep(70, 0.25, 'sawtooth'), 90);
    if (lives <= 0) { gameOver(); }
  }
}

function frame(t) {
  if (state !== 'playing') return;
  const dt = lastT ? Math.min(0.05, (t - lastT) / 1000) : 0;
  lastT = t;
  // during a pit stop the car slows to a halt, gets fixed up, then pulls away
  let mul = 1;
  if (pitT > 0) {
    pitT = Math.max(0, pitT - dt);
    if (pitT === 0 && pendingRide) { upgrade(pendingRide); pendingRide = 0; }
    const held = PIT_TIME - 0.9;
    mul = pitT > held ? (pitT - held) / 0.9 : pitT > 0.9 ? 0 : 1 - pitT / 0.9;
    if (!pitFixed && pitT < held - 0.8) { pitFixed = true; lives = 3; [523, 659, 784].forEach((f, i) => setTimeout(() => beep(f, 0.08), i * 120)); }
  }
  speed += (BASE_SPEED - speed) * Math.min(1, dt * 0.25);      // after a crash, ease back up to cruising speed
  const v = speed * mul;
  travel += v * dt;
  gates.forEach(g => g.z -= v * dt);
  // tank rounds fly up the road; the sign they hit is blown away and counts as cleared
  reload = Math.max(0, reload - dt); muzzle = Math.max(0, muzzle - dt);
  shells.forEach(sh => { sh.z += 55 * dt; if (!sh.done && sh.target && sh.z >= sh.target.z) { sh.done = true; blast(sh.target); } });
  shells = shells.filter(sh => !sh.done && sh.z < Z_FAR);
  booms.forEach(b => { b.z -= v * dt; b.t += dt; }); booms = booms.filter(b => b.t < 0.8 && b.z > Z_NEAR * 0.6);
  updateFire();
  // pick a new bend now and then: about half the time the road runs straight
  if (travel > curveUntil) {
    curveTarget = Math.random() < 0.45 ? 0 : (Math.random() < 0.5 ? -1 : 1) * (0.5 + Math.random() * 0.5);
    curveUntil = travel + GATE_GAP * (2 + Math.random() * 3);
  }
  curve += (curveTarget - curve) * Math.min(1, dt * 0.9);
  skyShift += curve * v * dt * 1.4;
  upgradeT = Math.max(0, upgradeT - dt);
  while (gates.length && gates[0].z <= Z_NEAR) { const g = gates.shift(); pass(g); if (state !== 'playing') { draw(); return; } }
  const last = gates[gates.length - 1];
  if (!last || last.z < Z_FAR - GATE_GAP) gates.push(Object.assign(nextGate(), { z: (last ? last.z : Z_FAR - GATE_GAP) + GATE_GAP }));
  const targetX = laneX(lane, halfAt(Z_NEAR * 1.08));
  carX += (targetX - carX) * Math.min(1, dt * 14);
  shake = Math.max(0, shake - dt); flash = Math.max(0, flash - dt * 2.5);
  draw();
  requestAnimationFrame(frame);
}

// ---- The tank's gun ------------------------------------------------------
function updateFire() {
  const b = document.getElementById('fire');
  b.classList.toggle('hidden', ride !== 3 || state !== 'playing');
  b.classList.toggle('wait', reload > 0);
  const label = reload > 0 ? String(Math.ceil(reload)) : 'FIRE';                // while reloading, a countdown
  if (b.textContent !== label) b.textContent = label;
}
function fire() {
  if (state !== 'playing' || ride !== 3 || reload > 0 || pitT > 0) return;
  const target = gates.find(g => !g.marked && g.z > Z_NEAR);
  if (!target) return;
  target.marked = true; reload = RELOAD; muzzle = 0.15;
  shells.push({ z: Z_NEAR * 1.1, x: carX, target });
  beep(90, 0.12, 'square'); setTimeout(() => beep(60, 0.2, 'sawtooth'), 40);
  updateFire();
}
function blast(g) {
  // the sign is gone: no lane to pick, and it counts as a cleared sign
  const i = gates.indexOf(g); if (i < 0) return;
  gates.splice(i, 1);
  booms.push({ z: g.z, t: 0 });
  passed++; streak++; score += 50;
  beep(70, 0.3, 'sawtooth'); setTimeout(() => beep(45, 0.35, 'square'), 60);
  shake = 0.25;
  milestone();
}
document.getElementById('fire').addEventListener('pointerdown', e => { e.preventDefault(); fire(); });

// ---- Screens -------------------------------------------------------------
function scoreTable(hi) {
  const list = highScores();
  if (!list.length) return '<p>NO SCORES YET</p>';
  return '<div class="hs">' + list.map((r, i) => `<div class="${i === hi ? 'me' : ''}">${String(i + 1).padStart(2, ' ')} ${r.i} ${pad(r.s, 6)}</div>`).join('') + '</div>';
}
function overlay(html) { const o = document.getElementById('over'); o.className = 'over'; o.innerHTML = html; }

function showStart() {
  state = 'start';
  overlay(`<h2>PROGRESSION<br>RUN</h2>
    <p>EACH SIGN SHOWS A CHORD AND A FRET, LIKE <b style="color:#ffd166">C @8</b>.</p>
    <p>STEER INTO THE LANE OF THE SHAPE THAT PLAYS THAT CHORD THERE: <span class="e">ECHO</span> <span class="a">ALPHA</span> <span class="d">DELTA</span>.</p>
    <p>KEEP GETTING THEM RIGHT AND YOUR RIDE GETS UPGRADED. EVERY 20 RIGHT, A PIT STOP FIXES YOUR CAR.</p>
    ${scoreTable(-1)}
    <span class="go" onclick="startGame()">PRESS START</span>`);
}

function startGame() {
  score = 0; lives = 3; passed = 0; streak = 0; speed = BASE_SPEED; travel = 0; pitT = 0; pitFixed = false;
  gates = []; queue = []; key = undefined; shake = 0; flash = 0; lastT = 0;
  curve = 0; curveTarget = 0; curveUntil = GATE_GAP * 2; skyShift = 0; ride = 0; pendingRide = 0; upgradeT = 0; reload = 0; shells = []; booms = []; muzzle = 0;
  updateFire();
  setLane(1); carX = W / 2;
  let z = 18;
  for (let i = 0; i < 2; i++, z += GATE_GAP) gates.push(Object.assign(nextGate(), { z }));
  document.getElementById('over').className = 'over hidden';
  state = 'playing';
  beep(660, 0.06);
  requestAnimationFrame(frame);
}

function gameOver() {
  state = 'over'; updateFire();
  [392, 330, 262, 196].forEach((f, i) => setTimeout(() => beep(f, 0.12), i * 130));
  const list = highScores();
  const qualifies = score > 0 && (list.length < 10 || score > list[list.length - 1].s);
  setTimeout(() => overlay(`<h2>GAME<br>OVER</h2>
    <p>SCORE ${pad(score, 6)}<br>GATES ${pad(passed, 3)}</p>
    ${qualifies
      ? `<p>NEW HIGH SCORE! ENTER INITIALS</p><div class="ini"><input id="initials" maxlength="3" autocomplete="off" autocapitalize="characters" spellcheck="false"><button onclick="saveScore()">OK</button></div>`
      : scoreTable(-1) + '<span class="go" onclick="startGame()">PRESS START</span>'}`), 500);
}

function saveScore() {
  const raw = (document.getElementById('initials').value || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  const entry = { i: (raw || 'AAA').slice(0, 3).padEnd(3, 'A'), s: score };
  const list = highScores(); list.push(entry); list.sort((a, b) => b.s - a.s);
  const top = list.slice(0, 10);
  store(HS_KEY, JSON.stringify(top));
  overlay(`<h2>GAME<br>OVER</h2><p>SCORE ${pad(score, 6)}</p>${scoreTable(top.indexOf(entry))}<span class="go" onclick="startGame()">PRESS START</span>`);
}

// ---- Input ---------------------------------------------------------------
document.querySelectorAll('.lane').forEach(b => b.addEventListener('pointerdown', e => { e.preventDefault(); setLane(+b.dataset.lane); }));
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.getElementById('initials')) { saveScore(); return; }
  if (e.key === ' ') { e.preventDefault(); fire(); }
  if (e.key === 'ArrowLeft') setLane(lane - 1);
  if (e.key === 'ArrowRight') setLane(lane + 1);
  if (e.key === '1') setLane(0); if (e.key === '2') setLane(1); if (e.key === '3') setLane(2);
});
let sx = null;
const stage = document.getElementById('stage');
stage.addEventListener('pointerdown', e => { sx = e.clientX; });
stage.addEventListener('pointerup', e => { if (sx === null) return; const dx = e.clientX - sx; if (Math.abs(dx) > 24) setLane(lane + (dx > 0 ? 1 : -1)); sx = null; });
document.addEventListener('visibilitychange', () => {
  if (document.hidden && state === 'playing') state = 'paused';
  else if (!document.hidden && state === 'paused') { state = 'playing'; lastT = 0; requestAnimationFrame(frame); }
});

// Scale the pixel canvas to the screen
function fit() {
  const s = Math.max(1, Math.min((Math.min(window.innerWidth, 520) - 24) / W, (window.innerHeight - 120) / H));
  cv.style.width = Math.floor(W * s) + 'px'; cv.style.height = Math.floor(H * s) + 'px';
}
window.addEventListener('resize', fit);

soundOn = load(SOUND_KEY) !== '0';
document.getElementById('snd').textContent = soundOn ? 'SND ON' : 'SND OFF';
fit();
score = 0; lives = 3; passed = 0; streak = 0; travel = 0; gates = []; queue = []; lane = 1; carX = W / 2; shake = 0; flash = 0;
document.fonts && document.fonts.ready.then(draw);
draw();
showStart();
</script>
</body>
</html>
