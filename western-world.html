<style>
/* Frontier print: wood-type headlines in Rye, telegram text in Courier, a parchment poster for menus */

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

.plank::before, .plank::after { content: ''; position: absolute; top: 50%; width: 5px; height: 5px; margin-top: -3px; border-radius: 50%; background: #2a2622; box-shadow: inset 1px 1px 0 #6a625a; }
.plank::before { left: 6px; } .plank::after { right: 6px; }

  background: var(--grain), repeating-linear-gradient(180deg, transparent 0 86px, rgba(20,8,2,0.75) 86px 89px, rgba(255,230,190,0.15) 89px 90px), var(--streak), linear-gradient(var(--bleach1), var(--bleach2)); background-size: 160px, auto, 100% 90px, auto; border: 3px solid #120a04; box-shadow: inset 0 0 50px rgba(30,12,2,0.75); }

.post .tag { font-size: 12px; letter-spacing: 4px; font-weight: 700; color: #d8ccb4; text-shadow: 0 1px 0 #000, 0 0 6px #000; margin: 10px 0 10px; }
.pole { position: relative; width: 300px; max-width: 92%; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; align-items: center; padding-top: 4px; }
.pole::before { content: ''; position: absolute; top: 0; bottom: 0; left: 50%; width: 20px; margin-left: -10px; background: var(--grain), linear-gradient(90deg, #4a3a2a, #7e6a52 40%, #54402c); background-size: 160px, auto; box-shadow: 4px 0 0 rgba(0,0,0,0.25); }
.sign { position: relative; z-index: 1; width: 250px; height: 62px; border: none; cursor: pointer; font-family: 'Rye', serif; font-size: 25px; color: #160a02; text-shadow: 1px 1px 0 rgba(255,232,196,0.42), -1px -1px 0 rgba(0,0,0,0.85), 0 0 3px rgba(20,6,0,0.9), 0 0 9px rgba(50,18,2,0.75);
  background: var(--cracks), var(--scorch), var(--grain), var(--streak), linear-gradient(176deg, var(--bleach1), var(--bleach2)); background-size: 100% 100%, 100% 100%, 160px, 100% 100%, auto; box-shadow: inset 0 0 16px rgba(40,18,4,0.65), inset 0 -3px 0 rgba(0,0,0,0.3); filter: drop-shadow(0 5px 0 rgba(0,0,0,0.45)); padding: 0 30px; }
.sign i { position: absolute; top: 50%; width: 6px; height: 6px; margin-top: -3px; border-radius: 50%; background: #262220; box-shadow: inset 1px 1px 0 #6a625a, 1px 1px 0 rgba(255,230,190,0.3); }
.sign.r i { left: calc(50% - 25px); } .sign.l i { left: calc(50% + 19px); }
.sign.r { clip-path: polygon(0 4%, 30% 0, 62% 3%, 86% 0, 100% 48%, 87% 100%, 50% 97%, 18% 100%, 1% 96%); transform: translateX(22px) rotate(-2deg); text-align: left; }
.sign.l { clip-path: polygon(13% 0, 44% 3%, 74% 0, 99% 4%, 100% 95%, 70% 100%, 38% 97%, 14% 100%, 0 52%); transform: translateX(-22px) rotate(2deg); text-align: right; }
.sign .best { display: block; font-family: 'Courier Prime', monospace; font-weight: 700; font-size: 12px; letter-spacing: 1px; }
.sign .soon { display: block; font-family: 'Courier Prime', monospace; font-weight: 700; font-size: 12px; letter-spacing: 3px; opacity: 0.75; }

/* 16-bit look for the game itself (see PIXEL_LOOK) */
.pix #cv { image-rendering: pixelated; }
.pix .hud .side, .pix .plank { background: none center / 100% 100% no-repeat; image-rendering: pixelated; box-shadow: 3px 3px 0 rgba(28,18,10,0.5); border-radius: 0; }
.pix .plank::before, .pix .plank::after { display: none; }

.pix .hud .side, .pix .hud .side b, .pix .plank span, .pix .plank b { color: transparent !important; text-shadow: none !important; }
.pix canvas.pixhud { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
/* the trail screen, in 16-bit sepia */
.post.pix { background: #94704f; image-rendering: pixelated; background-size: 100% 100%; padding-top: 16px; }
.post.pix img { image-rendering: pixelated; display: block; }
.post.pix .title { width: 300px; max-width: 92%; height: auto; position: relative; z-index: 2; margin-bottom: 10px; filter: drop-shadow(4px 4px 0 rgba(28,18,10,0.45)); }
.post.pix .pole::before { width: 16px; margin-left: -8px; top: -14px; background: var(--pixpost) center top / 100% auto repeat-y; image-rendering: pixelated; box-shadow: 4px 0 0 rgba(28,18,10,0.35); }
.post.pix .sign { width: 248px; height: 60px; padding: 0; background: none; box-shadow: none; clip-path: none; filter: drop-shadow(4px 4px 0 rgba(28,18,10,0.45)); }
.post.pix .sign img { width: 248px; height: 60px; }
.post.pix .sign.r { transform: translateX(22px); } .post.pix .sign.l { transform: translateX(-22px); }
.post.pix .sign:not(.shut):active { transform: translateX(22px) translateY(2px); }
.post.pix .sign.shut { filter: drop-shadow(4px 4px 0 rgba(28,18,10,0.45)); }
.cls { display: grid; gap: 8px; margin: 6px 6px 6px; }
.cl { display: flex; align-items: center; gap: 12px; padding: 8px 12px; background: rgba(255,248,230,0.45); border: 2px solid var(--ink); text-align: left; cursor: pointer; color: var(--ink); }
.cl:active, .cl:hover { background: rgba(255,248,230,0.8); }
.cl .name { font-family: 'Rye', serif; font-size: 22px; line-height: 1.05; }
.cl .what { font-size: 13px; }
.cl .best { margin-left: auto; font-family: 'Rye', serif; font-size: 18px; color: var(--rust); }
.big { font-family: 'Rye', serif; font-size: 64px; line-height: 1; text-align: center; color: var(--ink);  color: #160a02; text-shadow: 1px 1px 0 rgba(255,232,196,0.42), -1px -1px 0 rgba(0,0,0,0.85), 0 0 3px rgba(20,6,0,0.9), 0 0 9px rgba(50,18,2,0.75); }
.lbl { font-size: 14px; text-align: center; margin: 6px 0 12px;  color: #160a02; text-shadow: 1px 1px 0 rgba(255,232,196,0.38); }
.medal { text-align: center; font-family: 'Rye', serif; font-size: 22px; color: var(--rust); margin: 4px 0 6px;  color: #160a02; text-shadow: 1px 1px 0 rgba(255,232,196,0.42), -1px -1px 0 rgba(0,0,0,0.85), 0 0 3px rgba(20,6,0,0.9), 0 0 9px rgba(50,18,2,0.75); }
.btns { text-align: center; }
.go { display: inline-block; margin: 2px 4px 14px; padding: 7px 16px 6px; background: linear-gradient(#3a3430, #1c1814); box-shadow: inset 0 1px 0 #6a625a, 0 3px 0 rgba(0,0,0,0.5); color: #d8ccb4; font-family: 'Rye', serif; font-size: 20px; cursor: pointer; }
.go.alt { background: none; box-shadow: none; color: #160a02; border: 2px solid #160a02; }
.hs-h { font-size: 13px; letter-spacing: 2px; text-align: center; margin: 6px 0 4px;  color: #160a02; text-shadow: 1px 1px 0 rgba(255,232,196,0.38); }
.hs { display: grid; grid-template-columns: 2em 4em auto; justify-content: center; row-gap: 2px; font-size: 18px;  color: #160a02; text-shadow: 1px 1px 0 rgba(255,232,196,0.38); }
.hs .me { background: rgba(20,8,2,0.25); }
.ini { display: flex; gap: 10px; align-items: center; justify-content: center; margin: 6px 0 12px; }
.ini input { width: 110px; font-family: 'Rye', serif; font-size: 34px; letter-spacing: 4px; text-transform: uppercase; background: rgba(20,8,2,0.12); color: #160a02; border: none; border-bottom: 3px solid #160a02; border-radius: 0; padding: 0 0 0 4px; }

.ini button { background: linear-gradient(#3a3430, #1c1814); color: #d8ccb4; border: none; padding: 6px 12px; font-family: 'Rye', serif; cursor: pointer; }
.hint { text-align: center; font-size: 13px; color: #c8a878; margin-top: 6px; }

<body>
<div class="screen">
  <div class="top">
    <a href="arcade.html">&lt; ARCADE</a>
    <button id="snd" onclick="toggleSound()">SOUND ON</button>
  </div>
  <div class="stage">
    <canvas id="cv"></canvas>
    <div class="hud" id="hud">
      <div class="side">TARGET<b id="count">1/12</b></div>
      <div class="plank"><span>SHOOT THE</span><b id="ask">F</b></div>
      <div class="side r">TIME<b id="time">0:00.0</b></div>

<script>
// ---- 16-bit sepia: drawn a pixel at a time, then scaled up with hard edges ----
const Pix = (() => {
  // nine sepia tones, darkest first
  const P = ['#1c120a', '#36251a', '#55392a', '#74513a', '#94704f', '#b38f68', '#cdab80', '#e2c79c', '#f3e3bf'];
  const BAYER = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];
  function rng(seed) { let s = seed >>> 0 || 1; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }
  function canvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
  function rect(g, x, y, w, h, col) { g.fillStyle = col; g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
  // a tiny 3x5 font for the small print
  const F3 = { A: '010101111101101', B: '110101110101110', C: '011100100100011', D: '110101101101110', E: '111100110100111', F: '111100110100100', G: '011100101101011', H: '101101111101101', I: '111010010010111', J: '001001001101010', K: '101101110101101', L: '100100100100111', M: '101111111101101', N: '110101101101101', O: '010101101101010', P: '110101110100100', Q: '010101101110011', R: '110101110101101', S: '011100010001110', T: '111010010010010', U: '101101101101111', V: '101101101101010', W: '101101111111101', X: '101101010101101', Y: '101101010010010', Z: '111001010100111',
    0: '111101101101111', 1: '010110010010111', 2: '110001010100111', 3: '110001010001110', 4: '101101111001001', 5: '111100110001110', 6: '011100111101111', 7: '111001010010010', 8: '111101111101111', 9: '111101111001110', ':': '000010000010000', '.': '000000000000010', '-': '000000111000000', ' ': '000000000000000' };
  function small(g, text, cx, y, col, hi) {
    text = String(text).toUpperCase(); const w = text.length * 4 - 1; let x = Math.round(cx - w / 2);
    for (const ch of text) { const b = F3[ch] || F3[' ']; for (let i = 0; i < 15; i++) if (b[i] === '1') { if (hi) rect(g, x + i % 3, y + (i / 3 | 0) + 1, 1, 1, hi); } for (let i = 0; i < 15; i++) if (b[i] === '1') rect(g, x + i % 3, y + (i / 3 | 0), 1, 1, col); x += 4; }
  }
  // the western face drawn at pixel size: anything over half covered is ink, the rest is not
  function big(g, text, cx, base, size, col, hi, sx) {
    const W = g.canvas.width, H = g.canvas.height, m = canvas(W, H), mg = m.getContext('2d');
    mg.font = `${size}px Rye, serif`; mg.textAlign = 'center'; mg.fillStyle = '#000'; mg.translate(cx, 0); mg.scale(sx || 1, 1); mg.fillText(text, 0, base);
    const d = mg.getImageData(0, 0, W, H).data, on = (x, y) => x >= 0 && y >= 0 && x < W && y < H && d[(y * W + x) * 4 + 3] > 120;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      if (on(x, y)) rect(g, x, y, 1, 1, col);
      else if (hi && on(x - 1, y - 1)) rect(g, x, y, 1, 1, hi);
    }
  }
  // poster lettering: arched along a curve, filled light to deep in bands, bevelled, outlined, dropped shadow
  function epic(g, text, cx, base, size, opt) {
    opt = Object.assign({ arc: 0, stretch: 1.15, shadow: 2 }, opt || {});
    const W = g.canvas.width, H = g.canvas.height, m = canvas(W, H), mg = m.getContext('2d');
    mg.font = `${size}px Rye, serif`; mg.textBaseline = 'alphabetic'; mg.fillStyle = '#000';
    const ws = [...text].map(ch => mg.measureText(ch).width), total = ws.reduce((a, b) => a + b, 0), half = total / 2;
    const lift = x => { const t = (x - cx) / half; return -opt.arc * (1 - t * t); };
    let x = cx - half;
    [...text].forEach((ch, i) => { const mid = x + ws[i] / 2, t = (mid - cx) / half, ang = Math.atan(2 * opt.arc * t / half);
      mg.save(); mg.translate(mid, base + lift(mid)); mg.rotate(ang); mg.scale(1, opt.stretch); mg.textAlign = 'center'; mg.fillText(ch, 0, 0); mg.restore(); x += ws[i]; });
    const d = mg.getImageData(0, 0, W, H).data, on = (x, y) => x >= 0 && y >= 0 && x < W && y < H && d[(y * W + x) * 4 + 3] > 120;
    const capH = size * 0.74 * opt.stretch;
    // flat: one colour, an optional dark outline, no shading and no shadow
    if (opt.flat) {
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
        if (on(x, y)) { rect(g, x, y, 1, 1, opt.fill || P[7]); continue; }
        if (opt.outline !== false && (on(x - 1, y) || on(x + 1, y) || on(x, y - 1) || on(x, y + 1))) rect(g, x, y, 1, 1, P[0]);
      }
      return;
    }
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { if (on(x, y)) continue;
      let near = false; for (let a = -1; a <= 1 && !near; a++) for (let b = -1; b <= 1; b++) if (on(x + a, y + b)) { near = true; break; }
      if (near) { rect(g, x, y, 1, 1, P[0]); continue; }
      for (let k = 2; k <= opt.shadow + 1; k++) if (on(x - k, y - k)) { rect(g, x, y, 1, 1, P[1]); break; } }

  if (state === 'playing') {
    if (betweenT <= 0) { time += dt; roundT += dt; }
    if (reloadT > 0) { reloadT -= dt; if (reloadT <= 0) { shots = 0; tone(600, 0.06, 'square', 0, 0.04); } }
    if (betweenT > 0) { betweenT -= dt; if (betweenT <= 0) { round++; if (round >= TARGETS) return finish(); newRound(); } }
    updateHud();
  }
  recoil = Math.max(0, recoil - dt * 5); flashT = Math.max(0, flashT - dt);
  // pans swing like weights on a string
  pans.forEach(p => {
    if (p.state === 'fly') { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 900 * dt; p.rot += p.spin * dt; return; }
    p.vs += -p.swing * 18 * dt; p.vs *= Math.pow(0.6, dt); p.swing += p.vs * dt;
  });
  fx.forEach(f => { f.x += f.vx * dt; f.y += f.vy * dt; f.vy += f.g * dt; f.t -= dt; }); fx = fx.filter(f => f.t > 0);
  smoke.forEach(s => { s.y -= 20 * dt; s.x += 8 * dt; s.t -= dt; }); smoke = smoke.filter(s => s.t > 0);
  words.forEach(w => w.t -= dt); words = words.filter(w => w.t > 0);
  if (!tumble && Math.random() < dt * 0.06) tumble = { x: -30, y: H * rand(0.68, 0.78), r: rand(9, 14), v: rand(50, 90) };
  if (tumble) { tumble.x += tumble.v * dt; if (tumble.x > W + 40) tumble = null; }
  draw();
  if (PIXEL_LOOK) pixelate();
  requestAnimationFrame(frame);
}

// ---- Screens -------------------------------------------------------------
function overlay(html) { const o = document.getElementById('over'); o.className = 'over'; o.innerHTML = html; document.getElementById('hud').style.visibility = 'hidden'; }
function hideOverlay() { document.getElementById('over').className = 'over hidden'; document.getElementById('hud').style.visibility = ''; }
function bestFor(c) { const t = times()[c] || []; return t.length ? fmt(t[0].s) : ''; }
const PLACES = [['range', 'The Range'], ['saloon', 'Saloon'], ['plains', 'The Plains'], ['corral', 'The Corral']];
function trailArt(el) {
  const { P, board, big, small, scene, cactus, scale, canvas, rect } = Pix;
  // the backdrop, two screen pixels to one art pixel
  const w = Math.max(60, Math.round(el.clientWidth / 2)), h = Math.max(60, Math.round(el.clientHeight / 2));
  const bg = scene(w, h, 7, { hz: 0.62, sunX: 0.8 }), bgg = bg.getContext('2d');
  cactus(bgg, 8, Math.round(h * 0.62) - 22, 26, false); cactus(bgg, w - 18, Math.round(h * 0.62) + 6, 14, true);
  el.style.backgroundImage = `url(${bg.toDataURL()})`;
  // the post
  const po = canvas(8, 64), pg = po.getContext('2d'); rect(pg, 0, 0, 8, 64, P[3]); rect(pg, 0, 0, 1, 64, P[0]); rect(pg, 7, 0, 1, 64, P[0]); rect(pg, 1, 0, 1, 64, P[4]); rect(pg, 6, 0, 1, 64, P[2]);
  const r = Pix.rng(5); for (let i = 0; i < 26; i++) rect(pg, 2 + Math.floor(r() * 4), Math.floor(r() * 64), 1, 2 + Math.floor(r() * 5), r() < 0.6 ? P[2] : P[4]);
  el.style.setProperty('--pixpost', `url(${scale(po, 2).toDataURL()})`);
  // the name, on one board
  const t = board(156, 68, 11, { tone: 5, nails: [[5, 6], [149, 6], [5, 60], [149, 60]] }), tg = t.getContext('2d'), flat = { flat: true, outline: false, fill: P[0] };
  Pix.epic(tg, 'WESTERN', 78, 35, 23, { arc: 6, ...flat }); Pix.epic(tg, 'WORLD', 78, 60, 23, flat);
  return { title: scale(t, 2).toDataURL(), sign(name, sub, dir, seed, shut) {
    const c = board(124, 30, seed, { dir, tone: shut ? 4 : 5, knots: 1, nails: [[dir > 0 ? 6 : 116, 13]] }), g = c.getContext('2d'), cx = 62 - dir * 5;
    big(g, name, cx, sub ? 18 : 21, 15, shut ? P[1] : P[0], null);
    if (sub) small(g, sub, cx, 21, P[0], null);
    return scale(c, 2).toDataURL(); } };
}
function showStart() {
  state = 'start';
  document.getElementById('over').className = 'over hidden';
  document.getElementById('hud').style.visibility = 'hidden';
  const best = (times().range || [])[0];
  const el = document.getElementById('post'); el.className = 'post pix';
  const draw = () => {
    const art = trailArt(el);
    el.innerHTML = `<img class="title" src="${art.title}" alt="Western World"><div class="pole">${PLACES.map(([id, name], i) => {
      const open = id === 'range', sub = open ? (best ? `best ${fmt(best.s)} ${best.i}` : '') : 'coming soon';
      return `<button class="sign ${i % 2 ? 'l' : 'r'}${open ? '' : ' shut'}" ${open ? `onclick="startStage()"` : 'aria-disabled="true"'} aria-label="${name}"><img src="${art.sign(name, sub, i % 2 ? -1 : 1, 101 + i * 17, !open)}" alt=""></button>`;
    }).join('')}</div>`;
  };
  (document.fonts ? document.fonts.load('22px Rye').catch(() => {}) : Promise.resolve()).then(draw);
}
function startStage() {
  layout();
  round = 0; time = 0; penalties = 0; hits = 0; misses = 0; shots = 0; reloadT = 0; betweenT = 0; holes = []; fx = []; words = []; smoke = [];
  newRound(); document.getElementById('post').className = 'post hidden'; hideOverlay(); state = 'playing';
  tone(220, 0.15, 'triangle', 0, 0.05); tone(330, 0.2, 'triangle', 0, 0.05, 0.15);
}
let finalTime = 0;
function finish() {
  state = 'over';
  finalTime = time + penalties;
  const per = finalTime / TARGETS, rank = per < 2.2 ? 'Sharpshooter' : per < 3.5 ? 'Deputy' : per < 5 ? 'Ranch Hand' : null;
  const list = times().range || [];
  const qualifies = list.length < 10 || finalTime < list[list.length - 1].s;
  overlay(`<div class="kick">RANGE CLOSED</div><h2>Time</h2><div class="big">${fmt(finalTime)}</div>
    ${rank ? `<div class="medal">Rated ${rank}</div>` : ''}
    <div class="lbl">The Range. ${misses ? `${misses} wrong pan${misses > 1 ? 's' : ''}, +${penalties}s.` : 'Not one wrong pan.'}</div>
    ${qualifies
      ? `<p style="text-align:center">Sign the book, partner:</p><div class="ini"><input id="initials" maxlength="3" autocomplete="off" autocapitalize="characters" spellcheck="false"><button onclick="saveTime()">SIGN</button></div>`
      : `<div class="btns"><span class="go" onclick="startStage()">Again</span><span class="go alt" onclick="showStart()">Signpost</span></div>` + table(-1)}`);
  setTimeout(() => { const i = document.getElementById('initials'); if (i) i.focus(); }, 50);
}
function table(hi) {
  const list = times().range || [];
  if (!list.length) return '';
  return `<div class="hs-h">FASTEST ON THE RANGE</div><div class="hs">` + list.map((e, i) => { const k = i === hi ? ' class="me"' : ''; return `<span${k}>${i + 1}</span><span${k}>${e.i}</span><span${k}>${fmt(e.s)}</span>`; }).join('') + '</div>';
}
function saveTime() {
  const raw = (document.getElementById('initials').value || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  const entry = { i: (raw || 'AAA').slice(0, 3).padEnd(3, 'A'), s: +finalTime.toFixed(1) };
  const all = times(); const list = all.range || []; list.push(entry); list.sort((a, b) => a.s - b.s);
  all.range = list.slice(0, 10); store(HS_KEY, JSON.stringify(all));
  overlay(`<div class="kick">RANGE CLOSED</div><h2>Time</h2><div class="big">${fmt(finalTime)}</div><div class="lbl">Your name is in the book.</div>
    <div class="btns"><span class="go" onclick="startStage()">Again</span><span class="go alt" onclick="showStart()">Signpost</span></div>${table(all.range.indexOf(entry))}`);
}
document.addEventListener('keydown', e => { if (e.key === 'Enter' && document.getElementById('initials')) saveTime(); });

// ---- Setup ---------------------------------------------------------------
function fit() {
  W = (document.querySelector('.screen').clientWidth - 22) | 0;
  const room = window.innerHeight - document.querySelector('.stage').getBoundingClientRect().top - 40;
  H = Math.max(420, Math.min(Math.round(W * 1.9), room)) | 0;
  dpr = PIXEL_LOOK ? 0.5 : (window.devicePixelRatio || 1);
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); cv.style.width = W + 'px'; cv.style.height = H + 'px';
  document.querySelector('.stage').style.minHeight = H + 6 + 'px';
  document.getElementById('post').style.height = (H - 6) + 'px';
  birds = [{ x: W * 0.3, y: H * 0.12, rx: 30, ry: 8, sp: 0.6, ph: 0 }, { x: W * 0.36, y: H * 0.1, rx: 24, ry: 6, sp: 0.7, ph: 2 }];
  layout();
  if (PIXEL_LOOK) requestAnimationFrame(pixelBoards);
}
// the scoreboard planks, drawn to their own size two screen pixels to the art pixel, lettering and all
let hudArt = [];
function pixelBoards() {
  hudArt = [...document.querySelectorAll('.hud .side, .hud .plank')].map((el, i) => {
    const w = Math.round(el.offsetWidth / 2), h = Math.round(el.offsetHeight / 2); if (w < 8 || h < 8) return null;
    let c = el.querySelector('canvas.pixhud'); if (!c) { c = document.createElement('canvas'); c.className = 'pixhud'; el.appendChild(c); }
    c.width = w; c.height = h;
    return { el, c, base: Pix.board(w, h, 60 + i * 7, { knots: 1, nails: [[2, 2], [w - 4, 2], [2, h - 4], [w - 4, h - 4]] }), key: '' };
  }).filter(Boolean);
  drawHudPix();
}
function drawHudPix() {
  if (!PIXEL_LOOK) return;
  hudArt.forEach(a => {
    const label = (a.el.querySelector('span') || a.el.firstChild).textContent.trim(), val = a.el.querySelector('b').textContent;
    if (a.key === label + val) return; a.key = label + val;
    const g = a.c.getContext('2d'), w = a.c.width, h = a.c.height, P = Pix.P;
    g.clearRect(0, 0, w, h); g.drawImage(a.base, 0, 0);
    Pix.small(g, label, w / 2, 3, P[0], null);
    // the value in the western face, as big as the board allows
    // squeeze it sideways rather than shrink it, down to two thirds width, then shrink if it still won't fit
    let size = Math.round((h - 14) / 0.7); g.font = `${size}px Rye, serif`;
    while (size > 8 && g.measureText(val).width * 0.66 > w - 5) { size--; g.font = `${size}px Rye, serif`; }
    const sx = Math.min(1, (w - 5) / g.measureText(val).width);
    Pix.big(g, val, w / 2, h - 3, size, P[0], null, sx);
  });
}
window.addEventListener('resize', fit);

soundOn = load(SOUND_KEY) !== '0';
document.getElementById('snd').textContent = soundOn ? 'SOUND ON' : 'SOUND OFF';
fit();
newRound();
document.fonts && document.fonts.ready.then(fit);
showStart();
requestAnimationFrame(frame);
</script>
