<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Echo Alpha Delta">
<meta name="application-name" content="Echo Alpha Delta">
<title>Contact | Echo Alpha Delta</title>
<meta name="description" content="Questions about the book or the website? Send a message to Echo Alpha Delta Publishing.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jura:wght@400;600;700&family=Turret+Road:wght@400;700&display=swap" rel="stylesheet">
<style>
* { -webkit-tap-highlight-color: transparent; }
button:active, a:active { opacity: 1 !important; }

html, body { margin: 0; padding: 0; background: #000000; }
* { box-sizing: border-box; }
body { color: #f0ede8; font-family: 'Jura', monospace; line-height: 1.85; }
.page { max-width: 560px; margin: 0 auto; padding: 40px 24px 80px; }
.back-link {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: 'Jura', monospace;
  font-size: 0.65rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-decoration: none;
  width: 150px; height: 54px;
  padding: 0;
  background: radial-gradient(ellipse at 45% 40%, #0d110d 0%, #050807 100%);
  border: 1px solid rgba(192,201,192,0.38);
  box-shadow: 0 0 10px rgba(192,201,192,0.1), 0 0 3px rgba(192,201,192,0.2);
  color: #b1d3b1;
  text-shadow: 0 0 7px rgba(177,211,177,0.8), 0 0 16px rgba(177,211,177,0.35);
  border-radius: 50%;
  cursor: pointer;
  margin-bottom: 40px;
}
h1 { font-family: 'Jura', monospace; font-size: 1.5rem; font-weight: 700; letter-spacing: 0.06em; color: #f5a623; text-shadow: 0 0 16px rgba(245,166,35,0.4); margin: 0 0 32px 0; }
.field-label { display: block; font-size: 0.72rem; letter-spacing: 0.06em; color: rgba(245,166,35,0.6); margin: 0 0 4px; }
.contact-field {
  display: block; width: 100%;
  background: #0a0a0a; color: #f0ede8;
  border: 1px solid rgba(255,255,255,0.12); border-radius: 0;
  padding: 11px 14px; font-family: 'Jura', sans-serif; font-size: 0.9rem;
  letter-spacing: 0.04em; margin-bottom: 18px;
}
.contact-field:focus { outline: none; border-color: rgba(245,166,35,0.5); }
textarea.contact-field { height: 160px; resize: vertical; }
.contact-submit {
  display: inline-flex; align-items: center; justify-content: center;
  font-family: 'Jura', sans-serif; font-size: 0.8rem; font-weight: 700;
  letter-spacing: 0.08em;
  background: #f5a623; color: #000; border: none; border-radius: 50%;
  padding: 14px 36px; cursor: pointer; margin-top: 4px;
  transition: box-shadow 0.2s;
}
.contact-submit:hover { box-shadow: 0 0 28px rgba(245,166,35,0.4); }
.contact-submit:disabled { opacity: 0.5; cursor: default; }
.contact-confirm { font-size: 0.75rem; color: rgba(231,76,60,0.85); letter-spacing: 0.05em; margin-top: 14px; line-height: 1.6; min-height: 1em; }
.contact-thanks { display: none; font-size: 0.9rem; color: #f5a623; text-shadow: 0 0 12px rgba(245,166,35,0.3); letter-spacing: 0.06em; line-height: 1.7; padding: 24px 0; }
</style>
</head>
<body>
<div class="page">
  <a href="index.html" class="back-link">&#8592; Back to Map</a>
  <h1>Contact</h1>

  <form id="contactForm" novalidate>
    <label class="field-label" for="contactName">Your Name</label>
    <input type="text" id="contactName" class="contact-field" autocomplete="name">
    <label class="field-label" for="contactEmail">Your Email Address</label>
    <input type="email" id="contactEmail" class="contact-field" autocomplete="email">
    <label class="field-label" for="contactMessage">Your Message</label>
    <textarea id="contactMessage" class="contact-field"></textarea>
    <button type="submit" class="contact-submit" id="contactSubmit">Send</button>
    <p class="contact-confirm" id="contactConfirm"></p>
  </form>
  <p class="contact-thanks" id="contactThanks">Thanks! Your message has been sent to Echo Alpha Delta Publishing.</p>
</div>

<script>
document.getElementById('contactForm').addEventListener('submit', function(e) {
  e.preventDefault();
  var name    = document.getElementById('contactName').value.trim();
  var email   = document.getElementById('contactEmail').value.trim();
  var message = document.getElementById('contactMessage').value.trim();
  var conf    = document.getElementById('contactConfirm');
  var btn     = document.getElementById('contactSubmit');
  if (!name)                              { conf.textContent = 'Please enter your name.'; return; }
  if (!email || !email.includes('@'))     { conf.textContent = 'Please enter a valid email.'; return; }
  if (!message)                           { conf.textContent = 'Please enter a message.'; return; }
  conf.textContent = '';
  btn.disabled = true;
  fetch('https://formspree.io/f/maqlqajj', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
    body: JSON.stringify({ name: name, email: email, message: message, _replyto: email, _subject: 'Contact Form' })
  }).then(function(r) {
    if (r.ok) {
      document.getElementById('contactForm').style.display = 'none';
      document.getElementById('contactThanks').style.display = 'block';
    } else {
      conf.textContent = 'Something went wrong. Try again.';
      btn.disabled = false;
    }
  }).catch(function() {
    conf.textContent = 'Something went wrong. Try again.';
    btn.disabled = false;
  });
});
</script>
</body>
</html>
