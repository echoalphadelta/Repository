const SHAPES = {
  // the classic: a straight back, a flat top, the marquee overhanging the screen
  classic: { toe: 0.585, kickBot: 0.56, kick: [0.56, 0.84], lip0: [0.745, 0.905], lip1: [0.765, 0.975], cpBack: [0.53, 1.06], scrTop: [0.41, 1.50], mqBot: [0.53, 1.535], mqTop: [0.535, 1.81], top: [[0.02, 1.83], [0, 1.80]] },
  // a small cabaret with the big round corner of an old handheld at the top of the back
  handheld: { toe: 0.57, kickBot: 0.55, kick: [0.55, 0.84], lip0: [0.73, 0.9], lip1: [0.75, 0.97], cpBack: [0.52, 1.05], scrTop: [0.44, 1.47], mqBot: [0.5, 1.5], mqTop: [0.5, 1.76], top: [[0.34, 1.76], ...arc(0.34, 1.42, 0.34, Math.PI / 2, Math.PI)] },
  // a sit-down driver: everything low, so you see it over the wheel from the seat
  driver: { toe: 0.6, kickBot: 0.58, kick: [0.58, 0.6], lip0: [0.8, 0.66], lip1: [0.82, 0.74], cpBack: [0.55, 0.84], scrTop: [0.42, 1.28], mqBot: [0.5, 1.31], mqTop: [0.52, 1.56], top: [[0.02, 1.58], [0, 1.56]] },
  // rounded: the top rolls over in one long curve down the back
  rounded: { toe: 0.585, kickBot: 0.56, kick: [0.56, 0.84], lip0: [0.745, 0.905], lip1: [0.765, 0.975], cpBack: [0.53, 1.06], scrTop: [0.41, 1.50], mqBot: [0.53, 1.535], mqTop: [0.535, 1.79], top: curve([0.535, 1.79], [0.3, 1.9], [0.0, 1.84], [0, 1.42]) },
  // a temple: narrow, a deep desk for the trackball, a recessed base
  temple: { cw: 0.62, toe: 0.6, kickBot: 0.5, kick: [0.5, 0.8], lip0: [0.84, 0.9], lip1: [0.86, 0.965], cpBack: [0.54, 1.07], scrTop: [0.42, 1.5], mqBot: [0.52, 1.53], mqTop: [0.52, 1.78], top: [[0, 1.78]] },
  // a keep: battlements along the top
  castle: { toe: 0.585, kickBot: 0.56, kick: [0.56, 0.84], lip0: [0.745, 0.905], lip1: [0.765, 0.975], cpBack: [0.53, 1.06], scrTop: [0.41, 1.50], mqBot: [0.53, 1.535], mqTop: [0.535, 1.84],
    top: [[0.535, 1.95], [0.44, 1.95], [0.44, 1.84], [0.33, 1.84], [0.33, 1.95], [0.22, 1.95], [0.22, 1.84], [0.11, 1.84], [0.11, 1.95], [0, 1.95]] },
  // a wedge: the marquee raked forward like a visor, the top falling away to a low back
  wedge: { toe: 0.6, kickBot: 0.57, kick: [0.57, 0.8], lip0: [0.78, 0.88], lip1: [0.8, 0.95], cpBack: [0.55, 1.04], scrTop: [0.41, 1.46], mqBot: [0.46, 1.5], mqTop: [0.68, 1.78], top: [[0.62, 1.81], [0, 1.6]] },
  // a fin: the kick leaning back, the top sweeping up behind like a ski jump
  fin: { toe: 0.62, kickBot: 0.6, kick: [0.48, 0.84], lip0: [0.745, 0.905], lip1: [0.765, 0.975], cpBack: [0.53, 1.06], scrTop: [0.41, 1.50], mqBot: [0.53, 1.535], mqTop: [0.535, 1.76], top: curve([0.535, 1.76], [0.36, 1.78], [0.12, 1.86], [0, 2.08], 14) },
  // wide enough for two players side by side, with a bigger screen
  wide: { cw: 0.84, sw: 0.58, toe: 0.585, kickBot: 0.56, kick: [0.56, 0.84], lip0: [0.765, 0.905], lip1: [0.785, 0.975], cpBack: [0.53, 1.06], scrTop: [0.38, 1.56], mqBot: [0.5, 1.59], mqTop: [0.505, 1.86], top: [[0.02, 1.88], [0, 1.85]] },

const seg = (a, b) => ({ mid: [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], len: Math.hypot(b[0] - a[0], b[1] - a[1]), lean: Math.atan2(b[0] - a[0], b[1] - a[1]) });

// a CRT picture: the game's art cropped to 4:3, with scanlines and a slight vignette
async function screenTex(src) {
  const img = await loadImg(src), c = canvas(640, 480), g = c.getContext('2d');
  g.fillStyle = '#000'; g.fillRect(0, 0, 640, 480);
  if (img) { const k = Math.max(640 / img.width, 480 / img.height); g.drawImage(img, (640 - img.width * k) / 2, (480 - img.height * k) / 2, img.width * k, img.height * k); }

  g.fillStyle = 'rgba(0,0,0,0.28)'; for (let y = 0; y < 480; y += 3) g.fillRect(0, y, 640, 1);

const lit = (map, k) => new THREE.MeshStandardMaterial({ color: '#000', emissive: '#ffffff', emissiveMap: map, emissiveIntensity: k, roughness: 0.3 });

// ---- an upright cabinet -----------------------------------------------------------
function cabinet(o) {
  const S = o.shape, cw = S.cw || CW, iw = cw - 2 * T, cab = new THREE.Group();
  const outline = [[0, 0], [S.toe, 0], [S.toe, 0.03], [S.kickBot, 0.05], S.kick, S.lip0, S.lip1, S.cpBack, S.scrTop, S.mqBot, S.mqTop, ...S.top];

  // the cut edges carry the T-moulding.
  const geo = new THREE.ExtrudeGeometry(new THREE.Shape(outline.map(([z, y]) => new THREE.Vector2(z, y))), { depth: T, bevelEnabled: false });
  geo.rotateY(-Math.PI / 2);                                      // shape x -> forward z; extrusion -> -x
  const tmold = mat({ color: o.tmold, roughness: 0.55, metalness: o.tmoldMetal || 0 });

    const own = side < 0 && o.sideArtL, art = (own ? o.sideArtL : o.sideArt).clone(); art.needsUpdate = true; art.wrapS = art.wrapT = THREE.ClampToEdgeWrapping;

    const m = new THREE.Mesh(geo, [mat({ map: art, roughness: 0.55 }), tmold]); m.castShadow = m.receiveShadow = true;
    m.position.x = side > 0 ? cw / 2 : -cw / 2 + T; cab.add(m);

  const backH = S.top[S.top.length - 1][1];

  const tp = [S.mqTop, ...S.top], pos = [], idx = [];
  tp.forEach(([z, y], i) => { pos.push(-iw / 2, y - 0.004, z, iw / 2, y - 0.004, z); if (i) { const a = (i - 1) * 2; idx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3); } });
  const tg = new THREE.BufferGeometry(); tg.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); tg.setIndex(idx); tg.computeVertexNormals();
  const topMesh = new THREE.Mesh(tg, mat({ color: o.body, roughness: 0.6, side: THREE.DoubleSide })); topMesh.castShadow = true; cab.add(topMesh);

  board([S.kickBot, 0.05], S.kick, mat({ map: o.kickArt || null, color: o.kickArt ? '#ffffff' : o.body, roughness: 0.6 }));
  { const yd = Math.min(0.52, S.kick[1] * 0.6), k = seg([S.kickBot, 0.05], S.kick), zd = S.kickBot + (S.kick[0] - S.kickBot) * (yd - 0.05) / (S.kick[1] - 0.05);
    const pivot = new THREE.Group(); pivot.position.set(0, yd, zd); pivot.rotation.x = k.lean; cab.add(pivot);
    const door = new THREE.Group(); door.position.set(0, -0.52, -0.56); pivot.add(door); coinDoor(door, o); }

  const c = seg(S.cpBack, S.lip1), len = c.len, ang = Math.atan2(S.cpBack[1] - S.lip1[1], S.lip1[0] - S.cpBack[0]);

  const scr = new THREE.Group(); scr.position.set(0, sc.mid[1], sc.mid[0]); scr.rotation.x = sc.lean; cab.add(scr);

// Progression Run: a striped sun going down over a neon grid
function sunset(g, w, h, hz, sx, sr) {
  const bands = [['#1b1040', 1], ['#2c1452', 0.28], ['#4a1a62', 0.2], ['#7a2266', 0.13], ['#b23a6b', 0.07]];
  let y = 0; g.fillStyle = '#1b1040'; g.fillRect(0, 0, w, hz);
  bands.slice(1).forEach(([colr, k], i) => { g.fillStyle = colr; const top = hz - hz * k; g.fillRect(0, top, w, hz - top); });
  g.save(); g.beginPath(); g.rect(0, 0, w, hz); g.clip();
  g.fillStyle = '#ffd166'; g.beginPath(); g.arc(sx, hz, sr, Math.PI, 0); g.fill();
  for (let i = 0; i < 6; i++) { const gy = hz - sr * 0.08 - i * sr * 0.14, gh = sr * (0.06 - i * 0.008); g.fillStyle = '#b23a6b'; g.fillRect(sx - sr, gy - gh, sr * 2, Math.max(2, gh)); }
  g.restore();
  g.fillStyle = '#0d0820'; g.fillRect(0, hz, w, h - hz);
  g.strokeStyle = '#d2364a'; g.lineWidth = 3;
  for (let k = 1; k < 14; k++) { const yy = hz + Math.pow(k / 13, 2.1) * (h - hz); g.beginPath(); g.moveTo(0, yy); g.lineTo(w, yy); g.stroke(); }
  for (let k = -12; k <= 12; k++) { g.beginPath(); g.moveTo(sx, hz); g.lineTo(sx + k * w * 0.16, h); g.stroke(); }
  g.fillStyle = '#f48f55'; g.fillRect(0, hz - 3, w, 5);
}

function shield(g, cx, cy, w, h, a, b) {

  g.save(); p(); g.clip(); g.fillStyle = a; g.fillRect(cx - w / 2, cy - h / 2, w / 2, h / 2); g.fillRect(cx, cy, w / 2, h / 2); g.fillStyle = b; g.fillRect(cx, cy - h / 2, w / 2, h / 2); g.fillRect(cx - w / 2, cy, w / 2, h / 2); g.restore();

  { const can = !!served && served.level > 0.01 && !going && !$('menu').classList.contains('on'); if (can !== sipOn) { sipOn = can; $('sip').classList.toggle('on', can); }
  }
  if (TV) TV.tick();
  signs.forEach(sg => { if (!sg.flicker) return; sg.next -= dt; if (sg.next < 0) { sg.off = 0.12 + Math.random() * 0.25; sg.next = 4 + Math.random() * 9; }

  comp.render();
  requestAnimationFrame(frame);
}
