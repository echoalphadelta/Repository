<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Echo Alpha Delta">
<meta name="application-name" content="Echo Alpha Delta">
<title>Arcade | Echo Alpha Delta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Press+Start+2P&family=IM+Fell+English&family=Jersey+10&family=Limelight&family=Special+Elite&family=UnifrakturMaguntia&family=Kanit:ital,wght@1,800&family=VT323&family=Tiny5&family=Jersey+15&family=Workbench&family=Rye&family=Courier+Prime&family=Zen+Dots&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root { --echo: #4a9eff; --alpha: #ff4a4a; --delta: #4aff7a; --ink: #f4f1ea; --dim: #6b6862; --bg: #000; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); }
body { color: var(--ink); font-family: 'Press Start 2P', monospace; font-size: 11px; line-height: 1.6; }
a { color: inherit; text-decoration: none; }
.screen { max-width: 520px; margin: 0 auto; padding: 18px 16px 36px; }

.back { display: inline-block; font-size: 10px; color: var(--dim); padding: 6px 0; }
.back:active { color: var(--ink); }

.title { margin: 34px 0 0; font-size: 34px; line-height: 1.15; letter-spacing: 1px; }
.title span { display: block; }
.title .e { color: var(--echo); }
.title .a { color: var(--alpha); padding-left: 2.4em; }   /* G chord on a real (logarithmic) neck: Echo fret 3, Delta fret 5, Alpha fret 10 */
.title .d { color: var(--delta); padding-left: 0.79em; }
.label { margin: 18px 0 0; display: inline-block; background: var(--ink); color: var(--bg); font-size: 14px; padding: 6px 10px 5px; letter-spacing: 4px; }
.credits { margin: 14px 0 36px; font-size: 10px; color: var(--dim); }
.credits b { font-weight: 400; color: var(--ink); }

.game { display: block; margin-bottom: 22px; }
.game:active { transform: translate(2px, 2px); }

/* 01 Note Invaders: amber DOS screen */
.ni { background: #000; color: #fff; font-family: 'Workbench', monospace; font-size: 15px; padding: 6px 8px 10px; border: 2px solid #3a3a46; }
.ni .hdr { display: flex; justify-content: space-between; }
.ni .hdr b { font-weight: normal; color: #ffff00; }
.ni svg { display: block; width: 100%; height: auto; }
.ni .art { margin: 8px 0 10px; }
.ni .ttl { width: 92%; }
.ni .ttl + .info { margin-top: 10px; }
.ni .info { display: flex; justify-content: space-between; align-items: center; }
.ni .sub { color: #00ff00; }
.ni .go { background: #ff0000; color: #fff; padding: 1px 10px; margin-left: auto; }

/* 02 Shape Snap: handheld green with a sideways neck */
.ss { background: #9bbc0f; color: #0f380f; border: 4px solid #0f380f; padding: 10px; }
.ss .neck { display: grid; grid-template-columns: 10px repeat(10, 1fr); grid-auto-rows: 13px; background: #8bac0f; border-top: 3px solid #0f380f; border-bottom: 3px solid #0f380f; border-right: 5px solid #0f380f; }
.ss .neck i { border-right: 2px solid #306230; position: relative; }
.ss .neck i::before { content: ''; position: absolute; left: 0; right: 0; top: 50%; border-top: 1px solid rgba(15,56,15,0.5); }
.ss .neck i.n { border-right: 5px solid #0f380f; background: #9bbc0f; }
.ss .neck i.p { background: #306230; border: 2px solid; border-color: #8bac0f #0f380f #0f380f #8bac0f; }
.ss .neck i.p::before { display: none; }
.ss .neck i.w { background: #0f380f; }
.ss .neck i.w::before { display: none; }
.ss .info { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 10px; }
.ss .name { font-size: 13px; line-height: 1.4; }
.ss .sub { font-size: 7px; color: #306230; margin-top: 4px; }
.ss .go { display: inline-block; background: #8b1d4a; color: #9bbc0f; border-radius: 14px; padding: 6px 12px 5px; font-size: 9px; box-shadow: inset -2px -3px 0 #5c1031; }

/* 03 Progression Run: sunset road */
.pr { position: relative; overflow: hidden; border: 4px solid #0d0820; background: #0d0820; }
.pr .scene { position: relative; height: 128px; background: linear-gradient(#1b1040 0 14%, #2c1452 14% 28%, #4a1a62 28% 40%, #7a2266 40% 50%, #b23a6b 50% 58%, #f48f55 58% 62%, #234628 62%); overflow: hidden; }
.pr .sun { position: absolute; left: 50%; top: 36px; width: 56px; height: 28px; margin-left: -28px; background: repeating-linear-gradient(#ffd166 0 5px, transparent 5px 7px); border-radius: 28px 28px 0 0; }
.pr .road { position: absolute; left: 0; right: 0; top: 62%; bottom: 0; background: #43425a; clip-path: polygon(46% 0, 54% 0, 100% 100%, 0 100%); }
.pr .edge { position: absolute; left: 0; right: 0; top: 62%; bottom: 0; background: repeating-linear-gradient(#f4f1ea 0 4px, #d2364a 4px 8px); clip-path: polygon(45% 0, 46% 0, 0 100%, 0 92%, 0 100%); }
.pr .edge.r { clip-path: polygon(54% 0, 55% 0, 100% 92%, 100% 100%); }
.pr .sign { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); background: #ffd166; color: #1b1040; font-size: 10px; padding: 4px 8px 3px; white-space: nowrap; }
.pr .car { position: absolute; left: 50%; bottom: 8px; width: 30px; height: 10px; margin-left: -15px; background: #d2364a; }
.pr .car::before { content: ''; position: absolute; left: 6px; right: 6px; top: -5px; height: 5px; background: #a3243a; }
.pr .car::after { content: ''; position: absolute; left: 1px; right: 1px; bottom: -5px; height: 5px; background: linear-gradient(90deg, #111 0 7px, transparent 7px calc(100% - 7px), #111 calc(100% - 7px)); }
.pr .info { display: flex; justify-content: space-between; align-items: flex-end; padding: 10px; color: #fff3d6; }
.pr .name { font-size: 13px; line-height: 1.4; color: #ffd166; }
.pr .sub { font-size: 7px; color: #e2606a; margin-top: 4px; }
.pr .go { display: inline-block; background: #ffd166; color: #1b1040; padding: 6px 10px 5px; font-size: 9px; }

/* 04 Number Blaster: wood-grain console with a cartridge-label title */
.nb { background: repeating-linear-gradient(91deg, #6b4423 0 7px, #5c381c 7px 10px, #77502b 10px 17px, #4f2f17 17px 19px, #6b4423 19px 26px); padding: 18px 8px 8px; position: relative; border-radius: 3px; font-family: 'Jersey 10', monospace; color: #f1e6c8; }
.nb::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 11px; border-radius: 3px 3px 0 0; background: repeating-linear-gradient(#0d0d0d 0 2px, #2b2b2b 2px 4px); }
.nb .tv { background: #0b0b33; border: 5px solid #0d0d0d; }
.nb svg { display: block; width: 100%; height: 110px; }
.nb .cart { background: #000; margin-top: 8px; }
.nb .stripes { height: 14px; background: linear-gradient(#f2b33a 0 25%, #f08a24 25% 50%, #d9542a 50% 75%, #b52a2a 75%); }
.nb .info { display: flex; justify-content: space-between; align-items: flex-end; padding: 8px 12px 12px; }
.nb .name { font-family: 'Kanit', sans-serif; font-style: italic; font-weight: 800; font-size: 26px; line-height: 0.95; text-transform: uppercase; letter-spacing: -0.5px; }
.nb .sub { font-size: 17px; color: #f08a24; margin-top: 6px; }
.nb .sub.best { color: #f2b33a; }
.nb .go { background: #f08a24; color: #000; padding: 4px 14px 3px; font-size: 22px; }

/* 05 Roman Golf: stone ground, garden lawn, marble and a stone tablet */
.ng { background: #2a1730; border: 4px solid #d4a52a; outline: 2px solid #5b2a6e; outline-offset: -1px; }
.ng .course { position: relative; height: 112px; overflow: hidden; background: #cdbf9f; }
.ng .course svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.ng .tag { position: absolute; background: #f3efe6; color: #3a2a2a; font-size: 8px; padding: 3px 4px 2px; }
.ng .tag.on { outline: 2px solid #5b2a6e; }
.ng .info { display: flex; justify-content: space-between; align-items: flex-end; padding: 10px; background: linear-gradient(160deg, #d9d3c4, #c4bcaa); color: #3a2a2a; box-shadow: inset 0 3px 0 #b0a794; }
.ng .name { font-family: 'Cinzel', serif; font-weight: 700; font-size: 22px; line-height: 1.05; letter-spacing: 2px; color: #5b2a6e; }
.ng .nhead { display: flex; align-items: center; gap: 8px; }
.ng .sub { font-size: 7px; color: #3a2a2a; margin-top: 6px; }
.ng .go { display: inline-block; background: #5b2a6e; color: #f3efe6; padding: 6px 10px 5px; font-size: 9px; border-bottom: 3px solid #3a1747; }

/* 07 Tournament: parchment, heraldic banners, blackletter */
.tn { background: #f3e7c9; color: #2a1a10; border: 3px solid #c99a2e; font-family: 'IM Fell English', Georgia, serif; overflow: hidden; }
.tn svg { display: block; width: 100%; height: 118px; }
.tn .info { display: flex; justify-content: space-between; align-items: flex-end; padding: 8px 12px 12px; }
.tn .name { font-family: 'UnifrakturMaguntia', serif; font-size: 32px; line-height: 1; color: #a8261f; }
.tn .sub { font-size: 14px; color: #2a1a10; margin-top: 4px; }
.tn .sub.best { color: #23407a; }
.tn .go { white-space: nowrap; flex-shrink: 0; margin-left: 8px; background: #a8261f; color: #f3e7c9; padding: 5px 10px 4px; font-size: 15px; border-radius: 2px; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.25); }

/* 08 Slalom: a 90s console game, blue menu window and pixel lettering */
.dt { background: #111; color: #fcfcfc; border: 4px solid #f8b800; font-family: 'Jersey 15', monospace; }
.dt .shot { display: block; width: 100%; height: auto; aspect-ratio: 3 / 2; border-bottom: 4px solid #000; }
.dt .info { display: flex; justify-content: space-between; align-items: flex-end; padding: 8px 12px 12px; }
.dt .name { font-size: 40px; line-height: 0.9; color: #f8b800; text-shadow: 3px 3px 0 #d82800; }
.dt .sub { font-size: 20px; line-height: 1.1; margin-top: 6px; }
.dt .sub.best { color: #9aa0b0; }
.dt .go { flex-shrink: 0; background: #00a844; color: #fcfcfc; padding: 4px 14px 3px; font-size: 26px; border-bottom: 4px solid #006028; }
.ww { position: relative; display: block; background: #120a05; filter: drop-shadow(0 6px 5px rgba(0,0,0,0.5)); }
.ww img { display: block; width: 100%; height: auto; image-rendering: pixelated; }
.ww .sub.best { position: absolute; left: 0; right: 0; bottom: 4%; text-align: center; font-family: 'Rye', serif; font-size: 17px; color: #1c120a; text-shadow: none; }
.pl { background: #0a0c16; color: #e8ecf8; border: 2px solid #2a2e44; border-radius: 8px; overflow: hidden; font-family: 'Share Tech Mono', monospace; }
.pl svg { display: block; width: 100%; height: auto; aspect-ratio: 2 / 1; }
.pl .info { display: flex; justify-content: space-between; align-items: flex-end; padding: 10px 14px 14px; }
.pl .name { font-family: 'Zen Dots', sans-serif; font-size: 28px; line-height: 1; }
.pl .sub { font-size: 14px; line-height: 1.25; margin-top: 6px; color: #b8bcd0; }
.pl .sub.best { color: #f8d24a; }
.pl .go { flex-shrink: 0; background: #f8d24a; color: #05060c; padding: 7px 14px 6px; font-family: 'Zen Dots', sans-serif; font-size: 15px; border-radius: 5px; }
.sl { background: #2a0f66; color: #fff; border: 3px solid #14082a; box-shadow: 6px 6px 0 #ff2fa0; font-family: 'Jersey 15', monospace; margin-right: 6px; }
.sl svg { display: block; width: 100%; height: auto; aspect-ratio: 200 / 104; border-bottom: 3px solid #14082a; }
.sl .info { display: flex; justify-content: space-between; align-items: flex-end; padding: 10px 12px 12px; background: #14082a; }
.sl .name { font-family: 'Tiny5', monospace; font-size: 42px; line-height: 0.9; letter-spacing: 2px; color: #b6ff3a; text-shadow: 3px 3px 0 #ff2fa0; }
.sl .sub.best { font-size: 20px; margin-top: 6px; color: #2ee6ff; }
.sl .go { flex-shrink: 0; background: #ffe23a; color: #14082a; padding: 5px 14px 4px; font-size: 26px; transform: rotate(-3deg); box-shadow: 3px 3px 0 #2ee6ff; }

.sub.best { color: inherit; }
.sub.best:empty { display: none; }
.foot { margin-top: 30px; font-size: 8px; line-height: 2; color: var(--dim); }
</style>
</head>

<script>
// Little Shape Snap neck: nut, a grip sliding in, and a wall at the body end
(function () {
  const grip = new Set(['0-3', '1-3', '2-4', '3-5', '4-5', '5-3']);
  let h = '';
  for (let r = 0; r < 6; r++) for (let c = 0; c < 11; c++) {
    const cls = c === 0 ? 'n' : c >= 10 ? 'w' : grip.has(r + '-' + c) ? 'p' : '';
    h += `<i class="${cls}"></i>`;
  }
  document.getElementById('ssNeck').innerHTML = h;
})();

function showBest(key, id) {
  try {
    const list = JSON.parse(localStorage.getItem(key)) || [];
    if (list.length) document.getElementById(id).textContent = 'HI ' + String(list[0].s).padStart(6, '0') + ' ' + list[0].i;
  } catch (e) {}
}
showBest('noteInvadersScores', 'best1');
(function tick() { const d = new Date(), c = document.getElementById('niClock'); if (c) c.textContent = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); setTimeout(tick, 10000); })();
showBest('shapeSnapScores', 'best2');
showBest('progressionRunScores', 'best3');
showBest('numberBlasterScores', 'best4');
try {
  const tn = JSON.parse(localStorage.getItem('tournamentScores')) || [];
  if (tn.length) document.getElementById('best7').textContent = 'Champion ' + tn[0].i + ', ' + tn[0].s;
} catch (e) {}
try {
  const sl = JSON.parse(localStorage.getItem('slalomTimes')) || {};
  const all = Object.values(sl).flat().sort((a, b) => a.s - b.s);
  if (all.length) document.getElementById('best8').textContent = 'Fastest ' + Math.floor(all[0].s / 60) + ':' + (all[0].s % 60).toFixed(1).padStart(4, '0') + ' ' + all[0].i;
} catch (e) {}
try {
  const dt = JSON.parse(localStorage.getItem('dirtTrackTimes')) || {};
  const all = Object.values(dt).flat().sort((a, b) => a.s - b.s);
  if (all.length) document.getElementById('best9').textContent = 'Fastest ' + Math.floor(all[0].s / 60) + ':' + (all[0].s % 60).toFixed(1).padStart(4, '0') + ' ' + all[0].i;
} catch (e) {}
try {
  const ww = JSON.parse(localStorage.getItem('westernWorldTimes')) || {};
  const all = Object.values(ww).flat().sort((a, b) => a.s - b.s);
  if (all.length) document.getElementById('best10').textContent = 'Fastest ' + Math.floor(all[0].s / 60) + ':' + (all[0].s % 60).toFixed(1).padStart(4, '0') + ' ' + all[0].i;
} catch (e) {}
try {
  const pl = JSON.parse(localStorage.getItem('planetsTimes')) || [];
  if (pl.length) document.getElementById('best11').textContent = 'Fastest ' + Math.floor(pl[0].s / 60) + ':' + (pl[0].s % 60).toFixed(1).padStart(4, '0') + ' ' + pl[0].i;
} catch (e) {}
// golf is scored against par, lowest first
try {
  const g = JSON.parse(localStorage.getItem('romanGolfScores')) || [];
  if (g.length) document.getElementById('best5').textContent = 'BEST ' + (g[0].s === 0 ? 'E' : g[0].s > 0 ? '+' + g[0].s : g[0].s) + ' ' + g[0].i;
} catch (e) {}
</script>
