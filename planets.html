<style>

<div class="screen">

  <div class="stage">

<script>
// ---- Music: the grip engine from the Daily Game ---------------------------
const STR_OPEN = [4, 9, 2, 7, 11, 4];
const QUAL_MAP = { '':'major','m':'minor','7':'7','maj7':'Maj7','m7':'m7','sus4':'sus4' };
const QUALITY_INTERVALS_MAIN = {
  major:[0,4,7], minor:[0,3,7], '7':[0,4,7,10], Maj7:[0,4,7,11], m7:[0,3,7,10], sus4:[0,4,7],
};
const TONE_NAMES_MAIN = {
  0:'root',2:'ninth',3:'minor-third',4:'third',5:'fourth',7:'fifth',9:'sixth',10:'seventh',11:'maj7',
};
const GRIP_CONFIG = {
  echo:  { anchor:0, strings:[0,1,2,3,4,5], win:2, upper:[3,4,5] },
  alpha: { anchor:1, strings:[1,2,3,4,5],   win:2, upper:[3,4,5] },
  delta: { anchor:2, strings:[2,3,4,5],      win:3, upper:[5]     },
};

function findFrets(si, pc) {
  const out = [];
  for (let f = 0; f <= 12; f++) if ((STR_OPEN[si] + f) % 12 === pc) out.push(f);
  return out;
}
function computeGripTones(shapeName, qualStr, rootPc) {
  const quality   = QUAL_MAP[qualStr] || 'major';
  const r         = rootPc % 12;
  const intervals = QUALITY_INTERVALS_MAIN[quality];
  const { anchor, strings, win, upper } = GRIP_CONFIG[shapeName];
  const anchorFret = findFrets(anchor, r)[0];
  if (anchorFret === undefined) return new Set();
  const isSus = quality === 'sus4', suppressUpperRoot = quality === '7';
  const echoSlideback = shapeName === 'echo' && quality === 'Maj7';
  const dots = [];
  strings.forEach(s => {
    for (let fo = 0; fo <= win; fo++) {
      let f = anchorFret + fo;
      if (f > 12) f -= 12;
      if (f > 12) continue;
      const noteAtFret = (STR_OPEN[s] + f) % 12;
      intervals.forEach(interval => {
        if (noteAtFret !== (r + interval) % 12) return;
        if (shapeName === 'delta' && (interval === 4 || interval === 3) && s !== 5) return;
        const isThird = interval === 4 || interval === 3;
        const isUpperStr = upper.includes(s);
        const isUpperRoot = interval === 0 && isUpperStr && s !== anchor;
        if (suppressUpperRoot && isUpperRoot && fo > 0) return;
        if (echoSlideback && interval === 11) return;
        if (isSus && isThird && isUpperStr) {
          const sf = f + 1 > 12 ? f - 11 : f + 1;
          dots.push({ s, fret:sf, t:'fourth', isRoot:false });
        } else {
          const t = TONE_NAMES_MAIN[interval] || 'tone';
          dots.push({ s, fret:f, t, isRoot:interval === 0 });
          if (f === 12) dots.push({ s, fret:0,  t, isRoot:interval === 0 });
          if (f === 0)  dots.push({ s, fret:12, t, isRoot:interval === 0 });
        }
      });
    }
  });
  if (echoSlideback) {
    const target = (r + 11) % 12;
    for (let f2 = 0; f2 <= 12; f2++) {
      if ((STR_OPEN[5] + f2) % 12 === target) { dots.push({ s:5, fret:f2, t:'maj7', isRoot:false }); break; }
    }
  }
  const byStr = {};
  dots.forEach(d => { (byStr[d.s] = byStr[d.s] || []).push(d); });
  const priority = ['sixth','ninth','seventh','maj7','fourth','fifth','minor-third','third','root'];
  const result = new Set();
  Object.entries(byStr).forEach(([sStr, group]) => {
    const s = parseInt(sStr);
    let pick;
    if (group.length === 1) { pick = group[0]; }
    else if (s === anchor) { pick = group.find(d => d.isRoot) || group[0]; }
    else {
      group.sort((a,b) => {
        const ai = priority.indexOf(a.t), bi = priority.indexOf(b.t);
        return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
      });
      pick = group[0];
    }
    result.add(`${pick.fret}-${s}`);
  });
  return result;
}
const LETTERS = 'CDEFGAB', LETTER_PC = [0, 2, 4, 5, 7, 9, 11];
function spell(keyName, steps, semis) {
  const kl = LETTERS.indexOf(keyName[0]);
  const kpc = (LETTER_PC[kl] + (keyName[1] === '#' ? 1 : keyName[1] === 'b' ? 11 : 0)) % 12;
  const l = (kl + steps) % 7, off = ((kpc + semis - LETTER_PC[l]) % 12 + 18) % 12 - 6;
  return LETTERS[l] + (off > 0 ? '#'.repeat(off) : 'b'.repeat(-off));
}
const clean = n => n.length <= 2 && !['Cb', 'Fb', 'E#', 'B#'].includes(n);
const KEYS = ['C', 'D', 'E', 'F', 'G', 'A', 'Bb', 'Eb', 'Ab'];
// the diatonic chords of a major key, by degree
const DEG = { I: [0, 0, ''], ii: [1, 2, 'm'], iii: [2, 4, 'm'], IV: [3, 5, ''], V: [4, 7, ''], vi: [5, 9, 'm'] };
const PATTERNS = [['I', 'IV', 'V', 'I'], ['I', 'vi', 'IV', 'V'], ['ii', 'V', 'I', 'I'], ['I', 'V', 'vi', 'IV'], ['vi', 'IV', 'I', 'V'], ['I', 'iii', 'IV', 'V'], ['IV', 'I', 'V', 'vi']];
const OPEN_MIDI = [40, 45, 50, 55, 59, 64];   // low E up to high e
const ANCHOR = { echo: 0, alpha: 1, delta: 2 };

// ---- Worlds --------------------------------------------------------------
const WORLDS = {
  echo:  { name: 'ECHO', c: '#4aa8ff', shape: 'echo', blurb: 'An ice world of glass spires. Its people only play the Echo shape, root on the low E string.' },
  alpha: { name: 'ALPHA', c: '#ff5a4a', shape: 'alpha', blurb: 'A red dust world of domes and arches. Here every chord is the Alpha shape, root on the A string.' },
  delta: { name: 'DELTA', c: '#4ad88a', shape: 'delta', blurb: 'A green world of stepped temples. Only the Delta shape is spoken, root on the D string.' },
  earth: { name: 'EARTH', c: '#f8d24a', shape: null, blurb: 'Home. Every shape works here, but your hand has to stay in the lit frets, so pick the shape that fits.' },
};

// ---- State ---------------------------------------------------------------
const HS_KEY = 'planetsTimes', SOUND_KEY = 'arcadeSound';
const cv = document.getElementById('cv'); let ctx = cv.getContext('2d');
const low = document.createElement('canvas'), lowctx = low.getContext('2d');   // the flight renders small, then is blown up soft
let W = 360, H = 600, dpr = 1;
let state = 'map', world = null, cleared = {}, prog = [], step = 0, key = 'C', time = 0, misses = 0, lastT = 0, soundOn = true;
let voyaging = false, pick = 'echo', win0 = 0, grip = null, gripT = 0, buzzT = 0, travel = null, stars = [], parts = [];

function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function load(k)     { try { return localStorage.getItem(k); } catch (e) { return null; } }
function times()     { try { return JSON.parse(load(HS_KEY)) || []; } catch (e) { return []; } }
const fmt = t => Math.floor(t / 60) + ':' + (t % 60).toFixed(1).padStart(4, '0');
const rand = (a, b) => a + Math.random() * (b - a);
const hash = (a, b) => { const v = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return v - Math.floor(v); };

// ---- Sound ---------------------------------------------------------------
let audio = null;
function ac() { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); return audio; }
function tone(freq, dur, type, slide, vol, delay) {
  if (!soundOn) return;
  try {
    const a = ac(), o = a.createOscillator(), g = a.createGain(), t = a.currentTime + (delay || 0);
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
    g.gain.setValueAtTime(vol || 0.05, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur);
  } catch (e) {}
}
// a strummed chord: each string plucked a moment after the last, bright then fading
function strum(cells) {
  if (!soundOn) return;
  try {
    const a = ac();
    [...cells].map(c => c.split('-').map(Number)).sort((x, y) => x[1] - y[1]).forEach(([f, s], i) => {
      const t = a.currentTime + i * 0.035, freq = 440 * Math.pow(2, (OPEN_MIDI[s] + f - 69) / 12);
      const o = a.createOscillator(), o2 = a.createOscillator(), lp = a.createBiquadFilter(), g = a.createGain();
      o.type = 'sawtooth'; o2.type = 'triangle'; o.frequency.value = freq; o2.frequency.value = freq * 2.003;
      lp.type = 'lowpass'; lp.frequency.setValueAtTime(freq * 8, t); lp.frequency.exponentialRampToValueAtTime(freq * 1.5, t + 0.6);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.05, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.6);
      o.connect(lp); o2.connect(lp); lp.connect(g); g.connect(a.destination);
      o.start(t); o2.start(t); o.stop(t + 1.7); o2.stop(t + 1.7);
    });
  } catch (e) {}
}
function toggleSound() {
  soundOn = !soundOn;
  store(SOUND_KEY, soundOn ? '1' : '0');
  document.getElementById('snd').textContent = soundOn ? 'SOUND ON' : 'SOUND OFF';
}

// ---- Missions ------------------------------------------------------------
function chordOf(deg) { const [steps, semis, q] = DEG[deg]; const root = spell(key, steps, semis); return { deg, root, q, pc: (ROOT_PC_OF(root)), name: root + q }; }
function ROOT_PC_OF(n) { const b = LETTER_PC[LETTERS.indexOf(n[0])]; return (b + (n[1] === '#' ? 1 : n[1] === 'b' ? 11 : 0) + 12) % 12; }

function miss(msg) { misses++; time += 2; buzzT = 1; hint(msg + '  +2s'); tone(110, 0.25, 'sawtooth', 70, 0.05); }
function hint(t) { document.getElementById('hint').textContent = t; }
document.querySelectorAll('#shapes button').forEach(b => b.addEventListener('click', () => { pick = b.dataset.s; document.querySelectorAll('#shapes button').forEach(x => x.classList.toggle('sel', x === b)); tone(500, 0.05, 'triangle'); }));
function renderProg() {
  const el = document.getElementById('prog'), c = WORLDS[world].c;
  el.className = 'prog w-' + world; document.getElementById('hud').className = 'hud w-' + world;
  el.style.top = (SH() + H * 0.015) + 'px';
  el.innerHTML = `<div class="rnd" style="--c:${c}">${round + 1}/${ROUNDS}</div>` + prog.map((ch, i) => `<div class="chip${i < step ? ' done' : i === step ? ' now' : ''}" style="--c:${c}">${ch.name}<small>${ch.deg}</small></div>`).join('');
  document.getElementById('world').textContent = WORLDS[world].name;
}

// ---- Flight and the run of play ------------------------------------------
// each world sets three progressions, each in its own key
const ROUNDS = 3;
let round = 0;
function progDone() {
  round++;
  [659, 784].forEach((f, i) => tone(f, 0.14, 'triangle', 0, 0.05, i * 0.08));
  if (round >= ROUNDS) return worldDone();
  plan(world); step = 0; grip = null; state = 'brief'; document.getElementById('prog').innerHTML = '';
  const w = WORLDS[world];
  overlay(`<div class="kick">PROGRESSION ${round} OF ${ROUNDS} DONE</div><h2 style="--c:${w.c}">Next, in <span>${key}</span></h2>
    <p>${world === 'earth' ? 'Any shape, inside the lit frets' : `Still the ${w.name[0] + w.name.slice(1).toLowerCase()} shape`}: <b>${prog.map(c => c.name).join('  ')}</b></p>
    <span class="go" style="--c:${w.c}" onclick="beginWorld()">Play</span>`, w.c);
}
function arrive(id) {
  world = id; round = 0; plan(id); step = 0; grip = null; state = 'brief'; pick = 'echo'; hint('');
  document.querySelectorAll('#shapes button').forEach(x => x.classList.toggle('sel', x.dataset.s === pick));
  const w = WORLDS[id];
  overlay(`<div class="kick">LANDED</div><h2 style="--c:${w.c}">Planet <span>${w.name[0] + w.name.slice(1).toLowerCase()}</span></h2>
    <p>${w.blurb}</p><p>Complete ${ROUNDS} progressions here. The first is in <b>${key}</b>: <b>${prog.map(c => c.name).join('  ')}</b></p>
    <span class="go" style="--c:${w.c}" onclick="beginWorld()">Play</span>`, w.c);
}
function beginWorld() {
  hideOverlay(); state = 'play'; renderProg();
  document.getElementById('shapes').className = world === 'earth' ? 'shapes on' : 'shapes';
  hint(world === 'earth' ? 'Pick a shape, then tap its root on the glowing string' : 'Tap the root on the glowing string');
}
function worldDone() { hint('');
  cleared[world] = true; state = 'brief';
  document.getElementById('shapes').className = 'shapes';
  document.getElementById('prog').innerHTML = '';
  [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.18, 'triangle', 0, 0.05, i * 0.1));
  if (world === 'earth') return finish();
  const left = ['echo', 'alpha', 'delta'].filter(k => !cleared[k]);
  overlay(`<div class="kick">WORLD CLEARED</div><h2 style="--c:${WORLDS[world].c}"><span>${WORLDS[world].name}</span></h2>
    <p>${left.length ? `Still to visit: <b>${left.map(k => WORLDS[k].name).join(', ')}</b>.` : 'All three worlds visited. <b>Earth</b> is open, and every shape works there.'}</p>
    <span class="go" style="--c:${WORLDS[world].c}" onclick="toMap()">Back to the ship</span>`, WORLDS[world].c);
}
function toMap() { hideOverlay(); state = 'fly'; world = null; resetShip(); flyHud(); }
function flyHud() { document.getElementById('hud').className = 'hud'; document.getElementById('flybar').className = 'flybar on'; document.getElementById('world').textContent = 'IN FLIGHT'; hint(cleared.echo && cleared.alpha && cleared.delta ? 'Earth is open. Follow the gold arrow home' : 'Drag to steer. Fly on into the dark'); }
function overlay(html, c) { document.getElementById('hud').style.visibility = 'hidden'; const o = document.getElementById('over'); o.className = 'over' + (world && state !== 'over' ? ' t-' + world : ''); o.style.setProperty('--c', c || '#f8d24a'); o.innerHTML = html; }
function hideOverlay() { document.getElementById('over').className = 'over hidden'; document.getElementById('hud').style.visibility = ''; }
function frame(t) {
  const dt = lastT ? Math.min(0.05, (t - lastT) / 1000) : 0; lastT = t;
  if (voyaging && (state === 'play' || state === 'fly' || state === 'landing')) time += dt;
  document.getElementById('time').textContent = fmt(time);
  if (state === 'fly') flyStep(dt);
  if (state === 'landing') { flash += dt * 1.6; shipS.p = add(shipS.p, mul(norm(sub(PLANETS[landTo].p, shipS.p)), 3000 * dt)); if (flash >= 1) { flash = 0; document.getElementById('flybar').className = 'flybar'; const to = landTo; landTo = null; arrive(to); } }
  gripT += dt; buzzT = Math.max(0, buzzT - dt * 2);
  parts.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 200 * dt; p.t -= dt * 1.2; }); parts = parts.filter(p => p.t > 0);
  draw();
  requestAnimationFrame(frame);
}

// ---- Start and finish ----------------------------------------------------
function showStart() {
  state = 'title';
  const best = times()[0];
  overlay(`<div class="kick">A SHAPE VOYAGE</div><h2>Planets</h2>
    <p>Pilot your fighter through space to planet <b style="color:var(--echo)">Echo</b>, <b style="color:var(--alpha)">Alpha</b> and <b style="color:var(--delta)">Delta</b>. Each world plays its progression with only its own shape. When all three are done, fly home to <b>Earth</b>, where every shape is yours.</p>
    ${best ? `<div class="lbl">Fastest voyage ${fmt(best.s)} by ${best.i}</div>` : ''}
    <span class="go" onclick="launch()">Launch</span>`);
}
function launch() { cleared = {}; time = 0; misses = 0; voyaging = true; hideOverlay(); state = 'fly'; resetShip(); flyHud(); tone(220, 0.3, 'triangle', 440, 0.05); }
let finalTime = 0;
function finish() {
  state = 'over'; finalTime = time; voyaging = false;
  const list = times(), qualifies = list.length < 10 || finalTime < list[list.length - 1].s;
  overlay(`<div class="kick">HOME</div><h2>Back on <span>Earth</span></h2><div class="big">${fmt(finalTime)}</div>
    <div class="lbl">Four worlds, ${misses ? `${misses} wrong ${misses > 1 ? 'tries' : 'try'}, +${misses * 2}s` : 'not one wrong note'}.</div>
    ${qualifies
      ? `<p>Log your name in the ship's book:</p><div class="ini"><input id="initials" maxlength="3" autocomplete="off" autocapitalize="characters" spellcheck="false"><button onclick="saveTime()">LOG</button></div>`
      : `<span class="go" onclick="launch()">Fly again</span>` + table(-1)}`);
  setTimeout(() => { const i = document.getElementById('initials'); if (i) i.focus(); }, 50);
}
function table(hi) {
  const list = times(); if (!list.length) return '';
  return `<div class="hs-h">FASTEST VOYAGES</div><div class="hs">` + list.map((e, i) => { const k = i === hi ? ' class="me"' : ''; return `<span${k}>${i + 1}</span><span${k}>${e.i}</span><span${k}>${fmt(e.s)}</span>`; }).join('') + '</div>';
}
function saveTime() {
  const raw = (document.getElementById('initials').value || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  const entry = { i: (raw || 'AAA').slice(0, 3).padEnd(3, 'A'), s: +finalTime.toFixed(1) };
  const list = times(); list.push(entry); list.sort((a, b) => a.s - b.s); const top = list.slice(0, 10); store(HS_KEY, JSON.stringify(top));
  overlay(`<div class="kick">HOME</div><h2>Back on <span>Earth</span></h2><div class="big">${fmt(finalTime)}</div><div class="lbl">Logged.</div><span class="go" onclick="launch()">Fly again</span>${table(top.indexOf(entry))}`);
}
document.addEventListener('keydown', e => { if (e.key === 'Enter' && document.getElementById('initials')) saveTime(); });

// ---- Setup ---------------------------------------------------------------
function fit() {
  W = (document.querySelector('.screen').clientWidth - 16) | 0;
  const room = window.innerHeight - document.querySelector('.stage').getBoundingClientRect().top - 100;
  H = Math.max(460, Math.min(Math.round(W * 1.9), room)) | 0;
  dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); cv.style.width = W + 'px'; cv.style.height = H + 'px';
  document.querySelector('.stage').style.height = H + 'px';
  low.width = Math.round(W / 2.6); low.height = Math.round(H / 2.6);
  neckLayout();
  if (world && state === 'play') renderProg();
}
window.addEventListener('resize', fit);
stars = Array.from({ length: 160 }, () => ({ x: Math.random(), y: Math.random(), r: Math.random() < 0.1 ? 2 : 1, b: Math.random(), tw: rand(0.5, 2), ph: rand(0, 6) }));
soundOn = load(SOUND_KEY) !== '0';
document.getElementById('snd').textContent = soundOn ? 'SOUND ON' : 'SOUND OFF';
fit();
document.fonts && document.fonts.ready.then(fit);
showStart();
requestAnimationFrame(frame);
</script>
</body>
</html>
