<style>

<script type="module">
import * as THREE from 'three';
import { Sky } from 'three/addons/objects/Sky.js';
import { EXRLoader } from 'three/addons/loaders/EXRLoader.js';

// ---- the notes ---------------------------------------------------------------------
// all twelve notes, an octave up from C6. A black key goes by one name or the other for a whole round,
// never both at once, so the belts never offer C# and Db side by side.
const NAMES = [['C'], ['C#', 'Db'], ['D'], ['D#', 'Eb'], ['E'], ['F'], ['F#', 'Gb'], ['G'], ['G#', 'Ab'], ['A'], ['A#', 'Bb'], ['B']];
const PCS = NAMES.map((_, i) => i), freq = pc => 1046.5 * Math.pow(2, pc / 12);
let spell = NAMES.map(n => n[0]);
const shown = pc => spell[pc].replace('#', '\u266F').replace(/^([A-G])b$/, '$1\u266D');
const ROUND_S = 60;
const GLYPHS = {"C":"M 402 700 Q 555 700 644 624 Q 733 547 733 405 L 733 405 L 522 405 Q 522 465 491 500 Q 459 535 401 535 L 401 535 Q 334 535 303 493 Q 271 451 271 376 L 271 376 L 271 312 Q 271 238 303 196 Q 334 153 399 153 L 399 153 Q 463 153 496 186 Q 529 219 529 279 L 529 279 L 733 279 Q 733 138 647 63 Q 560 -12 402 -12 L 402 -12 Q 226 -12 136 78 Q 45 168 45 344 L 45 344 Q 45 520 136 610 Q 226 700 402 700 L 402 700 Z","D":"M 372 688 Q 733 688 733 344 L 733 344 Q 733 0 372 0 L 372 0 L 74 0 L 74 688 L 372 688 Z M 295 523 L 295 165 L 368 165 Q 507 165 507 314 L 507 314 L 507 374 Q 507 523 368 523 L 368 523 L 295 523 Z","E":"M 74 0 L 74 688 L 669 688 L 669 523 L 295 523 L 295 428 L 615 428 L 615 270 L 295 270 L 295 165 L 676 165 L 676 0 L 74 0 Z","F":"M 74 0 L 74 688 L 630 688 L 630 523 L 295 523 L 295 405 L 583 405 L 583 247 L 295 247 L 295 0 L 74 0 Z","G":"M 420 700 Q 519 700 598 670 Q 677 640 724 582 Q 770 523 770 439 L 770 439 L 559 439 Q 559 482 521 509 Q 483 535 429 535 L 429 535 Q 351 535 311 494 Q 271 452 271 376 L 271 376 L 271 312 Q 271 236 311 195 Q 351 153 429 153 L 429 153 Q 483 153 521 179 Q 559 204 559 244 L 559 244 L 403 244 L 403 384 L 770 384 L 770 0 L 656 0 L 634 68 Q 540 -12 388 -12 L 388 -12 Q 217 -12 131 78 Q 45 167 45 344 L 45 344 Q 45 519 143 610 Q 240 700 420 700 L 420 700 Z","A":"M 769 0 L 535 0 L 506 97 L 265 97 L 236 0 L 10 0 L 261 688 L 518 688 L 769 0 Z M 384 496 L 311 251 L 460 251 L 388 496 L 384 496 Z","B":"M 532 688 Q 584 688 628 667 Q 671 645 697 606 Q 722 567 722 519 L 722 519 Q 722 392 607 359 L 607 359 L 607 355 Q 738 325 738 183 L 738 183 Q 738 129 712 88 Q 685 46 639 23 Q 593 0 538 0 L 538 0 L 74 0 L 74 688 L 532 688 Z M 295 537 L 295 420 L 447 420 Q 469 420 484 436 Q 498 451 498 474 L 498 474 L 498 484 Q 498 506 483 522 Q 468 537 447 537 L 447 537 L 295 537 Z M 295 278 L 295 160 L 463 160 Q 485 160 500 176 Q 514 191 514 214 L 514 214 L 514 224 Q 514 247 500 263 Q 485 278 463 278 L 463 278 L 295 278 Z"};

const HS_KEY = 'earTrainingBest', SOUND_KEY = 'arcadeSound';
const store = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const load = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
let soundOn = load(SOUND_KEY) !== '0';

// ---- sound: struck steel -------------------------------------------------------------
let ac = null, out = null, noiseBuf = null;
function audio() {
  if (!ac) {
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      const comp = ac.createDynamicsCompressor(); comp.threshold.value = -10; comp.ratio.value = 4;
      out = ac.createGain(); out.gain.value = 0.9; out.connect(comp).connect(ac.destination);
      noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { ac = null; }
  }
  if (ac && ac.state === 'suspended') ac.resume();
  return soundOn && ac;
}
function partial(f, vol, dur, t, dest = out) {
  const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = f;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.002); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(dest); o.start(t); o.stop(t + dur + 0.05);
}
function burst(dur, type, freq, q, vol, t, dest = out) {
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = noiseBuf; s.loop = true; f.type = type; f.frequency.value = freq; f.Q.value = q;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f).connect(g).connect(dest); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
}
// a sheet of steel struck by a pellet: a bright tick, a clear fundamental that rings, quick metal overtones
function ring(pc, when = 0, vol = 0.5, long = 1) {
  if (!audio()) return;
  const t = ac.currentTime + when, f = freq(pc);
  partial(f, vol, 2.2 * long, t); partial(f * 2, vol * 0.12, 0.9 * long, t);
  partial(f * 2.76, vol * 0.18, 0.4 * long, t); partial(f * 5.4, vol * 0.07, 0.15, t);
  partial(f * 1.003, vol * 0.25, 1.8 * long, t);
  burst(0.025, 'highpass', 5000, 0.7, vol * 0.5, t);
}
function dud(pc) {
  if (!audio()) return;
  const t = ac.currentTime, lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1300; lp.connect(out);
  partial(freq(pc), 0.14, 0.15, t, lp); burst(0.1, 'lowpass', 650, 0.8, 0.55, t); partial(140, 0.3, 0.12, t);
}
const sfx = {
  shot() { if (!audio()) return; const t = ac.currentTime; burst(0.012, 'highpass', 3000, 0.7, 0.5, t); burst(0.07, 'bandpass', 1300, 1.2, 0.35, t + 0.004); partial(320, 0.12, 0.04, t); },
  clatter() { if (!audio()) return; const t = ac.currentTime; [0, 0.07, 0.16].forEach((d, i) => burst(0.06, 'bandpass', 2200 - i * 400, 2, 0.25 / (i + 1), t + d)); },
  miss() { if (!audio()) return; burst(0.1, 'lowpass', 500, 0.8, 0.22, ac.currentTime + 0.1); },
  buzz() { if (!audio()) return; const t = ac.currentTime; partial(110, 0.25, 0.5, t); partial(116, 0.2, 0.5, t); },
  tick() { if (!audio()) return; burst(0.02, 'highpass', 6000, 1, 0.2, ac.currentTime); },
};

// ---- the scene -----------------------------------------------------------------------
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.62;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.fog = new THREE.Fog('#d8b894', 45, 260);
const camera = new THREE.PerspectiveCamera(46, 1, 0.03, 20000); scene.add(camera);
const EYE = new THREE.Vector3(0, 1.6, 0), LOOK = new THREE.Vector3(0, 1.15, -14);

// a low desert sun from behind the left shoulder, the sky dusty and warm
const sunDir = new THREE.Vector3().setFromSphericalCoords(1, THREE.MathUtils.degToRad(90 - 22), THREE.MathUtils.degToRad(-30)).normalize();
const sky = new Sky(); sky.scale.setScalar(15000); scene.add(sky);
Object.entries({ turbidity: 8, rayleigh: 1.2, mieCoefficient: 0.008, mieDirectionalG: 0.85 }).forEach(([k, v]) => sky.material.uniforms[k].value = v);
sky.material.uniforms.sunPosition.value.copy(sunDir);
const sun = new THREE.DirectionalLight('#ffd9a8', 3.4); sun.position.copy(sunDir).multiplyScalar(40).add(new THREE.Vector3(0, 0, -14));
sun.target.position.set(0, 0, -14); scene.add(sun, sun.target);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 14, bottom: -14, near: 1, far: 100 });
scene.add(new THREE.HemisphereLight('#f2dcc0', '#7a5a3a', 0.55));
new EXRLoader().load('arcade/junkyard-sky.exr', t => {
  const pm = new THREE.PMREMGenerator(renderer); scene.environment = pm.fromEquirectangular(t).texture; t.dispose(); pm.dispose();
});

// ---- textures, drawn in code ---------------------------------------------------------
const cnv = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const tex = (c, rep = [1, 1], srgb = true) => { const t = new THREE.CanvasTexture(c); if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...rep); t.anisotropy = 8; return t; };
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
function noiseField(n, seed) {
  const g = new Float32Array(n * n); let s = seed * 9301 + 49297;
  for (let i = 0; i < g.length; i++) { s = (s * 9301 + 49297) % 233280; g[i] = s / 233280; }
  return (x, y) => { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const at = (a, b) => g[((b % n + n) % n) * n + ((a % n + n) % n)];
    return (at(xi, yi) * (1 - u) + at(xi + 1, yi) * u) * (1 - v) + (at(xi, yi + 1) * (1 - u) + at(xi + 1, yi + 1) * u) * v; };
}
const fbm = (f, x, y, oct = 4) => { let a = 0, amp = 0.5, fr = 1; for (let i = 0; i < oct; i++) { a += amp * f(x * fr, y * fr); amp *= 0.5; fr *= 2; } return a; };
function paint(w, h, fn) { const c = cnv(w, h), g = c.getContext('2d'), im = g.createImageData(w, h); for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { const [r, gg, b] = fn(x, y), i = (y * w + x) * 4; im.data[i] = r; im.data[i + 1] = gg; im.data[i + 2] = b; im.data[i + 3] = 255; } g.putImageData(im, 0, 0); return c; }
const mix = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));

function sandTex() {
  const n1 = noiseField(32, 3), n2 = noiseField(64, 8);
  return paint(512, 512, (x, y) => {
    const a = fbm(n1, x / 16, y / 16), b = n2(x / 3, y / 3);
    let c = mix([176, 138, 98], [208, 172, 128], a);
    c = mix(c, [128, 96, 66], Math.max(0, 0.42 - a) * 1.8);                 // packed dirt
    if (b > 0.82) c = mix(c, [96, 80, 66], 0.6);                              // gravel
    return mix(c, [0, 0, 0], Math.random() * 0.08);
  });
}
// rusted steel: bare grey worn through orange, dark pits
function rustTex(seed, base = [120, 112, 104]) {
  const n1 = noiseField(32, seed), n2 = noiseField(64, seed + 5);
  return paint(256, 256, (x, y) => {
    const a = fbm(n1, x / 18, y / 18), b = n2(x / 4, y / 4);
    let c = mix(base, [150, 78, 36], Math.min(1, Math.max(0, (a - 0.38) * 2.4)));
    c = mix(c, [74, 40, 22], Math.max(0, b - 0.7) * 2);
    return mix(c, [0, 0, 0], Math.random() * 0.08);
  });
}
// a painted panel, faded and scratched, rust coming through at the edges and in streaks
function paintedTex(colr, seed) {
  const n1 = noiseField(32, seed), n2 = noiseField(32, seed + 11), P = hex(colr);
  return paint(256, 256, (x, y) => {
    const a = fbm(n1, x / 20, y / 20), streak = n2(x / 6, y / 40), edge = Math.min(x, y, 255 - x, 255 - y) / 255;
    let c = mix(P, [236, 226, 210], a * 0.25);                                          // sun-faded
    const rust = Math.max(0, (a - 0.55) * 3) + Math.max(0, (streak - 0.72) * 3) + Math.max(0, 0.06 - edge) * 10;
    c = mix(c, [142, 72, 34], Math.min(1, rust));
    if (Math.random() < 0.004) c = [200, 196, 190];                                     // bright scratches
    return mix(c, [0, 0, 0], Math.random() * 0.07);
  });
}
function beltTex() {
  const c = cnv(256, 64), g = c.getContext('2d'); g.fillStyle = '#26221f'; g.fillRect(0, 0, 256, 64);
  for (let x = 0; x < 256; x += 16) { g.fillStyle = '#3a3430'; g.fillRect(x, 0, 5, 64); g.fillStyle = '#141210'; g.fillRect(x + 5, 0, 2, 64); }
  for (let i = 0; i < 400; i++) { g.fillStyle = `rgba(160,130,100,${Math.random() * 0.2})`; g.fillRect(Math.random() * 256, Math.random() * 64, 2, 1); }
  return c;
}
function dentTex() {
  // a dark crater with a bright rim, where a pellet punched into the sheet
  const c = cnv(64, 64), g = c.getContext('2d'), r = g.createRadialGradient(30, 30, 1, 32, 32, 30);
  r.addColorStop(0, 'rgba(20,16,14,0.95)'); r.addColorStop(0.35, 'rgba(60,52,46,0.85)'); r.addColorStop(0.55, 'rgba(230,226,220,0.7)'); r.addColorStop(0.75, 'rgba(90,80,72,0.3)'); r.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = r; g.fillRect(0, 0, 64, 64); return c;
}
function softDot(rgb) { const c = cnv(64, 64), g = c.getContext('2d'), r = g.createRadialGradient(32, 32, 0, 32, 32, 32); r.addColorStop(0, `rgba(${rgb},1)`); r.addColorStop(1, `rgba(${rgb},0)`); g.fillStyle = r; g.fillRect(0, 0, 64, 64); return c; }

// ---- the yard --------------------------------------------------------------------------
const ground = new THREE.Mesh(new THREE.PlaneGeometry(800, 800), new THREE.MeshStandardMaterial({ map: tex(sandTex(), [160, 160]), roughness: 1, envMapIntensity: 0.6 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const RUST = [0, 1, 2].map(i => new THREE.MeshStandardMaterial({ map: tex(rustTex(20 + i)), roughness: 0.85, metalness: 0.3, envMapIntensity: 0.6 }));
const shadowed = o => { o.traverse(m => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } }); return o; };
function add(geo, mat, x, y, z, rx = 0, ry = 0, rz = 0) { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.rotation.set(rx, ry, rz); m.castShadow = m.receiveShadow = true; scene.add(m); return m; }

// crushed cars stacked like bricks off to the sides, leaving open sky behind the belts
const CAR_COLORS = ['#8a2a22', '#2c4a6e', '#c9b48a', '#3e5a3a', '#6a6a6e', '#b8642a', '#d8d2c4', '#5a2e4a'];
const carMats = CAR_COLORS.map((c, i) => new THREE.MeshStandardMaterial({ map: tex(paintedTex(c, 40 + i)), roughness: 0.75, metalness: 0.35, envMapIntensity: 0.7 }));
const carGeo = new THREE.BoxGeometry(1.7, 0.75, 1.25, 4, 2, 3);
{ const p = carGeo.attributes.position; for (let i = 0; i < p.count; i++) { p.setX(i, p.getX(i) + rnd(-0.04, 0.04)); p.setY(i, p.getY(i) + rnd(-0.04, 0.04)); p.setZ(i, p.getZ(i) + rnd(-0.04, 0.04)); } carGeo.computeVertexNormals(); }
function carStack(x, z, cols, rows, ry = 0) {
  for (let c = 0; c < cols; c++) for (let r = 0; r < rows - (c % 2 && Math.random() < 0.5 ? 1 : 0); r++) {
    const ox = (c - (cols - 1) / 2) * 1.75 + rnd(-0.08, 0.08);
    add(carGeo, pick(carMats), x + Math.cos(ry) * ox, 0.375 + r * 0.76, z - Math.sin(ry) * ox, 0, ry + rnd(-0.08, 0.08), rnd(-0.03, 0.03));
  }
}
carStack(-10.5, -21, 3, 3, 0.6); carStack(11, -23, 3, 4, -0.6); carStack(-14, -34, 4, 3, 0.3); carStack(15, -36, 4, 2, -0.3); carStack(-7.5, -11, 2, 2, 0.9);
// tyres in piles, oil drums, a few sheets of scrap leaning about
const tyreGeo = new THREE.TorusGeometry(0.32, 0.12, 12, 28), tyreMat = new THREE.MeshStandardMaterial({ color: '#1c1a19', roughness: 0.9 });
function tyres(x, z, n) { for (let i = 0; i < n; i++) add(tyreGeo, tyreMat, x + rnd(-0.05, 0.05), 0.12 + i * 0.235, z + rnd(-0.05, 0.05), Math.PI / 2, 0, 0); }
tyres(-4.2, -6, 4); tyres(-4.9, -6.4, 2); tyres(4.6, -11, 5); tyres(-6.5, -16, 3); tyres(7.5, -18, 4);
const drumGeo = new THREE.CylinderGeometry(0.29, 0.29, 0.88, 24);
[[3.8, -5.5, '#2c4a6e'], [4.4, -5.9, '#8a2a22'], [-5.8, -12, '#3e5a3a'], [6.4, -14, '#b8642a'], [-3.6, -20.5, '#2c4a6e']].forEach(([x, z, c], i) =>
  add(drumGeo, new THREE.MeshStandardMaterial({ map: tex(paintedTex(c, 70 + i)), roughness: 0.7, metalness: 0.4 }), x, 0.44, z, 0, rnd(0, 6), 0));
add(drumGeo, RUST[1], -3.2, 0.29, -9, 0, 0.4, Math.PI / 2);

// ---- the conveyor belts: near, middle, far; each runs the other way to the one before -----
const LH = 0.62, K = LH / 700, THICK = 0.014;
const BELTS = [
  { z: -8, h: 0.55, dir: 1, speed: 1.0, gap: 1.85, pts: 100 },
  { z: -13.5, h: 1.35, dir: -1, speed: 1.25, gap: 2.0, pts: 150 },
  { z: -19.5, h: 2.35, dir: 1, speed: 1.5, gap: 2.15, pts: 200 },
];
const HALF = 21, beltMap = tex(beltTex(), [HALF * 2 / 0.5, 1]);
BELTS.forEach((b, bi) => {
  const W = 0.62, g = new THREE.Group(); g.position.set(0, 0, b.z); scene.add(g);
  b.tex = beltMap.clone(); b.tex.needsUpdate = true; b.tex.repeat.set(HALF * 2 / 0.5, 1);
  const rubber = new THREE.MeshStandardMaterial({ map: b.tex, roughness: 0.85, envMapIntensity: 0.4 });
  const top = new THREE.Mesh(new THREE.BoxGeometry(HALF * 2, 0.05, W), [rubber, rubber, rubber, rubber, rubber, rubber]); top.position.y = b.h - 0.025; g.add(top);
  // side rails, legs braced in X, and rollers showing under the belt
  const rail = RUST[bi % 3];
  [-1, 1].forEach(s => { const r = new THREE.Mesh(new THREE.BoxGeometry(HALF * 2, 0.14, 0.05), rail); r.position.set(0, b.h - 0.06, s * (W / 2 + 0.03)); g.add(r); });

      s.vel.y -= 9.8 * dt; s.body.position.addScaledVector(s.vel, dt);
      s.mesh.rotation.x += s.spin * dt; s.mesh.rotation.y += s.spinY * dt;
      if (s.body.position.y < 0.05) { s.state = 'gone'; s.body.visible = false; sprites(s.body.position.clone().setY(0.1), dustTex, '#c8a880', 5, 0.25, 0.6, 0.6, 1, -0.3); }
    } else if (s.state === 'gone') {
      // the empty spot rides on round to come back with a new letter
      s.x += s.belt.dir * s.belt.speed * dt;
      if (Math.abs(s.x) > HALF) { s.x -= Math.sign(s.x) * HALF * 2; dress(s, pick(PCS)); place(s); }
    }
  });
  if (state === 'play' && note && Math.floor(simT * 2) !== Math.floor((simT - dt) * 2)) ensureNote();
  camera.position.set(EYE.x + Math.sin(simT * 0.7) * 0.004, EYE.y + Math.sin(simT * 1.1) * 0.004, EYE.z); camera.lookAt(LOOK);
  recoil = Math.max(0, recoil - dt * 5); aimRifle(); recoilG.position.z = -recoil * 0.035; recoilG.rotation.x = recoil * 0.05;
  sign.tick(dt); tickFX(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

// ---- input -------------------------------------------------------------------------------
canvas.addEventListener('pointerdown', e => shoot(e.clientX, e.clientY));
$('intro').style.pointerEvents = 'none';
canvas.addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse') return;
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(ndc, camera); ray.ray.at(14, aimAt);
});
$('replay').addEventListener('click', () => { if (state === 'play' && note) playNote(); });
$('snd').addEventListener('click', () => { soundOn = !soundOn; store(SOUND_KEY, soundOn ? '1' : '0'); $('snd').textContent = soundOn ? 'SOUND ON' : 'SOUND OFF'; });
$('snd').textContent = soundOn ? 'SOUND ON' : 'SOUND OFF';
document.addEventListener('keydown', e => {
  if (e.key === ' ' && state === 'play') { e.preventDefault(); if (note) playNote(); }
});
function fit() {
  const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h;
  camera.fov = w < h ? 46 : 32; camera.updateProjectionMatrix();
  rifle.position.set(w < h ? 0.1 : 0.2, w < h ? -0.2 : -0.24, 0.2);
}
addEventListener('resize', fit);
document.addEventListener('visibilitychange', () => { if (!document.hidden) last = 0; });
fit();
ALL.forEach(s => { dress(s, pick(PCS)); place(s); });
requestAnimationFrame(frame);
window.yardDebug = { sign, ALL, dress, setSpell: v => spell = v, EYE, LOOK, camera, get note() { return note; }, get state() { return state; }, shoot, onScreen };
</script>
</body>
