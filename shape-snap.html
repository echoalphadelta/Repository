<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Echo Alpha Delta">
<meta name="application-name" content="Echo Alpha Delta">
<title>Shape Snap | Echo Alpha Delta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* Pocket theme: four greens of an old handheld screen */
:root { --g0: #0f380f; --g1: #306230; --g2: #8bac0f; --g3: #9bbc0f; --row: 36px; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--g3); }
body { color: var(--g0); font-family: 'Press Start 2P', monospace; font-size: 10px; line-height: 1.5; -webkit-user-select: none; user-select: none; }
a, button { font: inherit; color: inherit; }
.screen { max-width: 680px; margin: 0 auto; padding: 10px 12px 18px; }

.top { display: flex; justify-content: space-between; align-items: center; height: 26px; }
.top a { text-decoration: none; }
.top button { background: none; border: none; padding: 0; cursor: pointer; }
.top a:active, .top button:active { background: var(--g0); color: var(--g3); }

.title { margin: 14px 0 10px; font-size: 14px; }

/* The neck: nut on the left, body on the right, high e on top */
.game { position: relative; }
.neckrow { display: flex; align-items: stretch; }
.slabels { display: grid; grid-auto-rows: var(--row); width: 16px; font-size: 8px; padding-top: 3px; }
.slabels span { line-height: var(--row); color: var(--g1); }
.neck { flex: 1; display: grid; grid-auto-rows: var(--row); background: var(--g2); border-top: 3px solid var(--g0); border-bottom: 3px solid var(--g0); position: relative; }
.c { position: relative; border-right: 2px solid var(--g1); }
.c::before { content: ''; position: absolute; left: 0; right: 0; top: 50%; border-top: var(--sw, 1px) solid rgba(15,56,15,0.55); }
.c.open { border-right: 7px solid var(--g0); background: var(--g3); }
.c.last { border-right: none; }
.c.inlay::after { content: ''; position: absolute; left: 50%; top: 100%; width: 7px; height: 7px; margin: -3px 0 0 -3px; background: var(--g1); z-index: 1; }
.c.p, .c.b, .c.f { border-style: solid; border-width: 3px; }
.c.p::before, .c.b::before, .c.f::before, .c.p::after, .c.b::after, .c.f::after { display: none; }
.c.p { background: var(--g1); border-color: var(--g2) var(--g0) var(--g0) var(--g2); }
.c.b { background: var(--g0); border-color: var(--g1) var(--g0) var(--g0) var(--g1); }
.c.f { background: var(--g3); border-color: var(--g3) var(--g1) var(--g1) var(--g3); }
.body { width: 7px; background: var(--g0); }
.fnums { display: grid; margin-left: 16px; margin-right: 7px; font-size: 7px; text-align: center; margin-top: 5px; }
.fnums span { color: var(--g1); }
.fnums span.mk { color: var(--g0); }

.panel { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 14px; }
.box { border: 3px solid var(--g0); padding: 6px 6px 5px; min-width: 0; }
.box .k { font-size: 8px; color: var(--g1); }
.box .v { font-size: 12px; margin-top: 4px; }
.box.wide { grid-column: span 2; }
.now .v { font-size: 26px; margin-top: 8px; line-height: 1.1; }
.now.shift .v { animation: shift 0.12s steps(1) 6; }
@keyframes shift { 50% { background: var(--g0); color: var(--g3); } }
.next { display: grid; grid-auto-rows: 9px; gap: 1px; margin-top: 6px; }
.next div { background: rgba(15,56,15,0.08); }
.next .p { background: var(--g1); }
.msg { grid-column: span 3; min-height: 18px; font-size: 10px; text-align: center; }

.pad { display: flex; justify-content: center; margin-top: 10px; }
.drop { display: flex; flex-direction: column; align-items: center; gap: 6px; background: none; border: none; padding: 0; cursor: pointer; touch-action: manipulation; }
.drop i { display: block; width: 200px; height: 56px; border-radius: 28px; background: #8b1d4a; box-shadow: inset -4px -5px 0 #5c1031, 0 3px 0 #3a2a30; }
.drop:active i, .drop.down i { transform: translateY(3px); box-shadow: inset -2px -2px 0 #5c1031, 0 0 0 #3a2a30; }
.drop span { font-size: 10px; letter-spacing: 2px; }

.over { position: absolute; inset: -6px; z-index: 5; background: var(--g3); border: 4px solid var(--g0); padding: 12px; font-size: 10px; line-height: 1.8; overflow: auto; }
.over.hidden { display: none; }
.over h2 { font-size: 16px; font-weight: 400; margin: 0 0 10px; line-height: 1.4; }
.over p { margin: 0 0 8px; }
.over .inv { background: var(--g0); color: var(--g3); padding: 2px 6px; }
.over .go { cursor: pointer; display: inline-block; margin-top: 6px; animation: bl 1s steps(1) infinite; }
@keyframes bl { 50% { visibility: hidden; } }
.hs div { white-space: pre; }
.hs .me { background: var(--g0); color: var(--g3); }
.ini { display: flex; gap: 8px; align-items: center; margin: 8px 0; }
.ini input { width: 76px; font: inherit; font-size: 16px; letter-spacing: 4px; text-transform: uppercase; background: var(--g3); color: var(--g0); border: none; border-bottom: 4px solid var(--g0); border-radius: 0; padding: 2px 0 2px 4px; }
.ini input:focus { outline: none; }
.ini button { background: var(--g0); color: var(--g3); border: none; padding: 6px 8px; cursor: pointer; border-radius: 0; }
</style>
</head>
<body>
<div class="screen">
  <div class="top">
    <a href="arcade.html">&lt; ARCADE</a>
    <button id="snd" onclick="toggleSound()">SND ON</button>
  </div>
  <div class="title">SHAPE SNAP</div>

  <div class="game">
    <div class="neckrow">
      <div class="slabels"><span>e</span><span>B</span><span>G</span><span>D</span><span>A</span><span>E</span></div>
      <div class="neck" id="neck"></div>
      <div class="body"></div>
    </div>
    <div class="fnums" id="fnums"></div>

    <div class="panel">
      <div class="box"><div class="k">SCORE</div><div class="v" id="score">000000</div></div>
      <div class="box"><div class="k">LEVEL</div><div class="v" id="level">01</div></div>
      <div class="box"><div class="k">STREAK</div><div class="v" id="streak">00</div></div>
      <div class="box wide now" id="nowBox"><div class="k">CHORD</div><div class="v" id="now">&nbsp;</div></div>
      <div class="box"><div class="k">NEXT</div><div class="next" id="next"></div></div>
      <div class="msg" id="msg"></div>
    </div>
    <div class="over" id="over"></div>
  </div>

  <div class="pad">
    <button class="drop" id="dropBtn"><i></i><span>DROP</span></button>
  </div>
</div>

<script>
// ---- Shape engine (same grips as the Daily Game) -------------------------
const STR_OPEN = [4, 9, 2, 7, 11, 4];
const PC_NAMES = ['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
const QUAL_MAP = { '':'major','m':'minor','7':'7','maj7':'Maj7','m7':'m7','sus4':'sus4' };
const QUALITY_INTERVALS_MAIN = {
  major:[0,4,7], minor:[0,3,7], '7':[0,4,7,10], Maj7:[0,4,7,11], m7:[0,3,7,10], sus4:[0,4,7],
};
const TONE_NAMES_MAIN = {
  0:'root',2:'ninth',3:'minor-third',4:'third',5:'fourth',7:'fifth',9:'sixth',10:'seventh',11:'maj7',
};
const GRIP_CONFIG = {
  echo:  { anchor:0, strings:[0,1,2,3,4,5], win:2, upper:[3,4,5] },
  alpha: { anchor:1, strings:[1,2,3,4,5],   win:2, upper:[3,4,5] },
  delta: { anchor:2, strings:[2,3,4,5],      win:3, upper:[5]     },
};

function findFrets(si, pc) {
  const out = [];
  for (let f = 0; f <= 12; f++) if ((STR_OPEN[si] + f) % 12 === pc) out.push(f);
  return out;
}
function computeGripTones(shapeName, qualStr, rootPc) {
  const quality   = QUAL_MAP[qualStr] || 'major';
  const r         = rootPc % 12;
  const intervals = QUALITY_INTERVALS_MAIN[quality];
  const { anchor, strings, win, upper } = GRIP_CONFIG[shapeName];
  const anchorFret = findFrets(anchor, r)[0];
  if (anchorFret === undefined) return new Set();
  const isSus = quality === 'sus4', suppressUpperRoot = quality === '7';
  const echoSlideback = shapeName === 'echo' && quality === 'Maj7';
  const dots = [];
  strings.forEach(s => {
    for (let fo = 0; fo <= win; fo++) {
      let f = anchorFret + fo;
      if (f > 12) f -= 12;
      if (f > 12) continue;
      const noteAtFret = (STR_OPEN[s] + f) % 12;
      intervals.forEach(interval => {
        if (noteAtFret !== (r + interval) % 12) return;
        if (shapeName === 'delta' && (interval === 4 || interval === 3) && s !== 5) return;
        const isThird = interval === 4 || interval === 3;
        const isUpperStr = upper.includes(s);
        const isUpperRoot = interval === 0 && isUpperStr && s !== anchor;
        if (suppressUpperRoot && isUpperRoot && fo > 0) return;
        if (echoSlideback && interval === 11) return;
        if (isSus && isThird && isUpperStr) {
          const sf = f + 1 > 12 ? f - 11 : f + 1;
          dots.push({ s, fret:sf, t:'fourth', isRoot:false });
        } else {
          const t = TONE_NAMES_MAIN[interval] || 'tone';
          dots.push({ s, fret:f, t, isRoot:interval === 0 });
          if (f === 12) dots.push({ s, fret:0,  t, isRoot:interval === 0 });
          if (f === 0)  dots.push({ s, fret:12, t, isRoot:interval === 0 });
        }
      });
    }
  });
  if (echoSlideback) {
    const target = (r + 11) % 12;
    for (let f2 = 0; f2 <= 12; f2++) {
      if ((STR_OPEN[5] + f2) % 12 === target) { dots.push({ s:5, fret:f2, t:'maj7', isRoot:false }); break; }
    }
  }
  const byStr = {};
  dots.forEach(d => { (byStr[d.s] = byStr[d.s] || []).push(d); });
  const priority = ['sixth','ninth','seventh','maj7','fourth','fifth','minor-third','third','root'];
  const result = new Set();
  Object.entries(byStr).forEach(([sStr, group]) => {
    const s = parseInt(sStr);
    let pick;
    if (group.length === 1) { pick = group[0]; }
    else if (s === anchor) { pick = group.find(d => d.isRoot) || group[0]; }
    else {
      group.sort((a,b) => {
        const ai = priority.indexOf(a.t), bi = priority.indexOf(b.t);
        return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
      });
      pick = group[0];
    }
    result.add(`${pick.fret}-${s}`);
  });
  return result;
}

// The neck lies sideways: columns are frets (0 = open, at the nut), rows are strings (high e on top).
// Grips slide from the nut toward the body. Misses pile up against the body.
const NF = 14, COLS = NF + 1, ROWS = 6;
const STR_W = [3, 2.5, 2, 1.5, 1.2, 1];   // drawn thickness, low E to high e
const SHAPES = ['echo', 'alpha', 'delta'];
const QUAL_LABEL = { '':'', 'm':'m', '7':'7', 'maj7':'maj7', 'm7':'m7', 'sus4':'sus4' };
const HS_KEY = 'shapeSnapScores', SOUND_KEY = 'arcadeSound';

let wall, piece, nextPiece, score, level, landed, streak, state = 'start', timer = null, busy = false;
let soundOn = true;

function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function load(k)     { try { return localStorage.getItem(k); } catch (e) { return null; } }
function highScores() { try { return JSON.parse(load(HS_KEY)) || []; } catch (e) { return []; } }
const pad = (n, w) => String(n).padStart(w, '0');
const rowOf = s => 5 - s;   // string index to screen row
const wallStart = () => COLS - wall;   // first fret column taken by the wall

function qualitiesForLevel() {
  if (level <= 2) return [''];
  if (level === 3) return ['', 'm', '7'];
  if (level === 4) return ['', 'm', '7', 'maj7', 'm7'];
  return ['', 'm', '7', 'maj7', 'm7', 'sus4'];
}
function shapeShiftChance()   { return level < 2 ? 0 : Math.min(0.6, 0.25 + (level - 2) * 0.08); }
function qualityShiftChance() { return level < 4 ? 0 : Math.min(0.4, 0.15 + (level - 4) * 0.06); }
function tickMs() { return Math.max(170, Math.round(640 * Math.pow(0.87, level - 1))); }

// A grip as it sits on the real neck. target = the fret its lowest note belongs on.
function grip(shape, q, root) {
  const af = findFrets(GRIP_CONFIG[shape].anchor, root)[0];
  if (af < 1 || af > 10) return null;
  const pts = [...computeGripTones(shape, q, root)].map(k => { const [f, s] = k.split('-').map(Number); return { f, s }; });
  if (!pts.length) return null;
  const min = Math.min(...pts.map(p => p.f)), max = Math.max(...pts.map(p => p.f));
  if (max - min > 4 || max >= wallStart()) return null;
  return { shape, q, root, name: PC_NAMES[root] + QUAL_LABEL[q], target: min, w: max - min + 1,
           cells: pts.map(p => ({ c: p.f - min, r: rowOf(p.s) })) };
}

function makePiece() {
  const quals = qualitiesForLevel();
  for (let tries = 0; tries < 300; tries++) {
    const g = grip(SHAPES[Math.floor(Math.random() * 3)], quals[Math.floor(Math.random() * quals.length)], Math.floor(Math.random() * 12));
    if (!g) continue;
    g.shift = planShift(g);
    return g;
  }
}

// Decide whether this piece will morph on the way up the neck, and into what
function planShift(g) {
  const roll = Math.random();
  if (roll < shapeShiftChance()) {
    const others = SHAPES.filter(s => s !== g.shape).sort(() => Math.random() - 0.5);
    for (const s of others) {
      const n = grip(s, g.q, g.root);
      if (n && Math.abs(n.target - g.target) >= 2) return { into: n, at: Math.max(-1, Math.min(g.target, n.target) - 3) };
    }
  } else if (roll < shapeShiftChance() + qualityShiftChance()) {
    const quals = qualitiesForLevel().filter(q => q !== g.q);
    const n = grip(g.shape, quals[Math.floor(Math.random() * quals.length)], g.root);
    if (n) return { into: n, at: Math.max(-1, g.target - 3) };
  }
  return null;
}

function fits(cells, x) {
  return cells.every(({ c, r }) => {
    return x + c < wallStart();
  });
}

// Sound
let audio = null;
function beep(freq, dur) {
  if (!soundOn) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = 'square'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.045, audio.currentTime);
    g.gain.setValueAtTime(0, audio.currentTime + dur);
    o.connect(g); g.connect(audio.destination);
    o.start(); o.stop(audio.currentTime + dur + 0.01);
  } catch (e) {}
}
function toggleSound() {
  soundOn = !soundOn;
  store(SOUND_KEY, soundOn ? '1' : '0');
  document.getElementById('snd').textContent = soundOn ? 'SND ON' : 'SND OFF';
}

// Neck layout: open column, then frets that narrow like a real neck
const colTemplate = '22px ' + Array.from({ length: NF }, (_, i) => Math.pow(2, -i / 12).toFixed(3) + 'fr').join(' ');
function buildNeck() {
  const neck = document.getElementById('neck');
  neck.style.gridTemplateColumns = colTemplate;
  let h = '';
  for (let r = 0; r < ROWS; r++) for (let f = 0; f <= NF; f++) {
    const cls = ['c'];
    if (f === 0) cls.push('open');
    if (f === NF) cls.push('last');
    // inlays sit between the G and D strings (rows 2 and 3); 12 gets two
    if ((r === 2 && [3, 5, 7, 9].includes(f)) || ((r === 1 || r === 3) && f === 12)) cls.push('inlay');
    h += `<div class="${cls.join(' ')}" style="--sw:${STR_W[5 - r]}px"></div>`;
  }
  neck.innerHTML = h;
  const nums = document.getElementById('fnums');
  nums.style.gridTemplateColumns = colTemplate;
  nums.innerHTML = Array.from({ length: COLS }, (_, f) => `<span class="${[3, 5, 7, 9, 12].includes(f) ? 'mk' : ''}">${f > 12 ? '' : f}</span>`).join('');
}

function render(flash) {
  const cells = document.getElementById('neck').children;
  for (let r = 0; r < ROWS; r++) for (let f = 0; f <= NF; f++) {
    const el = cells[r * COLS + f];
    el.classList.remove('p', 'b', 'f');
    if (f >= wallStart()) el.classList.add('b');
  }
  if (piece) piece.cells.forEach(({ c, r }) => {
    const col = piece.x + c;
    if (col >= 0 && col <= NF) { const el = cells[r * COLS + col]; el.classList.remove('b'); el.classList.add(flash ? 'f' : 'p'); }
  });
  document.getElementById('now').innerHTML = piece && state === 'playing' ? piece.name : '&nbsp;';
}
function renderNext() {
  const box = document.getElementById('next');
  box.style.gridTemplateColumns = 'repeat(5, 9px)';
  const on = new Set(nextPiece ? nextPiece.cells.map(({ c, r }) => r + '-' + c) : []);
  let h = '';
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < 5; c++) h += `<div class="${on.has(r + '-' + c) ? 'p' : ''}"></div>`;
  box.innerHTML = h;
}
function hud() {
  document.getElementById('score').textContent = pad(score, 6);
  document.getElementById('level').textContent = pad(level, 2);
  document.getElementById('streak').textContent = pad(streak, 2);
}
function say(t) { document.getElementById('msg').innerHTML = t; }

// Flow
function spawn() {
  // the wall may have grown since the next piece was chosen
  piece = nextPiece && nextPiece.target + nextPiece.w <= wallStart() ? nextPiece : makePiece();
  if (!piece) { gameOver(); return; }
  piece.x = 1 - piece.w;   // enters through the nut
  nextPiece = makePiece();
  renderNext();
  render();
}

function morph() {
  const n = piece.shift.into;
  piece.shift = null;
  if (!fits(n.cells, piece.x)) return;
  Object.assign(piece, { shape: n.shape, q: n.q, name: n.name, target: n.target, w: n.w, cells: n.cells });
  say('SHIFT!');
  const box = document.getElementById('nowBox');
  box.classList.remove('shift'); void box.offsetWidth; box.classList.add('shift');
  [660, 880, 660].forEach((f, i) => setTimeout(() => beep(f, 0.04), i * 50));
}

// A miss slams into the body end and becomes one more column of the wall
function miss() {
  streak = 0; hud();
  say('MISS');
  busy = true;
  const slam = setInterval(() => {
    if (fits(piece.cells, piece.x + 1)) { piece.x++; render(); return; }
    clearInterval(slam);
    piece = null;
    wall++;
    render();
    beep(110, 0.06); setTimeout(() => beep(70, 0.14), 60);
    busy = false;
    if (wallStart() <= 3) { gameOver(); return; }
    spawn();
  }, 22);
}

function tick() {
  if (state !== 'playing' || busy || !piece) return;
  if (fits(piece.cells, piece.x + 1)) {
    piece.x++;
    if (piece.shift && piece.x >= piece.shift.at) morph();
    render();
  } else miss();
}

function restartTimer() { clearInterval(timer); timer = setInterval(tick, tickMs()); }

function drop() {
  if (state !== 'playing' || busy || !piece) return;
  const btn = document.getElementById('dropBtn');
  btn.classList.add('down'); setTimeout(() => btn.classList.remove('down'), 120);
  const off = Math.abs(piece.x - piece.target);
  if (off > 1) { miss(); return; }
  busy = true;
  landed++;
  if (off === 0) {
    streak++;
    score += (300 + 50 * Math.min(streak, 10)) * level;
    say('PERFECT');
    beep(1047, 0.05); setTimeout(() => beep(1568, 0.08), 60);
  } else {
    streak = 0;
    score += 100 * level;
    say('GOOD');
    beep(880, 0.06);
  }
  let n = 0;
  const blink = setInterval(() => {
    render(n % 2 === 0); n++;
    if (n > 4) {
      clearInterval(blink);
      busy = false;
      if (landed % 10 === 0) { level++; say(`LEVEL ${pad(level, 2)}`); restartTimer(); [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.06), i * 80)); }
      hud(); spawn();
    }
  }, 70);
}

// Screens
function scoreTable(hi) {
  const list = highScores();
  if (!list.length) return '<p>NO SCORES YET</p>';
  return '<div class="hs">' + list.map((r, i) => `<div class="${i === hi ? 'me' : ''}">${String(i + 1).padStart(2, ' ')} ${r.i} ${pad(r.s, 6)}</div>`).join('') + '</div>';
}
function overlay(html) { const o = document.getElementById('over'); o.className = 'over'; o.innerHTML = html; }

function showStart() {
  state = 'start';
  overlay(`<h2>SHAPE SNAP</h2>
    <p>HIT <span class="inv">DROP</span> WHEN THE GRIP REACHES THE FRET WHERE IT PLAYS THE CHORD BELOW.</p>
    ${scoreTable(-1)}
    <span class="go" onclick="startGame()">PUSH START</span>`);
}

function startGame() {
  wall = 0;
  score = 0; level = 1; landed = 0; streak = 0; busy = false;
  nextPiece = makePiece();
  document.getElementById('over').className = 'over hidden';
  say(''); hud();
  state = 'playing';
  spawn(); restartTimer();
  beep(660, 0.06);
}

function gameOver() {
  state = 'over'; clearInterval(timer); render();
  [392, 330, 262, 196].forEach((f, i) => setTimeout(() => beep(f, 0.12), i * 130));
  const list = highScores();
  const qualifies = score > 0 && (list.length < 10 || score > list[list.length - 1].s);
  setTimeout(() => overlay(`<h2>GAME OVER</h2>
    <p>SCORE <span class="inv">${pad(score, 6)}</span></p>
    <p>LEVEL ${pad(level, 2)}  LANDED ${pad(landed, 3)}</p>
    ${qualifies
      ? `<p>NEW HIGH SCORE! ENTER INITIALS</p><div class="ini"><input id="initials" maxlength="3" autocomplete="off" autocapitalize="characters" spellcheck="false"><button onclick="saveScore()">OK</button></div>`
      : scoreTable(-1) + '<span class="go" onclick="startGame()">PUSH START</span>'}`), 400);
}

function saveScore() {
  const raw = (document.getElementById('initials').value || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  const entry = { i: (raw || 'AAA').slice(0, 3).padEnd(3, 'A'), s: score };
  const list = highScores(); list.push(entry); list.sort((a, b) => b.s - a.s);
  const top = list.slice(0, 10);
  store(HS_KEY, JSON.stringify(top));
  overlay(`<h2>GAME OVER</h2><p>SCORE <span class="inv">${pad(score, 6)}</span></p>${scoreTable(top.indexOf(entry))}<span class="go" onclick="startGame()">PUSH START</span>`);
}

// Input
document.getElementById('dropBtn').addEventListener('pointerdown', e => { e.preventDefault(); drop(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.getElementById('initials')) { saveScore(); return; }
  if (e.key === ' ' || e.key === 'ArrowDown') { e.preventDefault(); drop(); }
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden && state === 'playing') { state = 'paused'; clearInterval(timer); }
  else if (!document.hidden && state === 'paused') { state = 'playing'; restartTimer(); }
});

soundOn = load(SOUND_KEY) !== '0';
document.getElementById('snd').textContent = soundOn ? 'SND ON' : 'SND OFF';
buildNeck();
wall = 0;
score = 0; level = 1; landed = 0; streak = 0;
nextPiece = makePiece(); renderNext(); render(); hud();
showStart();
</script>
</body>
</html>
